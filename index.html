Oxygenation is oxygen transfer into blood. SpO2 estimates the proportion of haemoglobin carrying oxygen. Ventilation is movement of gas sufficient to clear carbon dioxide; it depends on effective tidal volume as well as respiratory rate. Perfusion is blood flow delivering oxygen to tissues.

A patient can have SpO2 98% while bleeding to death: the remaining haemoglobin is well saturated, but there may be too little haemoglobin and too little cardiac output. A patient receiving oxygen can retain CO2 while SpO2 stays normal. A rapid RR with tiny shallow breaths may provide inadequate alveolar ventilation.

Useful relationships for explaining cases:

Cardiac output = heart rate × stroke volume.

Arterial pressure depends on cardiac output and systemic vascular resistance.

Oxygen delivery depends on cardiac output and arterial oxygen content; haemoglobin concentration is central to oxygen content.

Effective alveolar ventilation depends on respiratory rate × (tidal volume − dead-space volume).

Apply it: the RVMI patient has both a slow rate and impaired forward flow. The amputee has reduced filling volume and oxygen-carrying capacity. The septic patient has vasodilation, leak and potentially myocardial dysfunction. The asthmatic child is moving inadequate air. Calling all four “low BP/low sats” misses the treatment target.

Read a set of observations in this order

1. Check reliability: correct cuff/probe, pulse waveform, movement, cold extremities, room air versus oxygen, and when readings were taken.

2. Describe severity using appearance, interaction, speech, breathing effort, pulse and skin—not a score alone.

3. Identify the dominant problem: airway obstruction, oxygenation failure, ventilation failure, circulatory failure, neurological dysfunction or several together.

4. Explain compensation: tachycardia, vasoconstriction and tachypnoea may preserve function temporarily.

5. Identify failing compensation: fatigue, slowing respiratory effort, reduced consciousness, hypotension or bradycardia in a critically ill child.

6. Compare with previous observations and the treatment just given.

Uploaded observations: RVMI: HR 44, BP 82/54, clammy, CRT 4 s, SpO2 96%
Interpretation: Severe circulatory compromise despite acceptable saturation
Treatment implication: Protect circulation, urgent reperfusion support; GTN inappropriate with this BP/rate

Uploaded observations: Sepsis: HR 128, BP 84/48, RR 30, oliguria/confusion
Interpretation: Suspected infection with organ dysfunction and poor perfusion
Treatment implication: Resuscitate and expedite definitive care; don't focus on fever alone

Uploaded observations: Asthma age 8: RR 12 shallow, SpO2 82%, silent chest, drowsy
Interpretation: Respiratory failure, not mild asthma
Treatment implication: Immediate assisted ventilation as needed, indicated rescue medicines and escalation

Uploaded observations: Amputation: SpO2 98%, HR 138, BP 84/52
Interpretation: Severe haemorrhagic shock with preserved saturation
Treatment implication: Stop bleeding and restore perfusion; oxygen alone cannot correct blood loss

Uploaded observations: Mixed poisoning age 4: SpO2 99%, GCS 8, BP 70/40
Interpretation: Threatened airway and severe toxic illness
Treatment implication: Support airway/ventilation; serial ECG and urgent toxicology/advanced support

A rough MAP calculation is (SBP + 2 × DBP)/3. For 84/48, MAP is 60 mmHg. This supports concern in the context of confusion and oliguria; it is not a stand-alone diagnosis or universal resuscitation target. HR/SBP gives a shock index of about 1.52 in that adult, but age, medication and the cause of shock affect its meaning.

Ageappropriate comparison

The following are RCH acceptable ranges in unwell children, not rigid healthy resting norms, QAS drug thresholds or reassurance that a child is safe. Trends and appearance take priority. Use the designated QAS/UniSC observation chart for your assessment.

Age: 2 years
HR/min: 95–150
RR/min: 20–40
Systolic BP mmHg: 70–105

Age: 4 years
HR/min: 80–150
RR/min: 17–30
Systolic BP mmHg: 75–110

Age: 6 years
HR/min: 75–140
RR/min: 16–30
Systolic BP mmHg: 80–115

Age: 8 years
HR/min: 70–130
RR/min: 16–30
Systolic BP mmHg: 80–115

For adult recall, a resting HR around 60–100/min and RR around 12–20/min are useful starting points; BP must be interpreted against baseline and perfusion. There is no single universal “normal BGL”: feeding state and diabetes matter, and treatment thresholds come from the relevant CPG. BGL 4.0 in an unresponsive hypoxic child does not explain away respiratory failure.

Source: RCH physiological ranges.
Source links: RCH physiological ranges: https://www.rch.org.au/clinicalguide/guideline_index/Normal_Ranges_for_Physiological_Variables/`},{id:`dispatch-reasoning`,title:`Four incomplete dispatches: evidence before diagnosis`,source:`Study Bible`,text:`These answers cover red flags, differential ranking, evidence gathering, provisional diagnoses, pathology and management branches. Dispatch codes and initial priority cannot substitute for clinical assessment.

Elderly patient with altered sensation

Red flags: new focal neurological symptoms, unclear onset, possible stroke, hypoglycaemia or intracranial bleeding. “Altered sensation” may mean numbness, confusion or dizziness; clarify the actual complaint.

First three threats: stroke/TIA, hypoglycaemia, and another acute neurological process such as seizure-related deficit or intracranial injury. Assess ABCs, BGL, full neurological pattern, last known well, anticoagulants, headache, trauma and baseline function. Ask whether symptoms were sudden and maximal at onset.

Two defensible branches: a persistent focal deficit with normal glucose favours stroke; low glucose with global or focal dysfunction favours a metabolic mimic. Treat an identified low glucose and reassess—improvement does not justify ignoring a persistent deficit. A field examination cannot reliably distinguish haemorrhagic from ischaemic stroke. Explain neuronal energy failure and the importance of time-dependent imaging/reperfusion assessment. Do not give aspirin merely because stroke is suspected. Practise station 8, then 41.

Unconscious 20yearold after a fall

Red flags: airway loss, hypoventilation, intracranial injury and occult bleeding. Determine whether collapse caused the fall: epilepsy, dysrhythmia, hypoglycaemia and poisoning remain possible.

Evidence: scene/mechanism, witnessed sequence, height, head impact, anticoagulants, GCS components, pupils, glucose, ECG and chest/abdominal/pelvic findings. Protect the spine when indicated while opening the airway and supporting ventilation. Hypoxia and hypotension can worsen secondary brain injury.

Branches: traumatic brain injury with other injuries versus a primary medical collapse with secondary trauma. An isolated head injury usually does not explain major haemorrhagic shock; actively look elsewhere. Hospital needs may include CT, neurosurgery or treatment of a medical cause. Practise station 42.

Yelling and screaming patient with QPS present

Red flags: danger to patient/bystanders, delirium, intoxication, hypoxia, hypoglycaemia or hyperthermia. Police involvement does not prove psychiatric disease or remove the need for consent/capacity assessment.

Evidence: safe approach, one calm communicator, personal space, behaviour/SAT, onset and baseline, glucose/temperature/oxygenation when achievable, drugs, trauma and medical illness. Ask directly about distress and what would help. Obtain collateral information without allowing a label to replace examination.

Branches: acute medical/toxic delirium versus a primary mental-health crisis. Treat underlying physiology and use the least restrictive effective approach. Any sedation must meet the current indication, scope and monitoring requirements; anticipate respiratory depression. Explain capacity and transport decisions using the actual applicable guidance, not “QPS said so”. Practise station 43.

Nausea with changing colour at 03 00

Red flags: “changing colour” may mean pallor, cyanosis or mottling. Nausea can accompany ACS, shock or severe respiratory compromise.

First three threats: ACS/arrhythmia, respiratory failure (including PE where supported), and shock from another cause. Ask about dyspnoea, chest/epigastric discomfort, sweating, syncope, bleeding, medication and exposures. Obtain ECG early, glucose and a complete perfusion/respiratory assessment.

Branches: cardiac ischaemia with autonomic symptoms versus hypoxaemia/poor perfusion from a non-coronary cause. An antiemetic alone treats a symptom while potentially missing the emergency. Practise station 44.`},{id:`cbl-5-airway-collapse`,title:`CBL 5: the two-year-old with stridor and collapse`,source:`Study Bible`,text:`Provisional formulation: severe upper airway obstruction with hypoxic respiratory failure, progressing to respiratory/cardiac arrest. Croup is plausible from the febrile cough and stridor, but the supplied history does not conclusively distinguish croup, bacterial upper-airway disease or foreign body.

Interpretation: unresponsiveness, HR 50, RR 60 with extreme work, SpO2 89%, mottling and prolonged refill describe a peri-arrest child. When breathing stops, the task has changed from managing a distressed child to resuscitation. Do not spend five minutes completing a history or croup score.

Pathology: narrowing increases airway resistance. The child initially compensates by working harder, then fatigues. Poor gas exchange causes hypoxaemia and CO2 retention; myocardial hypoxia contributes to bradycardia, low cardiac output and arrest. A quieter airway may reflect less airflow rather than less obstruction.

Management reasoning: call for resources while immediately addressing airway patency, oxygenation and effective BVM ventilation. Use a two-person technique where available and judge actual chest rise. If ventilation is ineffective, optimise position/seal, assess obstruction and use authorised adjuncts. Apply the current paediatric resuscitation pathway when indicated, including rhythm analysis and weight/age-specific treatment. Nebulised medication cannot substitute for ventilation in an apnoeic child.

QAS-specific examination point: the June 2026 paediatric CPG lists inadequate-perfusion bradycardia thresholds of <60/min in infants and <40/min at ages 1–12, alongside its clinical criteria. Do not import an unqualified “every child <60” rule from another algorithm. HR 50 in this profoundly unwell 2-year-old still demands immediate oxygenation/ventilation and reassessment. If no pulse can confidently be identified within 10 seconds in the unresponsive, inadequately breathing child, follow the arrest pathway. Source: QAS paediatric resuscitation.
Source links: QAS paediatric resuscitation: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219109/CPG_Resuscitation-Paediatric-Non-traumatic.pdf

Viva follow-up: Why not force a throat inspection? Because provoking an obstructed child can precipitate deterioration; however, suspected obstructing foreign body in resuscitation requires the relevant airway algorithm and trained interventions. Distinguish a conscious child you should not agitate from an unconscious child who needs airway rescue.

Wider care: paediatric airway/critical-care support, investigation of infectious or foreign-body causes, post-resuscitation care and family support. Explain actions to the parent and assign someone to gather history without distracting the airway team.`},{id:`cbl-6-adult-asthma`,title:`CBL 6: adult asthma and interrupted medicine access`,source:`Study Bible`,text:`Formulation: acute asthma exacerbation with concerning respiratory distress after interrupted preventer therapy and exhausted reliever supply. HR 116 and RR 22 alone are insufficient to grade severity; short phrases, tripod positioning, air entry, effort and trajectory matter. SpO2 is missing and must be obtained.

Mechanism: airway inflammation makes bronchi hyperresponsive; smooth-muscle contraction, oedema and mucus narrow them. Expiratory flow limitation causes air trapping and increased work. Budesonide treats inflammation over time; terbutaline is a short-acting beta2 reliever. Their roles are not interchangeable.

Differentiate: anaphylaxis if an acute exposure and systemic features emerge; pneumothorax if unilateral pain/air-entry change; infection if fever/focal findings. A history of asthma increases probability but does not exclude these.

Treatment logic: choose inhaled bronchodilator delivery suited to severity and ability to use it, assess oxygen need, use indicated anti-inflammatory treatment and reassess. The reviewed QAS asthma guidance adds ipratropium for the specified response/severity categories rather than all mild wheeze. Severe life-threatening bronchospasm/silent chest changes the rescue treatment and ventilation plan. Do not wait for a steroid to reverse immediate respiratory failure.

How to judge response: longer speech, less work, better air entry, improving comfort and stable consciousness/perfusion. A rising pulse can reflect disease, anxiety or beta-agonist effects. Persistent tachypnoea after extensive beta-agonist treatment may also have a metabolic contribution; reassess the whole patient rather than reflexively repeating medication solely for RR.

Continuum: identify the practical access problem, inhaler/spacer technique and action plan after stabilisation. A non-judgmental question—“What has made it difficult to get your preventer?”—is more useful than calling the patient noncompliant. Source: QAS asthma.
Source links: QAS asthma: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/219096/CPG_Asthma.pdf`},{id:`cbl-7-long-lie`,title:`CBL 7: elderly collapse, prolonged lie and arm injury`,source:`Study Bible`,text:`Formulation: undifferentiated collapse with hypoxaemia, poor perfusion, hypothermia and a possible neurovascularly compromised arm injury. Infection is plausible but not yet the only explanation.

Interpretation: HR 120, BP 95/50, SpO2 89%, RR 24 and temperature 35°C make this a medical emergency as well as a fall. Amnesia means the mechanism is unknown. Recent antibiotics do not exclude ongoing infection. Confusion may reflect hypoxia, infection, hypoperfusion or brain injury.

Priorities: ABC assessment and oxygen/ventilation as required; ECG/glucose; temperature protection; head-to-toe examination; arm pulses, movement, sensation and pain before and after splinting. Ask about chest pain, palpitations, prodrome, anticoagulants, baseline cognition, last known well and time on floor. Do not perform standing observations in an unstable patient.

Pathology expansion: prolonged compression can injure muscle. Cell breakdown releases potassium and myoglobin; this can produce dysrhythmia and acute kidney injury, especially with dehydration and poor renal perfusion. This is a risk requiring assessment, not a confirmed diagnosis from “long lie” alone. Compartment syndrome may cause disproportionate pain and pain on passive stretch while distal pulses remain present. QAS crush injury.
Source links: QAS crush injury: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0021/219135/cpg_crush-injuries.pdf

Treatment choices: titrate support to perfusion and respiratory findings, give appropriate analgesia, protect the injured limb and transport. Avoid a large unreviewed fluid load in an older patient with possible heart/renal disease. The arm injury must not distract from the cause of collapse. Hospital investigations may include imaging, renal function, electrolytes, CK and infection evaluation. Later falls assessment addresses home safety and alarm access.

Model opening: “This patient has a potentially serious medical cause of collapse with secondary trauma and complications of prolonged immobility. I would stabilise oxygenation and perfusion while assessing for infection, cardiac causes, neurological injury and occult bleeding.”`},{id:`cbl-8-mixed-poisoning`,title:`CBL 8: child with Endep and Valium exposure`,source:`Study Bible`,text:`Formulation: life-threatening suspected mixed amitriptyline and diazepam poisoning. Missing tablets estimate a maximum possible exposure, not proof of the exact ingested amount. GCS 8, BP 70/40, tachycardia and twitching justify urgent escalation even with SpO2 99%.

Mechanisms: amitriptyline blocks myocardial fast sodium channels, slowing conduction and impairing contractility; antimuscarinic effects contribute to warm dry skin and tachycardia; alpha blockade contributes to vasodilation. CNS toxicity can cause coma and seizures. Diazepam enhances GABA-A signalling and adds sedation/respiratory risk. This is not a simple sleepy child who can be observed at home.

Evidence: actual weight, packet strengths, maximum missing quantities, timing, co-ingestants, serial ECG/QRS/aVR, ventilation, glucose and perfusion. Obtain a waveform capnography assessment where available. A fast respiratory rate does not guarantee adequate tidal volume or airway protection.

Treatment logic: support airway and effective ventilation, establish monitoring/access as feasible, treat seizures through the authorised pathway, obtain urgent consultation/CCP support and transport to appropriate paediatric critical care. The QAS sodium-bicarbonate DTP has specific toxicity/ECG and scope requirements: recognise the need for advanced treatment rather than assuming routine ACP2 authority. Sodium loading and alkalinisation can mitigate sodium-channel toxicity. Do not give routine flumazenil in this suspected mixed TCA ingestion; reversal may provoke seizures and worsen the situation. Do not induce vomiting or give oral charcoal to this unprotected airway.

Viva calculation: if an examiner supplies an actual weight of 16 kg, 600 mg/16 kg = 37.5 mg/kg amitriptyline as the maximum possible exposure. The 16 kg is an invented practice weight, not in the case. Do not use it for treatment unless confirmed.

Change: QRS broadens and BP falls. Explain worsening cardiotoxicity, seek expert management and continue physiological support. Do not wait for an exact toxicology level to recognise danger. The RCH risk markers and QAS treatment thresholds are not identical; use QAS for authorised prehospital decisions.

Sources: QAS TCA poisoning, QAS sodium bicarbonate, RCH TCA poisoning.
Source links: QAS TCA poisoning: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0017/219131/cpg_tricyclic-antidepressants.pdf; QAS sodium bicarbonate: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/219373/DTP_Sodium-bicarbonate-84.pdf; RCH TCA poisoning: https://www.rch.org.au/clinicalguide/guideline_index/Tricyclic_Antidepressant_%28TCA%29_Poisoning/`},{id:`cbl-13-rv-infarction`,title:`CBL 13: inferior STEMI and right ventricular involvement`,source:`Study Bible`,text:`Diagnosis and supporting evidence: persistent ischaemic chest discomfort, inferior ST elevation with reciprocal lateral depression, and V4R elevation support inferior STEMI with RV involvement. HR 44, BP 82/54, weak pulses and CRT 4 seconds show serious haemodynamic compromise. Normal mentation and SpO2 96% do not make this stable.

Explain the chain: coronary occlusion deprives myocardium of oxygen, impairing contraction and producing electrical injury changes. RV dysfunction reduces flow through the lungs and therefore LV filling. Bradycardia further lowers cardiac output. Inferior infarction can involve the conduction system, but do not diagnose a specific block without its ECG criteria. Clear lungs can coexist with severe right-sided pump failure.

Differentiate: dissection may involve coronary arteries and produce ischaemic ECG changes; enquire about abrupt maximal tearing pain, neurological symptoms and pulse differences. PE can also impair right-heart output, but the supplied territorial ECG and V4R support infarction. These comparisons guide focused evidence gathering; they do not require delaying time-critical reperfusion referral.

Management logic: immediate monitoring/pads readiness, early transmission/referral, appropriate antiplatelet therapy after contraindication review, careful analgesia and support for hypotension/bradycardia within scope. GTN is unsuitable at BP 82/54 and HR 44. RV preload dependence means avoiding indiscriminate preload reduction, not giving unlimited fluid; reassess perfusion and lungs after any authorised fluid intervention. Seek advanced support for persistent instability and expedite definitive reperfusion.

Explain medicines: aspirin reduces platelet thromboxane signalling; a P2Y12 inhibitor blocks another platelet activation pathway; heparin reduces coagulation through antithrombin; none mechanically opens an artery like PCI. GTN reduces filling pressure and workload but can worsen this patient's circulation. An opioid treats pain but may depress ventilation or BP, so dose and reassessment must be patient-specific.

Viva answer: “I would prioritise urgent reperfusion and haemodynamic support. The right ventricle is failing to deliver adequate preload to the left heart, compounded by bradycardia. I would not give GTN with these observations, and I would reassess any volume intervention rather than assume all RV infarctions require large fluid volumes.”`},{id:`cbl-14-posterior-mi`,title:`CBL 14: dyspnoea without chest pain and reperfusion referral`,source:`Study Bible`,text:`Diagnosis: posterior myocardial infarction is strongly supported by V1–V3 reciprocal changes and posterior ST elevation. The 73-year-old's diabetes, sweating, near-syncope, BP 94/62 and crackles make a painless presentation particularly dangerous to dismiss.

Why the ECG looks different: anterior leads view the electrical effects from the opposite side of a posterior injury. Posterior ST elevation can appear as anterior ST depression, with tall anterior R waves. Posterior leads give a more direct view. ST depression by itself is not specific; interpret the distribution, morphology, clinical state and extra leads together.

Differentiate: PE, dysrhythmia, acute heart failure and other shock causes remain relevant. The blood glucose of 10.8 does not diagnose DKA or explain the whole presentation. Mild crackles and low BP suggest developing LV dysfunction and limit simplistic fluid or vasodilator treatment.

Plan: recognise an occlusion presentation despite absent chest pain, transmit the ECG, pursue the current reperfusion referral and reassess rhythm/perfusion/respiration. At the supplied SBP, GTN does not meet the reviewed DTP safety threshold. Do not delay referral while waiting for pain to appear or the monitor to label STEMI.

Wider care: PCI assessment, biomarkers/imaging, treatment of acute ventricular failure and secondary prevention. A penicillin rash does not imply allergy to aspirin or antiplatelets; assess each medication on its own merits.

Reperfusion referral rehearsal for both cardiac cases

Use the October 2026 QAS reperfusion CPP, not the older reference date printed in the workbook. Prepare onset/time of recognition, ECG/extra leads, current haemodynamics, neurological baseline, bleeding history, anticoagulants, allergies, weight and transport estimate. Confirm acceptance, medication orders and destination with read-back. The pPCI pathway uses a 60-minute transport consideration from identification; complete the actual checklist and seek advice for ambiguity. A study summary cannot replace full contraindication screening or resolve conflicting public checklist wording.
Source links: QAS reperfusion CPP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/308765/CPP_Pre-hospital-cardiac-reperfusion.pdf

Practice script: “This is a 59-year-old with ongoing symptoms for approximately 40 minutes and inferior ST elevation, reciprocal changes and V4R elevation. HR is 44 and BP 82/54 with poor peripheral perfusion. I am requesting urgent reperfusion advice and haemodynamic support. I will provide the completed contraindication screen, current treatment, weight and actual ETA.” Do not invent an ETA from the suburb alone.`},{id:`cardiogenic-pulmonary-oedema`,title:`Cardiogenic pulmonary oedema: mechanism and treatment choices`,source:`Study Bible`,text:`The 68-year-old with heart failure, orthopnoea and pink frothy sputum has a strong working diagnosis of acute cardiogenic pulmonary oedema. Obtain BP, ECG, oxygenation, mental state and breathing adequacy before deciding whether the patient can tolerate vasodilation or positive-pressure support.

Mechanism: raised left-sided filling pressures increase pulmonary capillary hydrostatic pressure. Fluid enters the interstitium/alveoli, reducing compliance and gas exchange; breathing becomes hard and hypoxaemia can develop. An acute episode can reflect fluid redistribution and increased afterload, not simply excess total-body fluid.

Treatment reasoning: position to assist breathing if perfusion allows; support oxygenation and ventilation; assess CPAP suitability and contraindications; use GTN only when haemodynamics and DTP permit. Positive pressure recruits alveoli and can reduce cardiac loading, but may worsen hypotension and is unsuitable for someone unable to protect their airway. Search for ACS, arrhythmia, hypertension or another precipitant.

Compare with drowning: both may have crackles/froth, but drowning involves aspiration-related lung injury. Do not transfer GTN treatment from cardiogenic oedema to every wet-sounding chest. Compare with COPD: wheeze can occur in oedema; history, onset, orthopnoea, crackles, ECG and perfusion help. Neither wheeze nor crackles alone proves a diagnosis.`},{id:`cbl-15-croup`,title:`CBL 15: severe croup in a three-year-old`,source:`Study Bible`,text:`Diagnosis: the coryzal prodrome, barking cough, hoarse cry and stridor favour croup. Stridor at rest, marked recession, diminished entry and SpO2 91% indicate substantial obstruction. Do not label it mild because the child is awake.

Mechanism: subglottic inflammation narrows an already small airway. Small changes in radius greatly increase resistance; the familiar inverse-fourth-power relationship is a teaching model, not a complete description of turbulent flow in a living airway. Crying increases demand and can worsen obstruction.

Differentiate: drooling, marked dysphagia and toxic appearance raise concern for epiglottitis; high fever/toxicity and severe obstruction can indicate bacterial tracheitis. Sudden onset during eating/play suggests foreign body. Exposure plus urticaria, swelling or circulatory signs suggests anaphylaxis. No single absent feature absolutely excludes an alternative.

Plan and rationale: keep the child with the parent, minimise handling, permit position of comfort, deliver indicated nebulised adrenaline and corticosteroid therapy according to QAS, and prepare escalation/transport. Nebulised adrenaline reduces mucosal swelling through local alpha-mediated vasoconstriction; dexamethasone acts more slowly on inflammation. Improvement after nebulisation requires continued reassessment because its effect may wear off.

Clinical change: stridor fades while the child becomes drowsy and air entry falls. This is impending failure, not a successful response. Reassess effective ventilation immediately and escalate airway support. BP deferral to reduce distress can be reasonable initially; it is not permission to ignore perfusion or to withhold necessary resuscitation.`},{id:`cbl-16-child-asthma`,title:`CBL 16: life-threatening asthma and the silent chest`,source:`Study Bible`,text:`Diagnosis: life-threatening bronchospasm with respiratory failure. The decisive combination is shallow RR 12, almost absent entry, inability to speak, cyanosis, drowsiness and SpO2 82%. Prior ICU admission adds risk. The recorded BP 86/50 does not reassure when pulses are weak and refill is four seconds.

Pathology: severe airway narrowing limits expiration. Gas trapping increases end-expiratory lung volume and work of breathing. Fatigue reduces effective ventilation; CO2 rises and acidosis develops. Increased intrathoracic pressure can also reduce venous return. A silent chest means too little airflow to generate wheeze when accompanied by these findings.

Plan: immediate airway/ventilatory support appropriate to actual breathing adequacy, indicated rescue medication, oxygen, early expert assistance and rapid transfer. Aerosol delivery becomes unreliable when very little air moves. IM adrenaline has a role under the QAS severe life-threatening bronchospasm/silent-chest indication. Explain why repeated inhaler doses alone are insufficient. Do not force oral steroid into a child who cannot safely swallow.

Ventilation hazard: aggressive rapid bagging can worsen air trapping and impair circulation. Use effective, carefully assessed ventilation with time for expiration, observe chest movement and seek experienced assistance. Advanced airway management is high risk in this physiology and must be scope-appropriate. Sudden deterioration also prompts assessment for pneumothorax, equipment problems and worsening obstruction.

Response: improved entry, alertness, speech and effective breaths are more convincing than an isolated saturation increase. A continuing high pulse after treatment must be interpreted against medication exposure and perfusion.`},{id:`trauma-shock-mechanisms`,title:`Trauma: four shock mechanisms and competing priorities`,source:`Study Bible`,text:`Explain C-ABCDE as concurrent work where resources permit: catastrophic haemorrhage control, airway, breathing, circulation, disability and exposure/environment. A conspicuous wound can distract from a less visible fatal injury. Allocate tasks by the immediate threat, then repeat the assessment after each major intervention or movement.

Shock mechanism: Hypovolaemic
Examples in your material: Amputation, pelvic bleeding, GI bleed
Why cardiac output falls: Too little circulating volume/preload
Key distinction: Control loss; replace appropriately; definitive haemostasis

Shock mechanism: Distributive
Examples in your material: Sepsis, anaphylaxis
Why cardiac output falls: Vasodilation and maldistributed flow, often with leak
Key distinction: Treat cause and circulation; adrenaline is central to anaphylaxis

Shock mechanism: Cardiogenic
Examples in your material: MI with pump failure
Why cardiac output falls: Inadequate effective pumping
Key distinction: Reperfusion/cardiac support; fluid overload may worsen lungs

Shock mechanism: Obstructive
Examples in your material: Tension pneumothorax, tamponade, major PE
Why cardiac output falls: Mechanical restriction to filling or forward flow
Key distinction: Remove/treat obstruction; fluids alone are insufficient

Mixed shock is common. A stabbed patient may have tension physiology and haemorrhage simultaneously. A septic patient may be dehydrated and have myocardial dysfunction.`},{id:`cbl-17-traumatic-pea`,title:`CBL 17: traumatic cardiac arrest with PEA`,source:`Study Bible`,text:`Interpretation: organised electrical activity at 44/min without a central pulse is PEA in this context, not a perfusing bradycardia. Major mechanism, chest/pelvic/groin injuries and active bleeding support traumatic arrest. ETCO2 9 may reflect extremely low pulmonary blood flow; it is not by itself proof of tube failure or a termination criterion.

QAS priorities: address catastrophic blood loss, hypoxia, tension pneumothorax and tamponade concurrently where possible. Control external bleeding, stabilise a suspected injured pelvis, support ventilation, restore volume according to the traumatic-arrest pathway and consider bilateral decompression for suspected chest trauma within authorisation. Compressions must not displace reversible-cause treatment; adrenaline is not the first solution before these causes are addressed. This differs from routine medical PEA. Source: QAS traumatic resuscitation.
Source links: QAS traumatic resuscitation: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0015/219111/CPG_Resuscitation-Traumatic.pdf

Explain physiology: an electrical impulse cannot eject blood from an empty or mechanically obstructed circulation. Ventilation resistance and poor unilateral entry raise concern for chest pathology, while visible groin bleeding identifies another reversible contributor. Treating one does not eliminate the others.

Team script: “This is traumatic PEA. You control the groin haemorrhage and assess the pelvis; you manage ventilation and chest assessment; I will coordinate access, advanced resources and definitive-care planning. Report immediately when each intervention is effective.” Adapt roles to actual crew numbers.

Counterfactual: if the collision is minor and a witness describes collapse before impact, reconsider a primary medical arrest. Cessation: apply the current full QAS criteria and consultation requirements; do not make an isolated low ETCO2, pupil finding or initial PEA the decision. Definitive care: blood, surgery and selected specialist resuscitative procedures, with destination decisions driven by capability and time.`},{id:`cbl-18-chest-injury`,title:`CBL 18: penetrating chest injury and persistent mixed shock`,source:`Study Bible`,text:`Working differential: tension pneumothorax, haemothorax, tamponade and major vascular injury. Severe dyspnoea, unilateral reduced entry and profound hypotension favour urgent consideration of tension physiology, but no single sign confirms it.

Mechanisms: accumulating pleural air can compromise ventilation and venous return. Pleural blood both compresses lung and removes circulating volume. Pericardial blood restricts cardiac filling. These conditions can coexist; neck veins may not distend in a patient who is also severely hypovolaemic.

Plan: immediate appropriate chest-wound care, oxygenation/ventilation, authorised decompression when clinically indicated, haemorrhage/perfusion support, analgesia that respects the shock state, and urgent definitive-care transport/notification. Positive-pressure ventilation can worsen untreated tension, but necessary ventilation must still be delivered with active management of the cause.

After decompression: reassess BP, air entry, work and consciousness. Failure to improve could mean ineffective decompression, recurrent tension, blood loss, tamponade or another injury. Do not assume every persistent shock state needs another needle. Low ECG voltage does not diagnose tamponade; definitive evaluation may require ultrasound and surgery.`},{id:`cbl-19-amputation`,title:`CBL 19: traumatic amputation and haemorrhage`,source:`Study Bible`,text:`Interpretation: continued bleeding despite a loose improvised tourniquet means haemorrhage control has failed. HR 138, BP 84/52, confusion and CRT 5 seconds support decompensated shock; SpO2 98% measures saturation, not adequate oxygen delivery.

First action: make haemorrhage control effective using authorised techniques, then check it again after moving the patient. A second suitable tourniquet may be required under the relevant procedure. Record device position and accurate time; do not intermittently loosen it to “let blood through”. Treat pain and look for other injuries while resuscitation/transport proceeds.

Mechanism and treatment: low circulating volume reduces stroke volume, provoking tachycardia and vasoconstriction. Cold, acidosis and coagulopathy worsen bleeding. Warmth, prompt haemostasis and appropriate resuscitation matter; indiscriminate crystalloid does not replace clotting factors or oxygen-carrying capacity. Check TXA eligibility and open-long-bone amputation antibiotic indications separately. Antibiotics do not treat shock.

Amputated part: protect it from contamination and direct freezing; use the current packaging procedure, keeping it cooled indirectly and identifiable. Patient resuscitation and transport take priority over retrieving a part unsafely. Handover includes mechanism, blood loss estimate, tourniquet effectiveness/time, medications and the part's location. Replantation suitability is a specialist decision.`},{id:`cbl-20-drowning`,title:`CBL 20: drowning, hypoxia, hypothermia and the pelvic extension`,source:`Study Bible`,text:`Interpretation: RR 6, SpO2 76%, GCS 7, HR 38, BP 72/40 and temperature 32.4°C indicate critical respiratory and circulatory failure. The patient still has a reported pulse; assess it reliably and monitor for arrest. Do not treat the low rate as an isolated primary arrhythmia.

Mechanism: aspiration and surfactant dysfunction damage gas exchange and promote non-cardiogenic oedema. Hypoxia impairs brain and heart function; cooling further slows physiological processes. Frothy secretions make airway management difficult but do not justify attempting to drain water by abdominal thrusts or hanging the patient down.

Plan: safe rescue environment, immediate effective ventilation/oxygenation, suction when required, wet-clothing removal and protection from further cooling, careful handling, monitoring and urgent transport. Look for a precipitating seizure, dysrhythmia, intoxication or trauma; do not assume a spinal mechanism simply because water was involved. Apply spinal precautions when indicated without delaying breathing support.

Response to test: does chest rise improve, does colour/mentation improve, does perfusion recover? If saturation remains poor, examine airway, ventilation effectiveness and lung injury rather than merely turning up oxygen flow. Hospital care can include ventilatory support and controlled rewarming. Source: QAS post-submersion.
Source links: QAS post-submersion: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219143/cpg_post-submersion.pdf

Week 5 preengagement pelvic injury extension

The 68-year-old struck pedestrian may have major concealed pelvic/retroperitoneal haemorrhage. Pale confusion and severe pelvic pain should trigger an early major-trauma plan. Assess other bleeding compartments and head/chest injury; do not repeatedly spring the pelvis. Apply an indicated pelvic splint using the device procedure and correct anatomical positioning, control other bleeding, protect temperature and transport for haemorrhage control. The splint reduces motion and can support haemostasis; it is not definitive treatment for every arterial bleed. Practise station 24 with the added question: “What changes if a severe TBI is also suspected?” Explain that brain perfusion requirements change tolerance of hypotension and require the appropriate combined-injury guidance.`},{id:`worked-burns-viva`,title:`Worked viva: six-year-old with campfire burns`,source:`Study Bible`,text:`Opening formulation: “This is a child with painful partial-thickness-appearing thermal burns and possible inhalation/upper-airway injury. Difficulty speaking and neck/facial exposure make airway reassessment urgent. I cannot calculate an accurate TBSA from the supplied words alone.”

Evidence: duration/contact, enclosed versus open-air smoke, cooling already provided, clothing/jewellery, actual weight, hoarseness/stridor, soot, oral injury, respiratory effort and associated fall trauma. Singed hair is an exposure clue, not proof that intubation is required. A pulse oximeter can be misleading with carbon monoxide exposure; the outdoor setting reduces some exposure concerns but does not eliminate the need to assess them.

Pathology: thermal injury damages tissue and causes inflammation, pain and capillary leak. Significant burns can cause fluid shifts; children lose heat readily. Blisters suggest dermal involvement, but depth evolves. Do not include uncomplicated erythema in a partial/full-thickness TBSA calculation. Use an age-appropriate chart and actual areas, not an adult rule applied indiscriminately.

Management logic: stop the burning process, prioritise airway/respiratory support, provide appropriate cooling while preventing whole-body hypothermia, remove constricting items if safe, cover appropriately and provide titrated analgesia. Obtain BP from a suitable uninjured site if feasible rather than treating the absence of a number as normal circulation. Assess fluid need against burn extent, perfusion and paediatric consultation requirements. Do not automatically apply a hospital fluid formula without QAS authorisation.

Explain treatment: cooling limits ongoing thermal injury; excessive cooling worsens hypothermia. Analgesia reduces suffering and enables care but must be monitored for sedation/respiratory effects. Fluids support circulation where indicated, while excessive fluid can worsen oedema. Specialist burns care may include airway intervention, wound management/grafting, rehabilitation and assessment for other injuries.

Deterioration question: new hoarseness, stridor, tiring or declining consciousness → immediate reassessment and escalation for airway management, not a longer dressing procedure. Source: QAS burns.
Source links: QAS burns: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219133/CPG_Burns.pdf`},{id:`worked-sepsis-viva`,title:`Worked viva: fever, confusion, flank pain and shock`,source:`Study Bible`,text:`Opening formulation: “I suspect urinary-source sepsis with significant circulatory compromise and organ dysfunction. The evidence is infection symptoms, fever, acute confusion, oliguria, hypotension and tachypnoea. I would treat shock while investigating alternatives and arranging urgent definitive care.”

Pathology: a dysregulated infection response produces vasodilation, endothelial dysfunction and capillary leak. Intravascular depletion, microcirculatory abnormalities and possible myocardial depression impair tissue oxygen delivery. Poor renal perfusion contributes to low urine output; altered cerebral function contributes to confusion. Poor intake adds a hypovolaemic component.

Differentiate: dehydration alone does not explain all the infectious features; DKA requires evidence of ketosis/acidosis rather than BGL 14.6 alone. Consider an infected obstructed urinary tract, which may require urgent drainage, and consider abdominal/vascular or neurological causes if the history/examination changes.

Sequence: ABC support, monitoring/glucose/ECG as indicated, access and reassessed perfusion support, early pre-notification and transport. Track mental state, pulses, BP, refill and respiratory signs after treatment. Tachypnoea may reflect metabolic stress rather than primary lung disease. Formal septic-shock criteria require information not available here; “suspected sepsis with shock” is a defensible prehospital formulation.

Antibiotic trap: urgent hospital antibiotics are important, but routine ceftriaxone for every suspected urinary sepsis is not established by the reviewed standard QAS DTP. Apply the actual indication or seek authorised advice. Do not let this distinction delay resuscitation or transfer. Antipyretics can address distress; reducing temperature is not proof that shock has resolved.

Wider care: blood/urine testing, lactate and renal evaluation, timely antimicrobial therapy, source control and vasopressors if required. Source: QAS sepsis.
Source links: QAS sepsis: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219052/cpg_sepsis.pdf`},{id:`worked-anaphylaxis-viva`,title:`Worked viva: eight-year-old unwell after food`,source:`Study Bible`,text:`Opening formulation: “This is anaphylaxis with airway, breathing and circulatory involvement after likely peanut exposure. Hoarseness/swelling, wheeze, SpO2 90%, BP 78/42 and poor perfusion require immediate adrenaline and resuscitative care.”

Pathology: mast-cell mediator release causes vascular permeability and vasodilation, mucosal swelling and bronchoconstriction. The patient can lose effective circulating volume into tissues without external bleeding. Gastrointestinal symptoms support systemic involvement. Skin features help here, but anaphylaxis can occur without them.

Treatment logic: prompt IM adrenaline, safe positioning that supports breathing and circulation without allowing the child to stand/walk, oxygen and airway/ventilatory support as needed, early resources/transport and reassessment. Use fluids and adjuncts according to indication and scope. Do not delay adrenaline for IV access, history completion or an antihistamine.

Why adrenaline works: alpha1 stimulation increases vascular tone and reduces mucosal swelling; beta1 supports cardiac function; beta2 relaxes bronchial smooth muscle and helps limit mediator release. Salbutamol can assist persistent bronchospasm but does not correct vascular leak or upper-airway oedema. Corticosteroids are not an immediate substitute. Refractory shock requires escalation, not simply adding oral medicines.

Dose reasoning: the reviewed QAS IM adrenaline table uses age bands; for this 8-year-old the listed dose is 300 micrograms. With 1 mg/mL, this is 0.3 mL. Do not substitute a generic 10-microgram/kg calculation of 250 micrograms without checking the source regimen. Reassess and follow the authorised repeat interval. Distinguish this IM preparation from arrest dosing and infusions.

Continuum: hospital observation for ongoing/recurrent symptoms, allergy review, autoinjector access and an action plan. A previous mild rash does not guarantee that the next exposure will be mild. Source: QAS anaphylaxis and the adrenaline DTP through the live index.
Source links: QAS anaphylaxis: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/308718/CPG_Anaphylaxis.pdf`},{id:`ecg-workshop`,title:`ECG workshop: fourteen teaching images and cardiac physiology`,source:`Study Bible`,text:`Open the original document beside this section. These are qualitative readings of synthetic images, not a replacement set of diagnostic-quality ECGs. Measure rates/intervals on the full-size trace with its calibration; do not use a screenshot's displayed size as millimetres. If the figure and narrative disagree, state both findings and request a repeat clinical trace.

Use the same sequence: patient stability → calibration/quality → rate → rhythm/P–QRS relationship → axis → intervals/QRS width → ST/T patterns → comparison/extra leads → clinical action. A rhythm label does not determine perfusion.

Original image: Cardiac pre-engagement ECG 1
Defensible interpretation / limitation: Inferior injury pattern, with changes in II/III/aVF and reciprocal lateral changes
Clinical action to explain: Check V4R, haemodynamics, serial traces and reperfusion pathway

Original image: Pre-engagement ECG 2
Defensible interpretation / limitation: Anterior reciprocal pattern intended to prompt posterior-infarction assessment; synthetic morphology is simplified
Clinical action to explain: Obtain V7–V9; do not dismiss horizontal anterior ST depression in an unwell patient

Original image: Pre-engagement ECG 3
Defensible interpretation / limitation: Anterior precordial injury pattern
Clinical action to explain: Assess territory/reciprocal findings and seek urgent reperfusion advice; exact culprit artery is not proven by a drawing

Original image: Pre-engagement ECG 4
Defensible interpretation / limitation: Tall symmetric precordial T waves with upsloping ST depression suggest a de Winter-type occlusion pattern
Clinical action to explain: Transmit/consult urgently; absence of a machine STEMI label is not reassurance

Original image: Pre-engagement ECG 5
Defensible interpretation / limitation: Irregular narrow-complex tachycardia with poorly organised atrial activity, compatible with AF
Clinical action to explain: Assess stability and causes; do not call every narrow tachycardia regular SVT or apply Valsalva indiscriminately

Original image: Pre-engagement ECG 6
Defensible interpretation / limitation: Slow regular rhythm with apparent P waves before QRS complexes; no convincing independent atrial rhythm is demonstrated
Clinical action to explain: Describe bradycardia, measure PR on a proper strip and assess perfusion; do not assert complete AV block from this image

Original image: Week 4 ECG A / CBL 13
Defensible interpretation / limitation: Labelled rate 44; inferior injury plus V4R changes in the provided clinical context
Clinical action to explain: RVMI and bradycardic shock reasoning

Original image: Week 4 ECG B / CBL 14
Defensible interpretation / limitation: Labelled 112; anterior reciprocal and posterior lead changes
Clinical action to explain: Posterior MI despite no pain

Original image: Week 4 ECG C / CBL 15
Defensible interpretation / limitation: Sinus tachycardia, labelled 165, during severe airway distress
Clinical action to explain: Treat airway pathology; a 12-lead must not delay urgent croup care

Original image: Week 4 ECG D / CBL 16
Defensible interpretation / limitation: Sinus tachycardia, labelled 156, after reliever treatment
Clinical action to explain: Consider hypoxia, stress and drug effects; respiratory failure drives urgency

Original image: Week 5 ECG A / CBL 17
Defensible interpretation / limitation: Organised slow electrical activity, labelled 44
Clinical action to explain: It is PEA only because the clinical case states no pulse

Original image: Week 5 ECG B / CBL 18
Defensible interpretation / limitation: Tachycardia, labelled 112; low voltage is nonspecific
Clinical action to explain: Correlate with chest injury and shock; not an ECG diagnosis of tamponade

Original image: Week 5 ECG C / CBL 19
Defensible interpretation / limitation: Sinus tachycardia, labelled 138
Clinical action to explain: Compensatory response to blood loss, not an indication to cardiovert

Original image: Week 5 ECG D / CBL 20
Defensible interpretation / limitation: Bradycardia, labelled 38
Clinical action to explain: Correct hypoxia and manage hypothermia; assess pulse and perfusion

ECG physiology you should be able to teach back

P wave: atrial depolarisation. PR: atrial-to-ventricular conduction time. QRS: ventricular depolarisation. ST/T: ventricular repolarisation phases, interpreted in clinical context.

Contiguous leads view anatomically related territories. Inferior: II, III, aVF; lateral: I, aVL, V5–V6; anterior/septal views: precordial leads with overlapping territories. Coronary anatomy varies; don't claim perfect artery localisation.

Reciprocal changes strengthen an appropriate territorial injury interpretation, but their absence does not exclude occlusion.

Complete AV block requires evidence of atrial and ventricular independence, not merely a slow ventricular rate. A long rhythm strip may be needed.

Sinus tachycardia is often compensatory. Treat haemorrhage, hypoxia, infection or pain; electrical conversion does not restore missing blood volume.

PEA is a clinical state combining electrical activity with absent effective circulation. An ECG screenshot alone cannot diagnose it.

Three retest tasks: explain why ECG B needs posterior leads; explain why ECG 6 is insufficient for a complete-block diagnosis; explain why the same rate of 140 can mean very different things in a shocked amputee and a patient with a primary tachyarrhythmia.`},{id:`all-38-medicines`,title:`All 38 medicines: mechanisms, patient selection and traps`,source:`Study Bible`,text:`This section works through the whole uploaded deck at the level of mechanism, patient selection and viva reasoning. It is not a reissued or fully revalidated dose formulary. Use the deck to attempt recall, then verify exact current authority, dose bands, preparation, route, repeat interval and maximum in the linked original DTP. Cards 6 and 20 have the indication caveats already identified above; all complex reperfusion and sedation eligibility needs the original documents.

Card / drug: 1 Adrenaline
Explain how it works: Alpha effects support vascular tone; beta effects support the heart and bronchodilation
Patient-specific question or common trap: Is this IM anaphylaxis/critical bronchospasm, nebulised upper-airway treatment, arrest dosing, or an authorised infusion? Concentration and route are not interchangeable

Card / drug: 2 Amiodarone
Explain how it works: Alters cardiac ion-channel activity, prolonging refractoriness and slowing conduction
Patient-specific question or common trap: Its shock-refractory arrest role is different from treating compensatory sinus tachycardia; confirm age/scope and toxicity contraindications

Card / drug: 3 Aspirin
Explain how it works: Irreversibly inhibits platelet COX-1, reducing thromboxane-mediated aggregation
Patient-specific question or common trap: Check bleeding/allergy; antiplatelet action does not mean it is appropriate for undifferentiated stroke

Card / drug: 4 Box jellyfish antivenom
Explain how it works: Antibody fragments/immunoglobulins bind venom components
Patient-specific question or common trap: Dose relates to venom neutralisation, not simply patient size; anticipate hypersensitivity and check regional availability/training

Card / drug: 5 Cefazolin
Explain how it works: Beta-lactam interference with bacterial cell-wall synthesis
Patient-specific question or common trap: Open long-bone injury/amputation indication; prevents/treats infection risk, not blood loss

Card / drug: 6 Ceftriaxone
Explain how it works: Cephalosporin inhibition of bacterial cell-wall synthesis
Patient-specific question or common trap: Do not generalise its meningococcal/selected UGIB indications to all sepsis; dose and route depend on indication

Card / drug: 7 Clopidogrel
Explain how it works: Irreversible P2Y12 inhibition reduces ADP-mediated platelet activation
Patient-specific question or common trap: PCI and post-lysis pathways have different loading instructions; check previous antiplatelets

Card / drug: 8 Dexamethasone
Explain how it works: Glucocorticoid receptor effects reduce inflammatory gene signalling and airway oedema over time
Patient-specific question or common trap: Helpful anti-inflammatory treatment, not immediate rescue of an apnoeic child; oral safety and prior steroid timing matter

Card / drug: 9 Droperidol
Explain how it works: Dopamine antagonism provides sedation/antipsychotic effects
Patient-specific question or common trap: Dangerous behavioural disturbance must meet the actual criteria; monitor airway, BP and sedation and consider medical causes

Card / drug: 10 Enoxaparin
Explain how it works: Enhances antithrombin activity, predominantly inhibiting factor Xa
Patient-specific question or common trap: Age, renal function, weight and reperfusion pathway change dosing; distinguish IV loading from SC administration

Card / drug: 11 Fentanyl
Explain how it works: Mu-opioid receptor activation reduces pain transmission and perception
Patient-specific question or common trap: Measure in micrograms; pain relief can accompany respiratory depression; count prior opioids and reassess ventilation

Card / drug: 12 Glucagon
Explain how it works: Mobilises hepatic glycogen; cardiac cAMP effects can bypass beta-receptor blockade
Patient-specific question or common trap: May work poorly when glycogen is depleted; hypoglycaemia and refractory anaphylaxis are different indications/routes

Card / drug: 13 Glucose 10%
Explain how it works: Supplies circulating glucose directly to correct deficient substrate
Patient-specific question or common trap: Confirm patency, calculate grams and mL, reassess glucose/mentation and avoid extravasation

Card / drug: 14 Glucose gel
Explain how it works: Provides glucose for absorption when administration is safe
Patient-specific question or common trap: Swallowing/airway safety determines suitability; do not put oral gel into an unprotected airway

Card / drug: 15 GTN
Explain how it works: Nitric-oxide signalling increases smooth-muscle cGMP and vasodilation
Patient-specific question or common trap: Reducing preload can help selected ACS/ACPO but worsen hypotension; check BP, rate, PDE5 medicines and full exclusions

Card / drug: 16 Heparin
Explain how it works: Enhances antithrombin-mediated inhibition of coagulation factors
Patient-specific question or common trap: Anticoagulant, not fibrinolytic; check bleeding, prior anticoagulants and pathway-specific orders

Card / drug: 17 Hydrocortisone
Explain how it works: Glucocorticoid activity suppresses inflammation; replaces deficient cortisol in adrenal crisis
Patient-specific question or common trap: Not a rapid substitute for adrenaline; indication changes regimen, and prior steroids matter

Card / drug: 18 Hydroxocobalamin
Explain how it works: Binds cyanide to form cyanocobalamin, facilitating removal
Patient-specific question or common trap: Cyanide impairs cellular oxygen use; normal-looking saturation cannot exclude it. Adult/child authority differs

Card / drug: 19 Ibuprofen
Explain how it works: COX inhibition reduces prostaglandin production
Patient-specific question or common trap: Renal perfusion, dehydration, GI bleeding, pregnancy and interacting drugs can make it unsuitable

Card / drug: 20 Ipratropium
Explain how it works: Blocks muscarinic bronchoconstrictor signalling
Patient-specific question or common trap: Adds a different bronchodilator mechanism; not a histamine H1 blocker. Apply severity/response indication with nebulised salbutamol

Card / drug: 21 Loratadine
Explain how it works: Peripheral H1 blockade reduces allergic skin symptoms
Patient-specific question or common trap: It does not reverse anaphylactic shock or airway compromise; never delay adrenaline to give it

Card / drug: 22 Magnesium sulphate
Explain how it works: Influences ion movement and smooth-muscle excitability
Patient-specific question or common trap: A pharmacological rationale for asthma does not establish ACP2 authority; the deck's ACP2 regimen is marine-envenomation specific

Card / drug: 23 Methoxyflurane
Explain how it works: Inhaled anaesthetic with analgesic effects at low exposure; exact mechanism is incompletely defined
Patient-specific question or common trap: Requires suitable self-administration; assess renal/hepatic history and cumulative exposure

Card / drug: 24 Midazolam
Explain how it works: Positive allosteric modulation of GABA-A increases inhibitory signalling
Patient-specific question or common trap: Active seizure treatment differs from routine postictal sedation; count previous doses and anticipate respiratory depression

Card / drug: 25 Morphine
Explain how it works: Mu-opioid analgesia, with potential vasodilation and respiratory depression
Patient-specific question or common trap: Renal impairment, hypotension and previous opioids change suitability; do not memorise a dose without patient context

Card / drug: 26 Naloxone
Explain how it works: Competitive opioid-receptor antagonism reverses opioid effects
Patient-specific question or common trap: Ventilate first/as needed; reversal can wear off before the opioid and can precipitate withdrawal

Card / drug: 27 Olanzapine
Explain how it works: Dopamine/serotonin receptor antagonism contributes to antipsychotic effects
Patient-specific question or common trap: Oral cooperation/consent and the specified behavioural state matter; it is not a universal rapid sedation drug

Card / drug: 28 Ondansetron
Explain how it works: 5-HT3 blockade reduces emetic signalling
Patient-specific question or common trap: Check previous dosing, congenital long QT/interactions and age/route; treat the cause of nausea too

Card / drug: 29 Oxygen
Explain how it works: Increases inspired oxygen availability and arterial oxygenation when effective gas exchange occurs
Patient-specific question or common trap: It does not remove CO2 or restore haemoglobin; titrate to the clinical indication and support ventilation when inadequate

Card / drug: 30 Oxytocin
Explain how it works: Uterine receptor activation increases contraction and tone
Patient-specific question or common trap: Confirm all babies delivered; atony is one bleeding mechanism, so investigate other PPH causes

Card / drug: 31 Paracetamol
Explain how it works: Central analgesic/antipyretic effects reduce pain and fever distress
Patient-specific question or common trap: Count combination products, previous doses and concentration; it does not treat the cause of shock

Card / drug: 32 Salbutamol
Explain how it works: Beta2 activation increases cAMP and relaxes bronchial smooth muscle; also shifts potassium into cells
Patient-specific question or common trap: Monitor air entry/effort as well as pulse; tremor, tachycardia and metabolic effects can complicate reassessment

Card / drug: 33 Sodium chloride 0.9%
Explain how it works: Expands extracellular fluid, with some initial intravascular support
Patient-specific question or common trap: Does this patient need volume, and how will you identify benefit or overload? It carries no oxygen and no clotting factors

Card / drug: 34 Sucrose 24%
Explain how it works: Sweet taste has a short procedural analgesic effect in infants
Patient-specific question or common trap: It is not a substitute for treating hypoglycaemia or major pain; use its age-specific indication

Card / drug: 35 Tenecteplase
Explain how it works: Promotes plasmin generation and fibrin breakdown
Patient-specific question or common trap: Fibrinolytic: potentially major bleeding risk; use the entire eligibility checklist, age/weight regimen and consultation pathway

Card / drug: 36 Ticagrelor
Explain how it works: Reversibly blocks P2Y12-mediated platelet activation
Patient-specific question or common trap: Confirm accepted pathway/request and previous antiplatelets; it is not interchangeable with every clopidogrel instruction

Card / drug: 37 Tranexamic acid
Explain how it works: Limits fibrinolysis, helping preserve formed clot
Patient-specific question or common trap: It preserves clot rather than dissolving it; use a listed indication/time window, not “any bleeding”

Card / drug: 38 Water for injection
Explain how it works: Solvent/diluent for specified medicines
Patient-specific question or common trap: Follow exact reconstitution instructions; added volume and final volume may differ. It is not resuscitation fluid

Five pharmacology explanations worth rehearsing aloud

Adrenaline versus salbutamol: both can stimulate beta2 bronchodilation, but adrenaline also treats vascular dilation and mucosal swelling through alpha effects and supports the heart through beta1 effects. Salbutamol alone is insufficient for anaphylactic shock.

Salbutamol versus ipratropium: beta2/cAMP signalling promotes relaxation; antimuscarinic blockade reduces cholinergic constriction. They act through different pathways. Ipratropium does not block every mediator of airway narrowing and does not remove mucus plugs.

Steroid versus bronchodilator: a bronchodilator targets smooth-muscle tone; a steroid targets inflammation with a slower effect. Neither guarantees effective aerosol delivery when airflow is nearly absent.

Four clot-related classes: aspirin/clopidogrel/ticagrelor reduce platelet activation; heparin/enoxaparin reduce coagulation; tenecteplase promotes fibrin breakdown; TXA limits fibrin breakdown. “Blood thinner” hides clinically important opposite effects.

Glucose versus glucagon: glucose supplies substrate directly; glucagon asks the liver to release stored substrate. Starvation/depleted glycogen can reduce the latter response. Neither removes the need to identify why the glucose fell or whether recurrence is likely.`},{id:`worked-calculations`,title:`Eight worked calculations and a medicine safety script`,source:`Study Bible`,text:`These exercises teach arithmetic using stated regimens/concentrations. They do not authorise administration. Where a source uses rounded bands, complete the final lookup as well as the calculation.

1. Anaphylaxis case: authorised dose 300 micrograms; stock 1 mg/mL. Convert 1 mg to 1,000 micrograms. Volume = 300/1,000 = 0.3 mL. State route and concentration aloud during the double-check.

2. Glucose: 10% means 10 g/100 mL = 0.1 g/mL. A 15 g dose requires 150 mL. Do not confuse 10% with 10 mg/mL.

3. Paediatric glucose exercise: an explicitly prescribed 0.25 g/kg for a 20 kg child equals 5 g, which is 50 mL of 10% glucose. Reassess glucose and consciousness after treatment according to the DTP.

4. Post-tonsillectomy TXA: 30 kg × 15 mg/kg = 450 mg. With 100 mg/mL stock this is 4.5 mL of stock, administered/prepared over the authorised time (10 minutes) under the source instructions. Stock volume is not automatically the final diluted administration volume.

5. Fentanyl arithmetic: examiner specifies an authorised 25-microgram dose and 50 micrograms/mL stock. Required stock = 0.5 mL. Then check required preparation/dilution and route; do not convert micrograms to milligrams incorrectly.

6. Mixed poisoning risk: possible 600 mg amitriptyline in a measured 16 kg child = 37.5 mg/kg maximum possible exposure. This is a toxicology estimate, not a medication dose to give.

7. Croup steroid calculation practice: 15 kg × 0.3 mg/kg = 4.5 mg, or 1.125 mL of a 4 mg/mL product before applying the QAS rounding/preparation instruction. The reviewed DTP rounds the oral volume to the nearest 0.5 mL, so the final volume is 1.0 mL under that instruction. Explain why the raw mathematical result and prepared dose can differ.

8. Infusion maths only: an order says 100 mL over 10 minutes. Pump equivalent = 100 × 60/10 = 600 mL/hour. A drip rate additionally requires the actual set's drops/mL; never assume a universal giving-set factor.

Medication check sentence: “The indication is ___. The patient has/does not have these contraindications ___. The required dose is ___, using ___ concentration, giving ___ volume by ___ route over ___. I will reassess ___ and can repeat only under ___ conditions, with a maximum of ___.”`},{id:`differentials-and-crm`,title:`Differential comparisons, OSCE performance and CRM`,source:`Study Bible`,text:`Similar presentations: Asthma vs anaphylaxis
Discriminating evidence: Exposure, swelling, skin/GI/circulatory involvement; absence of rash does not exclude anaphylaxis
Why management changes: Anaphylaxis needs prompt IM adrenaline; inhaled bronchodilator alone is inadequate

Similar presentations: Croup vs epiglottitis/foreign body
Discriminating evidence: Prodrome/bark versus drooling/toxic appearance versus sudden choking; overlap occurs
Why management changes: Minimise distress and plan appropriate airway rescue; don't force a throat examination

Similar presentations: COPD vs ACPO
Discriminating evidence: Baseline lung disease, sputum/onset versus orthopnoea, cardiac history, ECG and congestion
Why management changes: Oxygen targets and suitability for vasodilation/pressure support differ

Similar presentations: DKA vs isolated hyperglycaemia
Discriminating evidence: Ketones/acidosis, dehydration, deep breathing and systemic illness
Why management changes: Do not diagnose or propose insulin solely from one high glucose

Similar presentations: Stroke vs hypoglycaemia/postictal deficit
Discriminating evidence: Glucose, event chronology, deficit persistence and serial examination
Why management changes: Correct reversible causes while preserving stroke time information

Similar presentations: Tension PTX vs haemothorax/tamponade
Discriminating evidence: Mechanism, asymmetric entry, perfusion, response to intervention; ultrasound if available/authorised
Why management changes: Decompression only addresses the appropriate pleural-air problem, not all causes of shock

Similar presentations: Sinus tachycardia vs SVT
Discriminating evidence: Onset, regularity, P waves, variability, clinical trigger and full ECG
Why management changes: Correct compensation's cause rather than suppressing the needed heart rate

Similar presentations: Opioid vs GHB vs mixed poisoning
Discriminating evidence: Exposure, respiratory pattern, pupils, ECG and course; toxidromes overlap
Why management changes: Naloxone reverses opioid effects, not every cause of coma; supportive ventilation remains essential

Similar presentations: Sepsis vs anaphylaxis
Discriminating evidence: Infection trajectory/source versus abrupt exposure-related syndrome
Why management changes: Both can be distributive shock, but immediate cause-specific treatment differs

Use “less likely because…” rather than “ruled out” when your evidence cannot exclude a diagnosis. For example, a normal SpO2 does not rule out PE, and a single nondiagnostic ECG does not rule out ACS.

OSCE performance and CRM

First minute: introduce yourself and establish safety; form a rapid impression; identify the immediate physiological threat; initiate urgent care; delegate a specific task and ask for the result. Avoid narrating a long differential while the patient needs ventilation or haemorrhage control.

While treating: give a concise working diagnosis and dangerous alternative. Explain consent/comfort measures, obtain focused collateral history and allocate monitoring, medication checks and transport tasks. When the scene becomes confusing, use a short shared reassessment: “What has changed? What is our current threat? Is treatment working?”

Closed-loop example: “Please attach the monitor and tell me the rhythm and BP.” The crewmate repeats the task, completes it and reports the result. “Get everything ready” does not identify a task or completion point.

Decision bias check: an asthma history can anchor you away from anaphylaxis; police presence can anchor you away from delirium; a dramatic amputation can hide chest injury; a monitor interpretation can hide posterior occlusion. Ask what finding would make your current explanation wrong.

Reassessment after intervention: state a prediction. After bronchodilator: improved entry and work; after haemorrhage control: no ongoing visible loss and improving perfusion with resuscitation; after glucose: glucose and neurological improvement; after ventilation: effective chest movement and improving gas exchange. If the expected change does not occur, check delivery, diagnosis and complications.

Handover: identification, key event/onset, working diagnosis, threats, decisive observations and trend, treatment/dose/time/response, relevant risks, and what needs to happen next. Do not bury hypotension or a difficult airway in a long medication history.

Example sepsis handover: “68-year-old with three days of urinary symptoms, fever and new confusion today. Suspected urinary-source sepsis with poor perfusion: BP 84/48, HR 128, RR 30, temperature 39.2, markedly reduced urine. GCS is 14, glucose 14.6. I will report interventions and response as actually performed. He needs urgent assessment, resuscitation, antimicrobial treatment and consideration of an obstructed urinary source.” Do not claim a treatment or response that has not occurred.`},{id:`cardiac-mechanisms`,title:`Additional cardiac teaching: ACS, arrest rhythms and SVT`,source:`Study Bible`,text:`These lessons expand the presentations that had shorter answers in the original bank. Use them alongside the worked CBL chapters and their QAS source links. Each lesson ends with an application question; answer before reading its response.

ACS without diagnostic ST elevation

ACS describes myocardial ischaemia from an acute coronary process, often plaque disruption with platelet activation and thrombosis. Ischaemia can impair function before a diagnostic surface ECG pattern appears. NSTEMI requires evidence of myocardial injury, usually through troponin testing; unstable angina has ischaemic symptoms without that biomarker-defined infarction. A prehospital nondiagnostic ECG cannot safely distinguish these by itself.

Look for pressure/discomfort, dyspnoea, diaphoresis, vomiting, syncope, risk factors and dynamic changes. Pain can be absent. Repeat ECGs when symptoms change and consider extra leads when the pattern suggests an unseen territory. Differentiate dissection, PE, pneumothorax and gastrointestinal/musculoskeletal pain using the whole presentation. Reproducible discomfort does not automatically exclude a concurrent cardiac process.

Explain care as risk reduction and timely diagnosis: monitoring, indicated antiplatelet and symptom treatment, haemodynamic assessment, serial evaluation and appropriate transport. Oxygen treats an oxygenation indication rather than the label ACS alone. Anticoagulants and additional antiplatelets require the relevant pathway; do not automatically apply a STEMI reperfusion regimen to all chest pain. Hospital care may include serial troponin/ECG, risk stratification, angiography and treatment of another cause.

Apply: The first ECG is normal but pain and sweating persist. Answer: maintain suspicion, reassess, repeat ECG and transport appropriately. One normal tracing is a time-specific sample, not proof of absence of ACS.

Arrest rhythms and the reason for different treatment

In VF the ventricular electrical activity is disorganised and does not create effective output. Pulseless VT can be organised and rapid but still produce no effective circulation. Defibrillation attempts to terminate the abnormal electrical activity so an effective rhythm can resume; it does not guarantee a pulse. Resume high-quality CPR according to the algorithm and reassess at appropriate intervals.

In PEA there is electrical activity without effective palpable circulation; look for causes such as hypoxia, profound volume loss, obstruction, metabolic disturbance or poisoning. In asystole no ventricular activity is apparent. Check the patient, connections, lead selection and trace quality while avoiding unnecessary interruptions. Confirmed asystole and PEA are not shockable rhythms. Shock energy will not correct an empty circulation or absent effective electrical activity.

For medical arrest use the applicable adult/paediatric QAS sequence, early rhythm assessment, effective compressions/ventilation, appropriate medicines and reversible-cause treatment. The adult bank specifies the reviewed shock/drug sequence. Traumatic arrest has a distinct priority structure explained in its CBL chapter. Do not memorise one generic algorithm for both. After ROSC continue airway, ventilation, oxygenation, haemodynamic and neurological care and investigate the cause; the task is not finished when a pulse appears.

Apply: A broad-complex rhythm is visible at 180/min. Answer: immediately establish whether there is effective circulation and assess stability. Pulseless VT belongs to arrest care; VT with a pulse requires its own stability-based pathway and scope-appropriate escalation. An ECG label alone cannot choose the treatment.

SVT and compensatory tachycardia

Many regular narrow-complex SVTs involve re-entry: an electrical impulse repeatedly circulates through a pathway rather than following normal sinus timing. Very fast rates can shorten filling time and impair output. But sinus tachycardia may be necessary compensation for bleeding, infection, hypoxia or pain. Suppressing the compensatory rate can miss the cause.

Assess onset, regularity, P waves, QRS width, rate variability, precipitant and perfusion. A sudden regular palpitation episode without an evident physiological trigger may support SVT; rate alone does not prove it. Irregular narrow tachycardia raises different possibilities, including AF. A broad rhythm needs a different diagnostic and treatment approach.

The QAS stable-SVT pathway includes an appropriately screened modified Valsalva manoeuvre. Increasing vagal activity can slow AV nodal conduction and interrupt an AV-node-dependent circuit. It is not a treatment for every tachycardia. Hypotension, syncope, ischaemic symptoms or other significant compromise change the plan toward urgent advanced support and the relevant cardioversion pathway. Do not automatically import adenosine from another service's algorithm.

Apply: HR 140 after a major bleed, visible sinus P waves and BP 80/50. Answer: treat haemorrhagic shock. The fast rate is a physiological response; it does not make Valsalva or cardioversion appropriate.`},{id:`copd-co2-retention`,title:`COPD: carbon dioxide retention and oxygen reasoning`,source:`Study Bible`,text:`COPD combines persistent airflow obstruction with varying small-airway inflammation, mucus and loss of alveolar structure/elastic recoil. Expiration becomes inefficient, air trapping increases work and some lung units receive mismatched ventilation and perfusion. During an exacerbation, increased inflammation/secretions and fatigue can worsen both oxygenation and CO2 clearance. Smoking cessation can improve symptoms and reduce progression, but established emphysematous destruction is not simply reversed.

An elevated CO2 cannot be inferred from saturation alone. Type 1 respiratory failure concerns hypoxaemia without hypercapnia; type 2 includes hypercapnia from inadequate effective ventilation. Blood gases establish these categories. Drowsiness, poor effort and fatigue are warning signs requiring reassessment, not a reason to accept dangerous breathing because “this is their COPD”.

QAS targets 88–92% SpO2 in COPD. Excess oxygen can worsen CO2 retention, importantly through V/Q effects and also the Haldane effect; reduced respiratory drive is not the whole explanation. This is a reason to titrate oxygen, not to withhold lifesaving oxygen/ventilation in critical hypoxaemia or arrest. Use indicated bronchodilators/anti-inflammatory treatment and minimise exertion. Evaluate pneumonia, ACPO, PE, pneumothorax and ACS as alternatives or concurrent illness. Hospital treatment may include blood gases and non-invasive ventilatory support when appropriate. QAS COPD.
Source links: QAS COPD: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0028/219097/cpg_chronic-obstructive-pulmonary-disease.pdf

Apply: saturation improves but the patient becomes drowsy with shallow breaths. Answer: assess ventilation and airway protection immediately. A better SpO2 does not establish recovery; seek support and manage respiratory failure.`},{id:`stroke-glucose-metabolism`,title:`Stroke, hypoglycaemia, DKA and HHS: neurological and metabolic reasoning`,source:`Study Bible`,text:`Ischaemic stroke interrupts regional cerebral blood flow; neurons lose energy and ion regulation. The infarct core is surrounded by potentially salvageable tissue whose fate depends on perfusion and time. Haemorrhage injures tissue directly and may increase intracranial pressure. Similar clinical deficits can arise from either, so field examination does not reliably decide which is present.

Establish last known well, discovery time, baseline function, anticoagulants and symptom progression. Assess glucose and neurological findings systematically; use the specified QAS screening/severity pathway. Consider posterior-circulation symptoms as well as classic unilateral weakness and speech change. Seizure, migraine and hypoglycaemia can mimic stroke, but correcting one abnormality does not excuse a persistent focal deficit.

Protect airway/oxygenation, avoid unnecessary delay, pre-notify and choose destination through the current stroke/LVO pathway. Do not give routine aspirin or lower BP simply because a stroke is suspected without the relevant indication. Keep swallowing risk in mind. Definitive care requires imaging and may include thrombolysis, thrombectomy, haemorrhage management or neurosurgery. Eligibility is not captured by a single “too late” cutoff; selected patients may qualify through later imaging-based pathways. A resolved deficit still warrants urgent TIA evaluation. QAS stroke and TIA.
Source links: QAS stroke and TIA: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219060/CPG_Stroke-and-Transient-ischaemic-attack.pdf

Apply: symptoms began during sleep. Answer: document when last known normal and when discovered; do not invent an onset time. Seek pathway advice rather than automatically excluding the patient from specialist treatment.

Hypoglycaemia and recurrence
