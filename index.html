ck TXA/resuscitation eligibility without delay.`]),n(`change`,`Heavy bleeding continues after the first intervention. What is the next step?`,0,[`Reassess the wound and escalate effective pressure, packing or tourniquet technique as appropriate.`,`Continued bleeding means control has failed. The next intervention must stop the loss using the relevant procedure.`],[`Leave the first intervention unchanged until TXA has time to work.`,`Ongoing life-threatening bleeding needs immediate mechanical correction; waiting permits further shock and coagulopathy.`],[`Remove all pressure to estimate blood loss more precisely.`,`Unnecessary release of control can worsen bleeding. Assess effectiveness while maintaining or improving haemostasis.`])],26:[n(`priority`,`Which plan best addresses severe chest-injury distress and shock?`,1,[`Wait for tracheal deviation to confirm the diagnosis before escalating.`,`Tracheal deviation may be late or absent. These respiratory and perfusion findings require clinical action.`],[`Support breathing, urgently assess for tension physiology and arrange indicated decompression within authorised scope.`,`Rising pleural pressure can impair ventilation and venous return. Obtain appropriate support while treating the threat and arranging transport.`],[`Treat with fluid alone because all traumatic shock is haemorrhagic.`,`Obstructive and haemorrhagic mechanisms can coexist; fluid does not relieve tension physiology.`]),n(`change`,`The patient worsens during necessary assisted ventilation. What should you do?`,2,[`Stop all ventilatory support and wait for spontaneous breathing to improve.`,`Inadequate breathing still needs effective support. Manage the suspected cause while providing necessary ventilation.`],[`Increase ventilation pressure aggressively without reassessing the chest.`,`Positive pressure can worsen untreated tension. Check ventilation effectiveness and evolving chest findings.`],[`Reassess ventilation and chest obstruction immediately, expedite authorised decompression and consider other shock causes.`,`Deterioration with positive pressure heightens concern for tension physiology. Continue necessary support and targeted treatment with repeated reassessment.`])],27:[n(`priority`,`What is appropriate while perfusion is initially preserved?`,0,[`Give indicated oxygen and analgesia, repeat chest/perfusion assessments and transport.`,`Possible traumatic pneumothorax needs observation for progression. Initial stability does not remove the risk.`],[`Decompress solely because right-sided air entry is reduced.`,`Possible simple pneumothorax alone does not establish the decompression indication; use clinical findings and the applicable CPP.`],[`Discharge once pain improves because the BP is normal.`,`Normal initial BP and analgesic response do not exclude deterioration or significant chest injury.`]),n(`change`,`Falling BP accompanies worsening dyspnoea and air entry. What changes?`,1,[`Continue the original plan without reassessment because the first BP was normal.`,`New shock and respiratory deterioration change the clinical picture and urgency.`],[`Reassess for tension physiology and act on any new decompression indication within scope while escalating care.`,`A simple pneumothorax can progress. Clinical deterioration requires fresh assessment and timely authorised treatment.`],[`Give additional analgesia and wait for tracheal deviation.`,`Analgesia does not treat obstructive shock; late signs must not delay indicated emergency care.`])],28:[n(`priority`,`Which action should happen immediately after safe extraction?`,2,[`Try to drain water from the lungs before ventilating.`,`Attempts to empty the lungs delay oxygenation and ventilation and may increase aspiration.`],[`Treat the slow pulse as an isolated dysrhythmia while postponing airway care.`,`Critical hypoxia and hypothermia can cause bradycardia; this patient has profoundly inadequate breathing.`],[`Clear the airway as needed and provide effective oxygenation and ventilation while monitoring and preventing heat loss.`,`The immediate threat is inadequate gas exchange. Judge ventilation effectiveness, rewarm appropriately and reassess pulse/perfusion.`]),n(`change`,`No pulse can now be confidently found. What is the next priority?`,0,[`Transition promptly to the applicable resuscitation pathway, continuing effective ventilation and hypothermia care.`,`The assessment now supports arrest. Use the appropriate pathway and reversible-cause treatment rather than the previous perfusing-patient plan.`],[`Delay resuscitation until the patient reaches normal temperature.`,`Hypothermia affects resuscitation decisions but does not justify withholding immediate indicated resuscitation.`],[`Wait for the frothy secretions to disappear before starting arrest care.`,`Manage secretions without delaying lifesaving ventilation and resuscitation.`])],29:[n(`priority`,`What deserves priority over completing the burn-area calculation?`,1,[`Assume SpO2 95% excludes inhalation injury and carbon monoxide exposure.`,`Conventional pulse oximetry does not exclude carbon monoxide exposure; airway swelling can evolve despite this reading.`],[`Assess the threatened airway and obtain early airway expertise while stopping burning and preventing hypothermia.`,`New hoarseness with this exposure warrants urgent airway assessment. Coordinate cooling and wound care with airway priorities.`],[`Complete a precise burn percentage and large fluid plan before assessing the voice change.`,`The anatomical information is incomplete and airway compromise can kill first. Paediatric fluid decisions require the relevant consultation.`]),n(`change`,`Stridor develops and the voice becomes weaker. What should happen?`,2,[`Continue dressings first because airway swelling usually takes hours.`,`The child has current progressive airway compromise; predicted timing cannot override the examination.`],[`Force a detailed throat examination to document the burn depth.`,`Provoking distress may worsen a threatened airway and does not resolve the immediate problem.`],[`Immediately reprioritise airway/ventilation support, urgently escalate to appropriate airway capability and expedite care.`,`Stridor and weakening voice suggest evolving obstruction. Do not let wound measurements or dressings delay airway management.`])],30:[n(`priority`,`What is the safest plan for this child swallowing and vomiting fresh blood?`,0,[`Protect the airway, prepare suction, assess perfusion, keep nil by mouth and arrange urgent definitive care.`,`Swallowed blood may conceal the extent of loss. Airway and circulation require concurrent attention and ENT-capable care.`],[`Give oral fluids to replace the swallowed blood and observe at home.`,`Oral intake is unsafe and does not address haemorrhage or the need for definitive assessment.`],[`Probe the operative site to remove the clot and identify the vessel.`,`Out-of-hospital manipulation can precipitate major bleeding. Follow the specific pathway and prepare for airway deterioration.`]),n(`change`,`Bleeding appears to stop and the parent requests staying home. What is the appropriate response?`,1,[`Agree because cessation proves the wound has sealed permanently.`,`Bleeding may recur and visible loss may underestimate severity. Temporary cessation is not proof of safety.`],[`Explain the risk of recurrence and occult loss, continue monitoring and proceed to definitive hospital care.`,`Post-tonsillectomy bleeding needs urgent evaluation even after apparent cessation. Protect the airway and reassess perfusion during transport.`],[`Offer food and drink as a swallowing test before deciding.`,`Keep the child nil by mouth and avoid creating aspiration or procedural delays.`])],31:[n(`priority`,`Which approach best fits haematemesis, cirrhosis and shock?`,2,[`Give TXA automatically because any major bleeding is an indication.`,`The reviewed QAS TXA DTP does not list routine GI bleeding. Use the condition-specific pathway and assess each medicine separately.`],[`Give oral fluid and wait to see if the next stool is still black.`,`Shock and ongoing airway risk require immediate support and urgent care; oral intake is inappropriate.`],[`Protect the airway, support perfusion, keep nil by mouth and urgently transport with a focused medication and liver history.`,`Upper GI bleeding can deteriorate quickly. Assess anticoagulants/NSAIDs and the specific ceftriaxone indication without delaying definitive care.`]),n(`change`,`Vomiting recurs as consciousness declines. What is now most urgent?`,0,[`Reassess/protect the airway, prepare suction and provide indicated ventilation while expediting definitive care.`,`Blood and reduced responsiveness increase aspiration and ventilation risk. Circulatory support and transport continue in parallel.`],[`Lie the patient flat and leave the airway unattended while obtaining a detailed history.`,`Deteriorating consciousness with haematemesis demands active airway protection and positioning suited to the clinical state.`],[`Delay transport until the bleeding source is definitely identified.`,`The patient needs stabilisation and definitive investigation; certainty about the source must not delay care.`])],32:[n(`priority`,`How should you approach poor perfusion after two days of GI losses?`,1,[`Give the same large fluid volume to every patient with low BP.`,`Volume needs and tolerance vary, especially with heart or kidney disease; use assessment and response.`],[`Assess the cause and fluid tolerance, support perfusion and reassess after each intervention.`,`GI losses support hypovolaemia but do not exclude sepsis or other shock. Repeated perfusion and respiratory checks guide treatment.`],[`Rule out serious illness because SpO2 and glucose are normal.`,`Normal saturation and glucose do not establish adequate circulating volume, renal perfusion or haemodynamic stability.`]),n(`change`,`Crackles and dyspnoea develop during fluid treatment. What should you do?`,2,[`Continue the planned volume because the initial BP was low.`,`Respiratory deterioration during an intervention needs immediate reassessment rather than completion by routine.`],[`Treat the crackles as definitive proof that the original illness was sepsis.`,`Crackles are not specific for sepsis; consider fluid intolerance, cardiac dysfunction and other causes.`],[`Stop and reassess the fluid intervention, respiratory status and shock mechanism; escalate support as required.`,`New respiratory findings may signal fluid intolerance or a different mechanism. Reconsider the plan and balance perfusion against respiratory harm.`])]},i=[{id:`station-33`,number:33,title:`Paediatric upper-airway collapse — CBL 5`,dispatch:`Young child with noisy breathing`,cluster:`complex`,brief:`Uploaded CBL presentation: 2-year-old after two days of fever/cough; unresponsive, stridor, RR 60, HR 50, SpO2 89%, BGL 4.0. The worked case also describes mottling and prolonged capillary refill. The cause of the upper-airway obstruction is not established by the supplied history. Task: demonstrate the first minute and explain your transition to resuscitation.`,viva:`why does paediatric hypoxia cause bradycardia; what QAS age-specific pathway applies?  Trace airway narrowing → increased resistance/work → fatigue → hypoxaemia/CO2 retention → myocardial hypoxia/bradycardia. Compare croup, bacterial upper-airway disease and foreign body. Explain why a conscious obstructed child should not be agitated, while an unconscious child needs airway rescue.`,change:`Invented training change: breathing ceases and a pulse cannot confidently be identified within 10 seconds.`,checkpoints:`effective ventilation, early assistance, reassessment, appropriate arrest care; no delay for a full history.  Immediately address airway patency, oxygenation and effective BVM ventilation; use two-person technique where available and assess chest rise. Optimise position/seal and use authorised adjuncts if ineffective. Apply the current QAS age-specific paediatric pathway when indicated; do not import a universal under-60 compression rule for all children or delay ventilation for nebulised medicine or throat examination. Arrange paediatric airway/critical-care help and post-resuscitation care.`,sources:[{title:`QAS paediatric non-traumatic resuscitation CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219109/CPG_Resuscitation-Paediatric-Non-traumatic.pdf`},{title:`Croup CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/219098/CPG_Croup.pdf`}]},{id:`station-34`,number:34,title:`Adult asthma and interrupted medicine access — CBL 6`,dispatch:`Adult struggling to speak clearly`,cluster:`complex`,brief:`Uploaded CBL presentation: 20-year-old, short phrases, tripod, HR 116, RR 22, BP 140/88, preventer unavailable and reliever empty. SpO2 is not supplied and must be measured. The worked case identifies budesonide as the preventer and terbutaline as the reliever; HR and RR alone do not establish severity. Task: obtain missing severity information and select delivery/treatment.`,viva:`preventer versus reliever mechanisms; delivery limitations; safe discharge/ongoing-care considerations.  Explain airway inflammation, smooth-muscle constriction, oedema, mucus and expiratory air trapping. Compare budesonide anti-inflammatory action with terbutaline beta2 relief. Discuss pneumothorax, anaphylaxis and infection when supported by new findings. What clinical signs show improvement beyond the pulse rate?`,change:`Invented training change: speech shortens and entry falls.`,checkpoints:`do not use RR alone; recognise worsening; address medicine access without judgement.  Assess speech, effort, entry, SpO2, consciousness and trajectory; choose delivery suited to severity and ability. Use indicated bronchodilator/anti-inflammatory care and reassess. Add ipratropium only for the guideline response/severity indications. Steroids do not reverse immediate respiratory failure. Address access, inhaler technique and the action plan after stabilisation without blaming the patient.`,sources:[{title:`Asthma CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/219096/CPG_Asthma.pdf`},{title:`QAS drug therapy protocols: eligibility, preparation and scope`,url:`https://www.ambulance.qld.gov.au/clinical/cpm/drug-therapy-protocols`}]},{id:`station-35`,number:35,title:`Elderly collapse, long lie and arm injury — CBL 7`,dispatch:`Older adult found on floor`,cluster:`complex`,brief:`Uploaded CBL presentation: 88-year-old found after hours on floor; HR 120, BP 95/50, SpO2 89%, temperature 35°C, painful arm with distal sensory change. The worked case also gives RR 24 and an uncertain collapse mechanism. Worksheet correction: E4 + V4 + M5 totals GCS 13, despite a printed 14; re-examine the actual components. Task: give a two-problem formulation and prioritised assessment.`,viva:`crush physiology, occult medical collapse, compartment syndrome.  Explain how prolonged compression can release potassium/myoglobin and threaten rhythm/renal function without proving rhabdomyolysis from the history alone. Why do present pulses fail to exclude compartment syndrome? Compare infection, cardiac/neurological collapse, occult bleeding and secondary trauma.`,change:`Invented training change: increasing arm pain and ECG widening.`,checkpoints:`ABC/perfusion support, ECG/electrolyte concern and escalation, neurovascular checks; don't assume the fracture explains everything.  Support oxygenation/perfusion, obtain ECG/glucose, prevent heat loss and perform a head-to-toe examination. Check and document arm circulation, movement, sensation and pain before/after splinting. Avoid standing observations in this unstable patient or an unreviewed large fluid load. Escalate concern for dysrhythmia/electrolyte injury and arrange hospital imaging, renal/electrolyte/CK and infection assessment.`,sources:[{title:`Crush injury CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0021/219135/cpg_crush-injuries.pdf`},{title:`Extremity injury CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/308752/CPG_Extremity-injury.pdf`}]},{id:`station-36`,number:36,title:`Child mixed TCA/benzodiazepine poisoning — CBL 8`,dispatch:`Drowsy child near missing tablets`,cluster:`complex`,brief:`Uploaded CBL presentation: 4-year-old, possible 600 mg Endep and 100 mg Valium missing, GCS 8, HR 140, BP 70/40, SpO2 99%. These are maximum possible missing quantities, not proven ingestion; timing and actual weight require confirmation. A high saturation does not establish adequate ventilation or airway protection. Task: interpret risk and request appropriate help.`,viva:`sodium-channel blockade, GABA effects, bicarbonate rationale and scope, flumazenil risk.  Explain amitriptyline fast sodium-channel blockade, antimuscarinic effects and alpha blockade, alongside diazepam GABA-A enhancement. Discuss serial QRS/aVR changes, seizures, hypotension and respiratory risk. Explain sodium loading/alkalinisation and why a sodium-bicarbonate indication does not establish independent ACP2 authority.`,change:`Invented training change: broadening QRS and a generalised seizure.`,checkpoints:`airway/ventilation, serial ECG, authorised seizure treatment, urgent escalation/transport.  Support airway and effective ventilation; use capnography when available and obtain serial ECGs. Treat seizures through the authorised pathway and seek urgent toxicology/advanced support with appropriate paediatric transport. Verify packet strength, maximum missing quantities, timing and co-ingestants without delaying care. Avoid routine flumazenil in suspected mixed TCA poisoning, induced vomiting and oral charcoal with an unprotected airway.`,sources:[{title:`Tricyclic antidepressant poisoning CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0017/219131/cpg_tricyclic-antidepressants.pdf`},{title:`Sodium bicarbonate DTP: indications and scope`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/219373/DTP_Sodium-bicarbonate-84.pdf`},{title:`RCH tricyclic antidepressant poisoning guidance`,url:`https://www.rch.org.au/clinicalguide/guideline_index/Tricyclic_Antidepressant_%28TCA%29_Poisoning/`},{title:`RCH benzodiazepine poisoning guidance`,url:`https://www.rch.org.au/clinicalguide/guideline_index/Benzodiazepine_Poisoning/`}]},{id:`station-37`,number:37,title:`Traumatic PEA — CBL 17`,dispatch:`Rider unresponsive after high impact`,cluster:`complex`,brief:`Uploaded CBL presentation: ejected rider; pulseless, apnoeic, organised rhythm 44, groin bleeding, chest/pelvic trauma, poor left entry. The worked case records ETCO2 9; this can reflect very low pulmonary blood flow and is not a stand-alone airway-failure or termination finding. Task: allocate concurrent reversible-cause treatment.`,viva:`why electrical activity is insufficient; medical versus traumatic arrest.  Explain why organised electrical impulses cannot eject blood from an empty or mechanically obstructed circulation. Compare blood loss, hypoxia, tension pneumothorax and tamponade. How would a witness account of collapse before a minor collision change your formulation? What governs cessation?`,change:`Invented training change: oxygenation improves but still no pulse.`,checkpoints:`bleeding/volume, hypoxia, chest obstruction/tamponade; no fixation on the monitor or routine drug sequence.  Allocate concurrent catastrophic haemorrhage control, indicated pelvic stabilisation, ventilation/chest assessment and appropriate volume/advanced support. Use the traumatic-arrest pathway; compressions must not displace correction of reversible traumatic causes. Consider indicated bilateral decompression only within authorisation. Reassess intervention effectiveness and plan definitive blood/surgical care. Do not fixate on adrenaline, the monitor or isolated ETCO2/pupil findings; use full cessation criteria and consultation.`,sources:[{title:`QAS traumatic resuscitation CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0015/219111/CPG_Resuscitation-Traumatic.pdf`},{title:`Traumatic haemorrhagic shock CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/308753/CPG_Traumatic-haemorrhagic-shock.pdf`}]},{id:`station-38`,number:38,title:`Penetrating chest injury with persistent shock — CBL 18`,dispatch:`Adult with penetrating chest wound`,cluster:`complex`,brief:`Uploaded CBL presentation: chest stab, BP 78/54, severe distress, reduced left entry, neck-vein distension. The worked mock gives HR 132, RR 34 and SpO2 89%. The teaching ECG is labelled 112/min while the written observations give 132/min; measure the current rate and trend rather than silently choosing one. Task: rank threats and act.`,viva:`tension versus haemothorax versus tamponade.  Compare pleural air impairing ventilation/venous return, pleural blood causing both volume loss and compression, and pericardial blood restricting filling. Explain why these can coexist, why neck veins may not distend with major blood loss and why low voltage alone does not diagnose tamponade.`,change:`Invented training change: entry improves after an indicated intervention, but BP remains low.`,checkpoints:`reconsider mixed causes, urgent definitive care, intervention-effectiveness review.  Provide appropriate wound care, oxygenation/necessary ventilation, indicated authorised decompression, haemorrhage/perfusion support and analgesia suited to shock. Expedite trauma transport/notification. After intervention reassess air entry, work, BP and consciousness; check for ineffective treatment, recurrence, haemorrhage, tamponade and other injury. Persistent shock is not an automatic indication for another needle.`,sources:[{title:`Chest injuries CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219134/cpg_chest-injuries.pdf`},{title:`Traumatic haemorrhagic shock CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/308753/CPG_Traumatic-haemorrhagic-shock.pdf`},{title:`QAS Clinical Practice Manual: current procedures and scope`,url:`https://www.ambulance.qld.gov.au/clinical/cpm`}]},{id:`station-39`,number:39,title:`Complete lower-limb amputation — CBL 19`,dispatch:`Worker with severe limb injury`,cluster:`complex`,brief:`Uploaded CBL presentation: ongoing bleeding despite improvised tourniquet, HR 138, BP 84/52, confusion, SpO2 98%. The worked case records CRT 5 seconds. Its stated 1040 tourniquet time precedes the 1045 event: clarify whether 1045 is dispatch/assessment time or an error; do not rewrite the timeline. Task: achieve effective haemorrhage control and organise transport.`,viva:`oxygen delivery, coagulopathy, TXA/antibiotic eligibility, part preservation.  Explain low preload/stroke volume and how hypothermia, acidosis and coagulopathy worsen haemorrhage. Why can saturation stay 98% when oxygen delivery is critically low? Distinguish TXA eligibility, open-long-bone/amputation antibiotic eligibility and shock treatment; explain indirect cooling of the amputated part.`,change:`Invented training change: coworker wants to remove the tourniquet because it hurts.`,checkpoints:`no routine loosening, pain care, accurate time, reassessment after movement.  Correct ineffective control immediately using the authorised tourniquet/haemorrhage procedure, potentially requiring an additional suitable device. Recheck after movement, document accurate time/position and treat pain without routine loosening. Prevent heat loss, assess other injury and TXA/antibiotic eligibility separately, and organise resuscitation/transport. Package the part against contamination and direct freezing under the current procedure; patient care takes priority over unsafe retrieval. Replantation is a specialist decision.`,sources:[{title:`Traumatic haemorrhagic shock CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/308753/CPG_Traumatic-haemorrhagic-shock.pdf`},{title:`Extremity injury CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/308752/CPG_Extremity-injury.pdf`},{title:`QAS drug therapy protocols: eligibility, preparation and scope`,url:`https://www.ambulance.qld.gov.au/clinical/cpm/drug-therapy-protocols`},{title:`QAS Clinical Practice Manual: current procedures and scope`,url:`https://www.ambulance.qld.gov.au/clinical/cpm`}]},{id:`station-40`,number:40,title:`Posterior MI without chest pain — CBL 14`,dispatch:`Older adult breathless and nauseated`,cluster:`complex`,brief:`Uploaded CBL presentation: 73-year-old with diabetes, sudden dyspnoea/vomiting/near-syncope, BP 94/62; V1–V3 horizontal depression/tall R waves. The worked mock also gives HR 112, RR 28, SpO2 93% and BGL 10.8; the worked guide notes sweating and crackles. No pain does not make this stable. Task: identify extra leads and urgent pathway.`,viva:`reciprocal view and implications of low BP.  Explain how posterior injury can appear as anterior ST depression with tall R waves and why posterior leads help. Compare PE, dysrhythmia, acute failure and other shock causes. Why does BGL 10.8 not diagnose DKA, and why do low BP plus crackles limit simple fluid/vasodilator plans?`,change:`Invented training change: V7–V9 elevation appears; crackles worsen.`,checkpoints:`no reassurance from absent pain; prompt referral and patient-specific treatment.  Obtain posterior leads and repeat/transmit ECGs, recognise possible occlusion despite absent pain and promptly pursue the current reperfusion referral. At the supplied BP, GTN does not meet the reviewed DTP safety threshold. Reassess rhythm, perfusion and breathing; screen each medicine and full referral contraindications separately. Confirm advice, destination and orders by read-back; do not invent an ETA or wait for pain to appear.`,sources:[{title:`Acute coronary syndrome CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219019/CPG_Acute-coronary-syndrome.pdf`},{title:`Pre-hospital cardiac reperfusion CPP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/308765/CPP_Pre-hospital-cardiac-reperfusion.pdf`}]},{id:`station-41`,number:41,title:`Altered sensation — Week 2 dispatch variant`,dispatch:`Sudden arm numbness at home`,cluster:`complex`,brief:`Invented training dispatch variant: elderly patient reports sudden left-arm numbness. No observations provided until requested. The original Week 2 dispatch was incomplete; these station details are practice additions, not confirmed original observations. Task: establish onset, neurological pattern and glucose while assessing ABCs.`,viva:`why a mimic and stroke can coexist.  Explain hypoglycaemic neuronal energy failure versus stroke, the evidence favouring each and why clinical examination cannot reliably separate ischaemic from haemorrhagic stroke. Why must glucose correction be followed by repeat neurological assessment? What do last-known-well, baseline function and anticoagulant history change?`,change:`Invented training change: examiner supplies BGL 2.5, then residual weakness after glucose correction.`,checkpoints:`treat low glucose, repeat examination, preserve last-known-well and escalate persistent focal deficit.  Clarify the actual symptom, suddenness/onset and focal pattern; assess ABCs, glucose, neurological findings, baseline function, headache, trauma and anticoagulants. Treat identified hypoglycaemia through a safe authorised route and reassess. Persistent focal deficit remains a stroke concern and needs time-critical referral/destination decisions. Preserve last-known-well; do not give empirical aspirin or assume improvement excludes coexisting stroke.`,sources:[{title:`Stroke and transient ischaemic attack CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219060/CPG_Stroke-and-Transient-ischaemic-attack.pdf`},{title:`Hypoglycaemia CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0024/219048/CPG_Diabetic-emergency-Hypoglycaemia.pdf`}]},{id:`station-42`,number:42,title:`Unconscious after a fall — Week 2 dispatch variant`,dispatch:`Young adult unresponsive after fall`,cluster:`complex`,brief:`Invented training dispatch variant: 20-year-old, unconscious but breathing after fall. The original Week 2 dispatch was incomplete; these station details are practice additions, not confirmed original observations. Task: protect airway and investigate cause/mechanism.`,viva:`postictal state versus continuing seizure, TBI, hypoglycaemia and poisoning.  Explain primary traumatic brain injury versus a medical collapse causing secondary trauma. Compare postictal state, continuing seizure, hypoglycaemia, dysrhythmia and poisoning. Why do hypoxia and hypotension worsen secondary brain injury, and why should major shock trigger a search beyond an isolated head injury?`,change:`Invented training change: witness says a seizure preceded the fall; patient is still not recovering.`,checkpoints:`repeated GCS/glucose/ventilation assessment; no premature “just postictal” conclusion.  Open/protect the airway and support ventilation with spinal precautions when indicated. Establish witnessed sequence, height/impact, glucose, ECG, GCS components, pupils and a full chest/abdominal/pelvic assessment. Repeat consciousness, glucose and ventilation assessment; do not label persistent coma just postictal. Treat immediate threats and arrange appropriate trauma/medical destination, imaging and consultation.`,sources:[{title:`Seizure CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219059/cpg_seizure.pdf`},{title:`Approach to the poisoned patient CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219114/cpg_approach-to-the-poisoned-patient.pdf`},{title:`QAS Clinical Practice Manual: current procedures and scope`,url:`https://www.ambulance.qld.gov.au/clinical/cpm`}]},{id:`station-43`,number:43,title:`Behavioural disturbance with a medical cause — Week 2 dispatch variant`,dispatch:`Adult distressed with police present`,cluster:`complex`,brief:`Invented training dispatch variant: 40-year-old yelling; QPS requests mental-health assessment. The original Week 2 dispatch was incomplete; these station details are practice additions, not confirmed original observations. Task: safe, least-restrictive engagement and medical screen.`,viva:`delirium versus psychiatric illness; sedation risks in physiological compromise.  Compare acute medical/toxic delirium with a primary mental-health crisis. Discuss hypoxia, hypoglycaemia, hyperthermia, infection, drugs and trauma. What does capacity assessment require, and why does police presence not itself authorise a restrictive intervention? Explain sedation-related respiratory risk and monitoring.`,change:`Invented training change: temperature 39°C, RR 30 and new confusion are established.`,checkpoints:`revise diagnosis, treat medical threats, obtain relevant consultation and monitor appropriately.  Approach safely with one calm communicator, personal space and the least restrictive effective engagement. Assess onset/baseline, behaviour/SAT, glucose, oxygenation and temperature as achievable; seek collateral medical/exposure history. Revise the formulation when physiological red flags emerge. Treat underlying threats, obtain appropriate consultation and monitor. Sedation requires the current indication, scope and monitoring; police involvement must not replace medical or capacity assessment.`,sources:[{title:`Acute behavioural disturbance CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219015/CPG_acute-behavioural-disturbance.pdf`},{title:`Sepsis CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219052/cpg_sepsis.pdf`},{title:`Approach to the poisoned patient CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219114/cpg_approach-to-the-poisoned-patient.pdf`}]},{id:`station-44`,number:44,title:`Nausea with colour change — Week 2 dispatch variant`,dispatch:`Nauseated adult with changing colour`,cluster:`complex`,brief:`Invented training dispatch variant: 55-year-old nauseated at 03:00, reported to be changing colour. The original Week 2 dispatch was incomplete; these station details are practice additions, not confirmed original observations. Task: clarify colour, respiratory/perfusion signs and cardiac symptoms.`,viva:`why antiemetic-only care is unsafe and why serial ECGs matter.  Explain how pallor, cyanosis and mottling suggest different threats and why nausea can accompany ACS, arrhythmia, hypoxaemia or shock. Compare cardiac ischaemia with non-coronary causes of poor oxygen delivery. Why does a nondiagnostic first ECG or relief after an antiemetic not establish safety?`,change:`Invented training change: pale/clammy, BP 86/54, dyspnoeic; first ECG is nondiagnostic.`,checkpoints:`identify shock, investigate ACS and other causes, reassess and transport urgently.  Clarify the colour change and assess airway, ventilation, oxygenation and perfusion; obtain early ECG/glucose and repeat observations. Ask about dyspnoea, chest/epigastric discomfort, diaphoresis, syncope, bleeding, medication and exposures. Support shock physiology while considering cardiac, respiratory and other causes; use serial ECGs and urgent monitored transport/notification. An antiemetic alone must not replace assessment or definitive care.`,sources:[{title:`Acute coronary syndrome CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219019/CPG_Acute-coronary-syndrome.pdf`},{title:`QAS Clinical Practice Manual: current procedures and scope`,url:`https://www.ambulance.qld.gov.au/clinical/cpm`}]}];Object.assign(r,{33:[n(`priority`,`What must lead the first minute for this unresponsive child with stridor and bradycardia?`,0,[`Call for help while opening the airway and providing effective oxygenation and ventilation, judging actual chest rise.`,`This is a peri-arrest presentation. Airway narrowing, fatigue and hypoxia can produce myocardial hypoxia and bradycardia; immediate effective ventilation is essential.`],[`Complete the full history and croup score before starting respiratory support.`,`Unresponsiveness and severe respiratory compromise demand immediate support. Assign history gathering to another team member if available.`],[`Give nebulised medicine alone and wait for the heart rate to recover.`,`Nebulised treatment cannot substitute for effective ventilation in an inadequately breathing or apnoeic child.`]),n(`change`,`Breathing ceases and no pulse is confidently identified within 10 seconds. What now?`,1,[`Wait for the heart rate to cross a universal paediatric threshold before starting arrest care.`,`Do not import an unqualified under-60 rule across ages. This change describes absent normal breathing and no confidently identified pulse; use the applicable arrest pathway.`],[`Transition immediately to the current QAS paediatric resuscitation pathway with effective ventilation and rhythm assessment.`,`The clinical task has changed to resuscitation. Use the age-specific pathway and authorised interventions while obtaining appropriate advanced help.`],[`Force a detailed throat inspection before proceeding with resuscitation.`,`Do not delay ventilation and arrest care. Suspected foreign-body obstruction requires the relevant resuscitation airway algorithm and trained interventions.`])],34:[n(`priority`,`How should severity and treatment delivery be assessed in this short-phrase, tripod presentation?`,2,[`Classify this as mild solely because RR is 22.`,`RR alone does not grade severity. Speech, effort, air entry, oxygenation, mentation and trajectory matter.`],[`Use the preventer as the only immediate rescue treatment.`,`Anti-inflammatory maintenance treatment and rapid bronchodilation have different roles. A steroid is not an immediate rescue for respiratory failure.`],[`Obtain missing oxygenation/severity findings, choose suitable bronchodilator delivery and reassess the response.`,`Treatment must fit both severity and ability to use the device. Assess oxygen need and indicated adjuncts through the current guideline.`]),n(`change`,`Speech shortens and air entry falls. How should you interpret the change?`,0,[`Recognise worsening obstruction, reassess for respiratory failure and escalate rescue/support with urgent transport.`,`Less air entry with reduced speech is deterioration. Judge effort, consciousness and effective ventilation; do not wait for steroids to act.`],[`Interpret quieter breathing as proof that bronchospasm has resolved.`,`Falling airflow can reduce sound in worsening obstruction. Improved air entry and less work would be more reassuring.`],[`Stop reassessment and focus on securing a replacement preventer before transport.`,`Medicine access needs attention after stabilisation; it must not delay treatment of a deteriorating respiratory emergency.`])],35:[n(`priority`,`Which formulation best guides care for this older patient after a long lie?`,1,[`The arm injury alone explains the confusion, hypoxaemia and poor perfusion.`,`A conspicuous injury does not explain away a potentially serious medical cause of collapse or complications of prolonged immobility.`],[`Treat this as undifferentiated medical collapse with secondary trauma, supporting ABCs and assessing the limb concurrently.`,`Hypoxaemia, low BP, hypothermia and an unknown mechanism require a broad assessment alongside repeated neurovascular checks.`],[`Perform standing observations first to confirm dehydration.`,`Standing an unstable, injured patient risks further collapse and delays treatment of current perfusion and respiratory threats.`]),n(`change`,`Arm pain increases and the ECG widens. What is the best response?`,2,[`Exclude compartment injury because a distal pulse can still be felt.`,`Compartment syndrome can occur while distal pulses remain present. Pain, sensory change and the examination need urgent reassessment.`],[`Treat ECG widening as an expected result of the fracture and continue the same plan.`,`Widening may signal a serious electrolyte or cardiac problem. Prolonged compression can release potassium, but this is a concern to assess rather than a confirmed cause.`],[`Reassess the limb and circulation, evaluate dysrhythmia/electrolyte risk and seek urgent appropriate support and transport.`,`The change raises neurovascular and systemic concerns. Reassess ABCs and ECG, escalate and arrange definitive investigation without inventing a confirmed potassium result.`])],36:[n(`priority`,`What does GCS 8 with shock mean despite SpO2 99%?`,0,[`This is a high-risk mixed poisoning needing airway/ventilation assessment, serial ECGs and urgent advanced/toxicology support.`,`Saturation does not establish adequate ventilation or airway protection. Suspected TCA toxicity adds seizures, conduction disturbance and cardiovascular collapse risk.`],[`The saturation makes respiratory support unnecessary and home observation reasonable.`,`A normal saturation can coexist with ineffective ventilation and an unprotected airway. Coma and shock require urgent care.`],[`The maximum missing tablet amount proves the exact ingested dose.`,`Missing quantities establish a maximum possible exposure, not confirmed ingestion. Verify timing, strength, weight and co-ingestants without delaying support.`]),n(`change`,`The QRS broadens and a generalised seizure starts. What is the appropriate response?`,1,[`Give flumazenil routinely to reverse the diazepam component first.`,`Flumazenil can precipitate seizures in mixed TCA exposure and expose proconvulsant toxicity. It is not a routine solution here.`],[`Support airway/ventilation, use authorised seizure treatment and urgently escalate cardiotoxicity management with the applicable scope checks.`,`Sodium-channel toxicity can worsen conduction and circulation. Recognise bicarbonate rationale while distinguishing a treatment indication from independent ACP2 authority.`],[`Wait for a toxicology concentration before changing treatment.`,`Current seizure, conduction disturbance and shock establish immediate danger even while the ingestion history remains uncertain.`])],37:[n(`priority`,`Which team plan best fits this pulseless rider with organised electrical activity?`,2,[`Shock the organised rhythm because the rate is 44.`,`Pulseless organised activity is PEA; the tracing alone is not an indication for defibrillation. Assess rhythm changes through the resuscitation pathway.`],[`Prioritise a routine medical PEA drug sequence while postponing bleeding and chest treatment.`,`Traumatic arrest requires rapid correction of its reversible causes. A drug sequence cannot fill an empty circulation or remove chest obstruction.`],[`Allocate concurrent catastrophic bleeding control, ventilation, pelvic/chest assessment and appropriate traumatic-arrest resuscitation resources.`,`Treat blood loss, hypoxia and chest obstruction/tamponade concurrently where possible. Compressions must not displace reversible-cause treatment.`]),n(`change`,`Oxygenation improves but no pulse returns. What should the team do?`,0,[`Continue traumatic-arrest care and reassess unresolved blood loss, volume and chest obstruction/tamponade with advanced support.`,`Treating hypoxia does not exclude remaining causes. Judge each intervention and continue the current pathway with definitive-care planning.`],[`Treat the oxygenation improvement as ROSC even without circulation.`,`Oxygenation and organised electrical activity do not demonstrate a pulse or effective output. Confirm circulation clinically.`],[`Stop because an initial low ETCO2 proves resuscitation is futile.`,`An isolated ETCO2 result cannot determine cessation. Apply full current criteria and consultation requirements.`])],38:[n(`priority`,`Which approach best fits chest penetration with profound shock and unilateral reduced entry?`,1,[`Assume neck-vein distension proves tamponade and ignore the lung findings.`,`No single sign confirms the cause. Tension pneumothorax, haemothorax, tamponade and vascular injury can coexist.`],[`Support breathing and perfusion, address wound/chest threats with indicated authorised interventions and expedite trauma care.`,`Clinical findings raise urgent concern for obstructive and haemorrhagic mechanisms. Treatment and reassessment must proceed together.`],[`Withhold necessary assisted ventilation because positive pressure may worsen tension.`,`Necessary ventilation still needs to be delivered, with active management of suspected tension and appropriate support.`]),n(`change`,`Air entry improves after an indicated intervention but BP remains low. What next?`,2,[`Repeat decompression automatically until BP normalises.`,`Persistent shock may reflect ineffective/recurrent tension, haemorrhage, tamponade or another injury. Another needle is not an automatic answer.`],[`Declare the shock resolved because one respiratory finding improved.`,`Improved entry does not establish adequate perfusion. Mixed causes may persist.`],[`Check intervention effectiveness and reassess ongoing haemorrhage, tamponade and other injury while expediting definitive care.`,`Reassess BP, work, entry and consciousness. One treated diagnosis does not resolve all threats in a penetrating injury.`])],39:[n(`priority`,`What is the first priority with ongoing bleeding despite an improvised tourniquet?`,0,[`Make haemorrhage control effective using authorised techniques, then recheck while arranging resuscitation and transport.`,`Continued loss means the intervention has failed. A suitable additional device may be needed under the procedure; saturation does not measure adequate oxygen delivery.`],[`Retrieve and package the amputated part before addressing the bleeding.`,`Patient resuscitation and transport take priority. Retrieve the part only when it is safe and does not delay lifesaving care.`],[`Give an antibiotic first because it will correct the shock.`,`Antibiotic eligibility is separate from haemorrhage control and resuscitation; antibiotics do not restore circulating volume.`]),n(`change`,`A coworker wants the tourniquet removed because it hurts. What is the best response?`,1,[`Loosen it intermittently to restore limb flow and relieve pain.`,`Routine loosening can restart catastrophic bleeding. Follow the current procedure rather than intermittently releasing an effective device.`],[`Maintain effective control, explain the bleeding risk, provide appropriate pain care and document/recheck the device and time.`,`Pain deserves treatment without sacrificing haemostasis. Reassess after movement and clarify the source timeline discrepancy for handover.`],[`Ignore the pain and omit further limb or device checks.`,`A tourniquet needs reassessment and accurate documentation. Pain can be managed within the appropriate scope while maintaining bleeding control.`])],40:[n(`priority`,`How should the anterior ECG pattern and painless presentation guide your next action?`,2,[`Exclude ACS because the patient denies chest pain.`,`Older patients and people with diabetes can have ischaemia with dyspnoea, nausea, sweating or near-syncope instead of chest pain.`],[`Give GTN immediately to every patient with possible myocardial ischaemia.`,`The supplied low BP fails the reviewed GTN safety threshold. Each treatment needs a patient-specific indication and contraindication check.`],[`Obtain posterior leads, repeat/transmit ECGs and seek urgent reperfusion advice while reassessing perfusion and breathing.`,`V1–V3 depression with tall R waves can be a reciprocal view of posterior injury. Extra leads and clinical context guide time-critical referral.`]),n(`change`,`V7–V9 elevation appears and crackles worsen. What is the safest response?`,0,[`Escalate the reperfusion/haemodynamic plan, reassess respiratory support and screen treatment against low BP and lung findings.`,`The change supports posterior occlusion with worsening ventricular dysfunction. Prompt specialist-directed reperfusion and patient-specific support are required.`],[`Delay referral until chest pain develops or a troponin result is available.`,`An occlusion presentation can be painless. Waiting for pain or hospital biomarkers delays time-critical care.`],[`Give a routine large fluid load despite worsening crackles.`,`Low BP with worsening crackles may reflect pump dysfunction and fluid intolerance. Treatment needs reassessment rather than a universal volume strategy.`])],41:[n(`priority`,`Sudden left-arm numbness: what is your immediate assessment priority?`,0,[`Assess ABCs, glucose and the neurological pattern; establish last known well.`,`Identify immediate threats, a reversible metabolic mimic and a time-critical focal deficit. Clarify the symptom and baseline function.`],[`Give aspirin immediately for presumed ischaemic stroke.`,`A field examination cannot exclude intracranial haemorrhage. Suspected stroke requires the relevant pathway and imaging; do not give empirical aspirin.`],[`Observe until symptoms resolve before assessing stroke risk.`,`Sudden focal symptoms need prompt assessment even if they later resolve. Waiting may lose critical onset information.`]),n(`change`,`BGL was 2.5. After glucose correction, weakness persists. What next?`,1,[`Attribute the weakness to hypoglycaemia and finish care.`,`A metabolic mimic and stroke can coexist. Persistent focal findings require renewed assessment.`],[`Repeat the neurological examination and escalate the persistent focal deficit through the stroke pathway, preserving last known well.`,`Correcting hypoglycaemia does not exclude coexisting stroke. Persistent weakness remains time-critical.`],[`Wait for complete recovery before considering transport.`,`Waiting can delay time-dependent imaging and treatment. Reassess and use the appropriate referral/destination pathway.`])],42:[n(`priority`,`An adult is unconscious but breathing after a fall. What takes priority?`,2,[`Obtain a complete history before assessing the airway.`,`Airway loss and inadequate ventilation can kill first. Gather history alongside immediate assessment if team resources allow.`],[`Assume head injury explains everything and omit glucose assessment.`,`A medical collapse may have caused the fall. Hypoglycaemia, seizure, dysrhythmia and poisoning remain relevant.`],[`Open/protect the airway, assess and support ventilation, with spinal protection when indicated.`,`Prevent hypoxia while assessing traumatic injuries and possible primary medical collapse. Recheck circulation and consciousness.`]),n(`change`,`A seizure preceded the fall and the patient remains unconscious. What next?`,0,[`Repeat airway, ventilation, GCS and glucose assessments; evaluate ongoing seizure, injury and other causes.`,`Persistent unconsciousness needs active reassessment. A witness account changes the differential without proving a harmless postictal state.`],[`Label this a normal postictal state and wait without reassessment.`,`Ongoing seizure, hypoglycaemia, poisoning or intracranial injury may be present. Monitor and investigate the continuing physiological threat.`],[`Give more anticonvulsant solely because consciousness has not returned.`,`Unconsciousness alone does not establish ongoing seizure. Treatment needs an appropriate indication and monitoring.`])],43:[n(`priority`,`QPS requests a mental-health assessment for a yelling patient. What is the best initial approach?`,1,[`Accept the psychiatric label and omit a medical screen.`,`Agitation can reflect hypoxia, hypoglycaemia, hyperthermia, infection, intoxication or injury. A label must not replace assessment.`],[`Use safe, calm, least-restrictive engagement and obtain a medical assessment as achievable.`,`Safety, communication, onset/baseline and physiological assessment guide the next intervention. Police involvement does not replace consent/capacity assessment.`],[`Sedate immediately because police are present.`,`Police presence is not a sedation indication. Any restrictive treatment needs the applicable indication, authority, scope and monitoring.`]),n(`change`,`Temperature is 39°C, RR 30 and confusion is new. What should change?`,2,[`Continue managing this solely as a primary psychiatric presentation.`,`Fever, tachypnoea and new confusion are medical red flags and require a revised formulation.`],[`Attribute the observations to exertion and stop medical assessment.`,`Do not dismiss concerning physiology without assessment. Investigate medical/toxic causes and repeatedly monitor.`],[`Prioritise acute medical/toxic delirium, address physiological threats and arrange urgent assessment with appropriate monitoring.`,`Revise the diagnosis and obtain consultation. Any sedation must meet an indication and scope requirements with respiratory monitoring.`])],44:[n(`priority`,`A nauseated patient is reportedly changing colour. What is the priority?`,0,[`Clarify the colour change, assess ABCs and perfusion, and obtain an early ECG and glucose.`,`Pallor, cyanosis and mottling may reflect cardiac, respiratory or circulatory compromise. Treat this as an assessment problem beyond nausea.`],[`Give an antiemetic and reassess only if vomiting continues.`,`Symptom relief alone can miss a life-threatening cause. Assess physiological threats and monitor the response.`],[`Exclude ACS because chest pain was not reported.`,`ACS may present with nausea, dyspnoea and autonomic symptoms without chest pain. Obtain relevant history and ECGs.`]),n(`change`,`The patient is pale, clammy, dyspnoeic and hypotensive with a nondiagnostic first ECG. What next?`,1,[`Exclude ACS and discharge if nausea improves.`,`A nondiagnostic ECG does not exclude ACS; hypotension and poor perfusion require urgent care regardless of nausea.`],[`Treat the shock physiology, investigate cardiac and other causes, obtain serial ECGs and transport urgently.`,`Shock demands support, repeated assessment and definitive care while the cause remains under investigation.`],[`Delay transport until an ECG confirms STEMI.`,`Dangerous shock can occur without diagnostic ST elevation. Waiting for a specific tracing risks delaying necessary care.`])]});var a=[...t,...i].map(e=>({...e,decisions:r[e.number]})),o=[...e,...a].sort((e,t)=>e.number-t.number),s=[{id:`all`,title:`All districts`,symbol:`◎`},{id:`cardiac`,title:`Cardiac`,symbol:`♥`},{id:`respiratory`,title:`Respiratory`,symbol:`≋`},{id:`neuro-medical`,title:`Medical`,symbol:`✚`},{id:`trauma`,title:`Trauma`,symbol:`◇`},{id:`complex`,title:`CBL cases`,symbol:`⌘`}],c=[{id:`interpretation`,title:`Interpretation`,prompt:`Identifies severity and decisive observations; ranks plausible differentials; supports a provisional diagnosis; interprets the ECG in context. Avoid: Naming a disease without explaining the evidence; ignoring conflicting information.`},{id:`pathophysiology`,title:`Pathophysiology`,prompt:`Explains a causal mechanism and links it to this patient's observations, risks and comorbidities. Avoid: A memorised definition with no clinical links; needing repeated prompts for basic mechanisms.`},{id:`integrated-care`,title:`Integrated safe care`,prompt:`Sequences actions, gives patient-specific reasons, explains drug effects and safety, anticipates consequences and reassesses. Avoid: A generic list of drugs; unsafe routes/doses; ignoring consent, dignity, culture, scope or deterioration.`},{id:`definitive-care`,title:`Definitive care`,prompt:`States the next level of care, destination reasoning and relevant hospital treatment; explains the paramedic contribution. Avoid: Ending at “transport to hospital” without explaining what the patient needs there.`},{id:`oral-communication`,title:`Oral communication`,prompt:`Clear, logical, concise answers with accurate terms and explicit links between evidence and decisions. Avoid: Rambling, unexplained jargon, abandoning a critical point or answering a different question.`}],l=[{id:`planning`,title:`Planning and responding to deterioration`,prompt:`Prioritise competing threats, explain the priorities, develop a differential and provisional diagnosis, request help with a reason. Rehearsal: Your partner introduces a falling BP or declining consciousness. Reorder actions and explain why.`},{id:`assessment`,title:`Assessment of health status`,prompt:`Obtain pertinent history, observations, focused examination, pain assessment and reassessment; adapt to urgency. Rehearsal: Explain what you assess now, what a crewmate can obtain, and what can safely wait.`},{id:`comprehensive-care`,title:`Comprehensive care`,prompt:`Apply precautions and perform indicated procedures and medicines safely and efficiently, with continuing care. Rehearsal: Demonstrate the procedure on training equipment; check effectiveness and identify the next action.`},{id:`communication`,title:`Open disclosure and professional communication`,prompt:`Give understandable explanations and options, support informed consent, respect patient preferences, communicate accurately and concisely. Rehearsal: Explain one intervention to the patient, seek consent where possible, then give a structured clinical handover.`},{id:`governance`,title:`Governance leadership and scene management`,prompt:`Adapt scene safety, manage team performance, allocate tasks with workload awareness and send timely structured notifications. Rehearsal: Give a named task and reporting point, confirm completion, redistribute work when the team becomes overloaded.`}],ee=[{title:`0:00–0:45 · Read the questions, then the case`,text:`Read the questions first, then the case. Identify precisely what is requested. Note age/weight, chronology, immediate threats and any ECG. Do not spend all five minutes writing a complete essay.`},{title:`0:45–1:45 · Formulate and rank alternatives`,text:`Formulate. Write the leading diagnosis plus severity, three supporting findings and two dangerous alternatives. Circle missing or inconsistent information. Interpret the ECG systematically if supplied.`},{title:`1:45–2:45 · Build the mechanism`,text:`Build the mechanism. Write a causal chain with arrows in your own notes: initiating problem, physiological effect, findings, likely deterioration. Add how relevant comorbidities/medicines change the chain.`},{title:`2:45–4:00 · Sequence care and check calculations`,text:`Sequence treatment and calculations. List immediate care, indicated medicines/procedures, contraindications and monitoring. Use the calculator for units, weight and volume. Mark consultation or advanced-scope requirements. State what you would verify if a needed fact is absent.`},{title:`4:00–4:40 · Plan definitive care`,text:`Plan definitive care. Identify required capability, referral/pre-notification and the treatments beyond paramedic care. Note practical barriers or cultural/communication needs.`},{title:`4:40–5:00 · Rehearse and scan for omissions`,text:`Rehearse your opening and scan for omissions. Ask: “Have I addressed every question? Have I recognised the immediate threat? Have I made any dangerous assumptions?”`}],u=[{id:`using-the-guide`,title:`Using the Study Bible and its limits`,source:`Study Bible`,text:`Prepared for Hector. Study edition 18 October 2026. Exams anticipated 26 and 27 October 2026.

This workbook combines your ten uploaded study files, the full 44-station practice bank, additional clinical explanations and an examination programme matched to the PAR321 Task 2 viva instructions and Task 1D practical rubric you supplied. Completing it means demonstrating recall and clinical reasoning, not merely reading every page. Your actual performance and the official assessment rules determine the result; this resource cannot guarantee a grade.

Use the current QAS CPG, relevant CPP and DTP together. The working clinical scope is ACP2 unless your assessment instructions specify otherwise. Source checks were performed on 17–18 October 2026. An intervention appearing in a CPG does not itself establish your authority to perform it. These are independent study explanations and training scenarios, not an official QAS manual or UniSC answer key.

How this book is organised

Read the assessment methods first, then work through the uploaded cases. The clinical teaching chapters explain additional presentations. Use the station bank for retrieval, and the six mock examinations for timed testing. Source links are retained throughout for checking QAS guidance. Word’s Navigation Pane provides a searchable heading index.

1. Viva format and preparation programme

2. Practical rubric and observable skills

3. Worked uploaded cases, observations, ECGs and medicines

4. Additional clinical teaching

5. Forty four practice stations

6. Six CBL style mock examinations and answer guides

7. Retrieval questions, completion record and source notes

The CBL layout is used as a rehearsal model because it tests the same reasoning skills. It is not confirmation that your exam will reuse those cases or questions. ACPO is covered as cardiogenic pulmonary oedema; APO is also explored by mechanism rather than treated as a separate unambiguous diagnosis. “Hypo” is covered as both hypoglycaemia and hypovolaemia.`},{id:`viva-format-rubric`,title:`Viva: exact format and the five criteria`,source:`Study Bible`,text:`Stage: Pre assessment
Time: 1 minute
What you do: Enter, state name and student number for the camera, receive case and question cards

Stage: Preparation
Time: 5 minutes
What you do: Read the case and questions, plan responses, make notes and use the supplied calculator

Stage: Viva
Time: 15 minutes
What you do: Answer the actual questions, interpret information, explain pathology and justify care

Stage: Post assessment
Time: 4 minutes
What you do: Put your name on all paper and leave it with the assessor before exiting

These timings come from the instructions you supplied. You were told that no indicative grade or immediate feedback will be provided; final results and individual feedback will be released through Canvas. Do not interpret an assessor's neutral expression or lack of feedback as evidence of your performance.

The Study Bible describes five separately assessed viva criteria. The supplied material does not state an overall pass rule or compensation rule, so do not assume that strength in four areas can offset a failure in the fifth. Aim to demonstrate all five on every mock. Practice labels and game results are learning feedback, not an official grade.

The five criteria translated into observable performance

Criterion: Interpretation
What a convincing response demonstrates: Identifies severity and decisive observations; ranks plausible differentials; supports a provisional diagnosis; interprets the ECG in context
What to avoid: Naming a disease without explaining the evidence; ignoring conflicting information

Criterion: Pathophysiology
What a convincing response demonstrates: Explains a causal mechanism and links it to this patient's observations, risks and comorbidities
What to avoid: A memorised definition with no clinical links; needing repeated prompts for basic mechanisms

Criterion: Integrated safe care
What a convincing response demonstrates: Sequences actions, gives patient-specific reasons, explains drug effects and safety, anticipates consequences and reassesses
What to avoid: A generic list of drugs; unsafe routes/doses; ignoring consent, dignity, culture, scope or deterioration

Criterion: Definitive care
What a convincing response demonstrates: States the next level of care, destination reasoning and relevant hospital treatment; explains the paramedic contribution
What to avoid: Ending at “transport to hospital” without explaining what the patient needs there

Criterion: Oral communication
What a convincing response demonstrates: Clear, logical, concise answers with accurate terms and explicit links between evidence and decisions
What to avoid: Rambling, unexplained jargon, abandoning a critical point or answering a different question

These are practice translations of the supplied rubric, not a new official marking scale. Anxiety does not prove poor competence: practise structure and recovery so nerves do not obscure what you know.`},{id:`five-minute-preparation`,title:`The five-minute preparation method and planning sheet`,source:`Study Bible`,text:`0:00–0:45 Read the questions first, then the case. Identify precisely what is requested. Note age/weight, chronology, immediate threats and any ECG. Do not spend all five minutes writing a complete essay.

0:45–1:45 Formulate. Write the leading diagnosis plus severity, three supporting findings and two dangerous alternatives. Circle missing or inconsistent information. Interpret the ECG systematically if supplied.

1:45–2:45 Build the mechanism. Write a causal chain with arrows in your own notes: initiating problem, physiological effect, findings, likely deterioration. Add how relevant comorbidities/medicines change the chain.

2:45–4:00 Sequence treatment and calculations. List immediate care, indicated medicines/procedures, contraindications and monitoring. Use the calculator for units, weight and volume. Mark consultation or advanced-scope requirements. State what you would verify if a needed fact is absent.

4:00–4:40 Plan definitive care. Identify required capability, referral/pre-notification and the treatments beyond paramedic care. Note practical barriers or cultural/communication needs.

4:40–5:00 Rehearse your opening and scan for omissions. Ask: “Have I addressed every question? Have I recognised the immediate threat? Have I made any dangerous assumptions?”

Reusable preparation sheet

Name and student number: __________________________________________

Questions I must answer: ___________________________________________

Working diagnosis and severity: _____________________________________

Three decisive findings: ____________________________________________

Dangerous alternatives and discriminating evidence: ____________________

Pathology chain and deterioration risk: ______________________________

First actions and reasons: __________________________________________

Drugs and calculation checks: _______________________________________

Contraindications and consequences: _________________________________

Reassessment and escalation: _______________________________________

Destination and definitive treatment: _________________________________`},{id:`viva-answer-structure`,title:`The fifteen-minute answer: opening, mechanisms and recovery`,source:`Study Bible`,text:`Use 2 minutes for interpretation, 5 for pathology, 5 for management/pharmacology and 3 for definitive care as a rehearsal budget. The official suggested ranges are 2–3, about 5, about 5 and 2–3 minutes. Follow the question set and assessor's prompts rather than forcing a monologue into rigid compartments. Communication is assessed throughout, not in a separate final minute.

Opening: “My provisional diagnosis is ___ with ___ severity, supported by ___. The immediate threat is ___. My important alternatives are ___, which I would distinguish using ___.”

Pathology bridge: “The initiating process is ___. This causes ___, which explains the patient's ___. Their ___ increases the risk of ___. If it progresses, I would expect ___.”

Management bridge: “I would first ___ because ___. In this patient I would use/withhold ___ because ___. Its mechanism is ___. I will assess response using ___; if that fails I will ___.”

Definitive care: “This patient needs ___ capability for ___. My role is to stabilise ___, reduce delay through ___ and hand over ___. Hospital care may include ___, depending on ___.”

If interrupted, answer the question directly, then reconnect: “That changes my fluid decision because… Returning to the next priority…”. If you make an error, correct it explicitly rather than defending it. If uncertain, distinguish what you know from what requires verification or consultation; do not invent a dose.`},{id:`completion-and-study-plan`,title:`Completion criteria, practice feedback and the eight-day plan`,source:`Study Bible`,text:`Mark a topic complete only after you can do all five tasks without reading:

1. Explain the pathology and link at least three findings to it.

2. Rank the provisional diagnosis and dangerous alternatives, with evidence that would change your mind.

3. Give a sequenced management plan with patient-specific medication safety and reassessment.

4. Explain destination and definitive care.

5. Handle a new observation or contraindication in a timed retest.

For OSCE readiness add an observed practical rehearsal with appropriate training equipment and feedback. Saying “I would ventilate” is not equivalent to demonstrating an effective seal and chest rise. Never use real drugs, needles, shocks or invasive procedures on a practice partner.

How to score practice

For each official viva criterion record independent, prompted, or not yet safe/accurate, with one example of evidence. These are learning labels, not official grades. Retest every prompted or unsafe domain. Assess each format using its own five official domains; supplementary practice scores do not replace either rubric.

Record the reason for an error: knowledge gap, failure to recognise a clue, wrong prioritisation, calculation, scope, or communication. Correct the mechanism, then test a different case. Rereading the same answer until it looks familiar is insufficient.

Eight day completion plan

Date: Sun 18 Oct
Main work: Baseline mock; observations/shock; sepsis, hypo and DKA
Evidence to finish with: One completed preparation sheet; corrected error list; explain all four shock mechanisms

Date: Mon 19 Oct
Main work: Respiratory and allergy; adult/child comparisons
Evidence to finish with: Two complete vivas, breathing-support rehearsal and drug explanations

Date: Tue 20 Oct
Main work: ACS, ECG, SVT and resuscitation
Evidence to finish with: ECG interpretation plus management; one cardiac viva; rhythm/action drills

Date: Wed 21 Oct
Main work: Stroke, seizures, toxicology and behavioural cases
Evidence to finish with: Two viva cases; glucose/drug calculations; uncertain-history drill

Date: Thu 22 Oct
Main work: Trauma, mixed shock and haemorrhage
Evidence to finish with: Trauma OSCE; medical versus traumatic arrest comparison; limb/pelvic checks

Date: Fri 23 Oct
Main work: Burns, drowning and postoperative/GI bleeding; catch-up
Evidence to finish with: One paediatric and one adult viva; remaining topic checks

Date: Sat 24 Oct
Main work: Full timed mock circuit and targeted repairs
Evidence to finish with: Three 5-minute-prep/15-minute vivas; practical drills; assessor evidence per criterion

Date: Sun 25 Oct
Main work: Retest remaining weak topics, then light review
Evidence to finish with: Two unfamiliar vivas meeting all five practice criteria; concise final error sheet

Each content day: two focused 50-minute blocks and a 25-minute timed viva/debrief; add practical work where equipment/partner are available. If time is limited, keep the timed attempt and correction cycle, and reduce passive reading. If the baseline exposes major gaps, move time from already strong topics. Do not try to compensate with an all-night session.

Exam mornings: brief recall of your opening, medication-unit checks and assessment structure. Confirm logistics and permitted materials. Between exams, make a short general learning note without sharing restricted assessment content, then rest and prepare for the next format.`},{id:`osce-rubric`,title:`Practical assessment: its separate five-domain rubric`,source:`Study Bible`,text:`The Study Bible reports that the supplied PAR321 Task 1D simulation rubric requires every criterion to be satisfactory, with safe, appropriate and sufficiently independent performance. It explicitly recognises that you are a developing clinician: passing does not require flawless expert performance. Minor errors may be acceptable when they do not compromise safety or the criteria; significant omissions, unsafe practice or frequent prompting are different. Borderline decisions go to the course coordinator. The viva and practical rubrics must be assessed separately.

No official OSCE station duration was supplied. The practical drills below are rehearsal exercises, not claims about the exam timetable.

What the assessor must be able to observe

Practical domain: Planning and responding to deterioration
Observable performance: Prioritise competing threats, explain the priorities, develop a differential and provisional diagnosis, request help with a reason
Rehearsal test: Your partner introduces a falling BP or declining consciousness. Reorder actions and explain why

Practical domain: Assessment of health status
Observable performance: Obtain pertinent history, observations, focused examination, pain assessment and reassessment; adapt to urgency
Rehearsal test: Explain what you assess now, what a crewmate can obtain, and what can safely wait

Practical domain: Comprehensive care
Observable performance: Apply precautions and perform indicated procedures and medicines safely and efficiently, with continuing care
Rehearsal test: Demonstrate the procedure on training equipment; check effectiveness and identify the next action

Practical domain: Open disclosure and professional communication
Observable performance: Give understandable explanations and options, support informed consent, respect patient preferences, communicate accurately and concisely
Rehearsal test: Explain one intervention to the patient, seek consent where possible, then give a structured clinical handover

Practical domain: Governance leadership and scene management
Observable performance: Adapt scene safety, manage team performance, allocate tasks with workload awareness and send timely structured notifications
Rehearsal test: Give a named task and reporting point, confirm completion, redistribute work when the team becomes overloaded

A complete examination performed inefficiently while urgent care is delayed does not satisfy the assessment domain. Merely watching teammates is not active team management. Saying “consent gained” without an appropriate explanation does not demonstrate patient-centred communication.`},{id:`osce-sequence-drills`,title:`Practical sequence, six equipment drills and observer feedback`,source:`Study Bible`,text:`Start with scene safety and precautions, introduce yourself, identify the patient where feasible and form a rapid impression. Immediately address the actual time-critical problem. Give a short reason aloud so the assessor can follow your prioritisation. Obtain consent when possible; if the patient cannot participate and care is urgent, explain the situation, act within applicable authority and document the basis for care.

Allocate tasks precisely: “Please assess breathing and attach oxygen monitoring, then report respiratory rate, effort and saturation.” Avoid giving one person several simultaneous tasks that prevent their completion. Ask for the result, acknowledge it and adapt your plan.

Use a focused history and examination to distinguish your working diagnosis from dangerous alternatives. Explain the patient's condition and proposed treatment in plain language, check understanding, respect privacy and ask about communication needs. Use an interpreter when needed and feasible; do not assume culture or preferences from appearance. Include family or a support person according to the patient's wishes and the clinical situation.

Before a medicine, check indication, patient, allergies, contraindications, authority, drug, concentration, dose, route and timing. Calculate the volume explicitly and obtain the required independent check. After administration, document and reassess the intended effect and adverse effects. If your knowledge is uncertain, consult the authorised reference rather than improvise.

After any change, reassess the patient, the intervention and the diagnosis. State what worked, what has not improved and what you will do next. Arrange destination, assistance and pre-notification early enough to affect care. Deliver a concise handover containing actual interventions and responses, not actions you intended but did not perform.

Six practical drills

Ventilation drill: on a manikin, demonstrate positioning, appropriate adjunct selection, mask seal, effective chest rise and reassessment. Have a partner introduce a leak or obstruction. Recognise and correct ineffective ventilation before proceeding with less urgent tasks. Explain why an oxygen reading cannot establish adequate ventilation.

Rhythm drill: assess the patient and pulse, identify the rhythm, state whether a shock is indicated, apply the relevant pathway and demonstrate safe team communication with training equipment. Change an organised rhythm from “pulse present” to “no pulse” and explain why management changes.

Medicine drill: choose one medicine from the case. Use the actual DTP to state its indication, dose, concentration, volume, route, repeat interval, maximum where relevant, contraindications and scope. Then explain its mechanism and the observation that would reveal an adverse effect. Use simulated equipment only.

Haemorrhage drill: on a simulator, select and demonstrate the indicated bleeding-control method, verify its effectiveness and reassess after movement. Assign another team member ongoing assessment so a dramatic wound does not conceal other injuries. Explain warmth, rapid definitive care and documentation.

Injury drill: demonstrate focused assessment and distal neurovascular documentation before and after the indicated splint or pelvic intervention. Explain what worsening pain, sensory loss, reduced perfusion or increasing shock would change. Follow the current CPP and equipment instructions during supervised skills practice.

Leadership drill: your partner deliberately gives an incomplete report or cannot complete an assigned task. Clarify the result, identify the barrier and redistribute work. Finish with a short destination notification and a patient explanation. Score the behaviour actually observed, not your intention.

Observer record for either assessment

Record the assessment type and case. For each of its five official domains write one observed strength, one omission, whether prompting was needed and the correction to practise. Use the learning labels independent, prompted or not yet safe and accurate. These labels are not an official university grade. Do not add the old station-bank learning score to the rubric marks.

If an error creates a safety problem, stop the simulation, explain and practise the correction, then repeat the case with a changed feature. A successful immediately repeated sequence is useful learning; confirm retention on a different day and a different presentation.`},{id:`source-corrections`,title:`Uploaded-file map, inconsistent observations and corrections`,source:`Study Bible`,text:`File map and corrections

Worked coverage in this guide: Mechanism and decision table for every card; corrections and calculation workshop

Correct these before memorising the material

1. Week 2 pre-engagement has four dispatch narratives but five answer rows. There is no supplied fifth dispatch to solve. Do not invent one and mistake it for course content.

2. CBL 7 GCS: E4 + V4 + M5 = 13, not the printed 14. Reassess actual responses rather than choosing whichever total fits the story. “Motor reduced due to pain” is not enough to determine a GCS motor score.

3. CBL 16: “unable to speak”, “P on AVPU” and GCS E3 V4 M5 do not describe an obviously consistent single examination. E3 denotes eye opening to sound, V4 confused conversation. Report the inconsistency and examine each component. Critical respiratory failure is clear regardless of the disputed total.

4. CBL 19 times: the stated 1040 tourniquet time precedes the 1045 event. Clarify whether 1045 is dispatch/assessment time or an error. Accurate application time matters; do not silently rewrite it.

5. CBL 18 ECG: the trace is labelled 112/min, whereas the observations say 132/min. They may reflect different moments; obtain the actual current rate and trend. Neither rate removes the shock diagnosis.

6. Burns case: HR is both reported as 150 and described as unobtainable. GCS 14 lacks components. State what was reliably measured and repeat what matters without unnecessarily distressing the child.

7. Drowning case: isolated “pedal oedema” does not establish pre-existing heart failure or cardiogenic pulmonary oedema. Verify it and interpret it in the full context.

8. ECG workshop: synthetic figures are useful for patterns, but some do not faithfully show the condition implied by the question. In particular, the sixth pre-engagement trace does not convincingly demonstrate AV dissociation. Do not force a complete-heart-block answer because the prompt asks about conduction.

9. VIRCA and ROLE: the worksheets use these terms without expanding them. Their course-specific meanings are not established by the supplied material or verified public QAS sources. This guide teaches the actual reasoning, consultation, reassessment and teamwork behaviours, but does not invent acronym definitions. Use your lecturer's definitions if separately supplied.

10. Drug flashcards: ceftriaxone card 6 says “suspected sepsis” too broadly; the reviewed QAS DTP specifies suspected meningococcal septicaemia with a non-blanching petechial/purpuric rash, alongside its separate upper-GI-bleeding indication. Card 20 similarly shortens ipratropium's indication too far: moderate bronchospasm unresponsive to initial QAS nebulised salbutamol, or severe bronchospasm; use with nebulised salbutamol. A drug summary is not the complete eligibility checklist.`},{id:`observations-physiology`,title:`Observations: oxygenation, ventilation, perfusion and age`,source:`Study Bible`,text:`Oxygenation ventilation and perfusion are different
