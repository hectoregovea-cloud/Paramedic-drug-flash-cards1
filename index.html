ilure and hypothermia.`},{id:`b`,label:`Water mainly remains in the stomach, so ventilation should wait until it is emptied.`,correct:!1,feedback:`Attempts to empty water delay effective ventilation and can cause harm. Frothy secretions require appropriate airway management, not delayed breathing support.`},{id:`c`,label:`Aspiration-related lung injury impairs gas exchange; hypoxia and cooling can depress cardiac function.`,correct:!0,feedback:`Aspiration and surfactant dysfunction can produce lung injury, while hypoxia affects brain and heart function. Hypothermia adds physiological slowing; this is not simply isolated bradycardia.`}]},destination:{id:`destination`,prompt:`Which capability is needed after immediate ventilation and any indicated resuscitation for this cold, critically unwell teenager?`,options:[{id:`a`,label:`Critical care able to support ventilation, manage rewarming and investigate the precipitating event.`,correct:!0,feedback:`Severe lung, neurological and circulatory compromise needs urgent hospital care. A seizure, dysrhythmia, intoxication or trauma may have preceded submersion and requires assessment.`},{id:`b`,label:`Rewarming alone, because temperature correction will establish that the respiratory injury has resolved.`,correct:!1,feedback:`Hypothermia is one contributor. Aspiration-related lung injury and inadequate ventilation require continued treatment and reassessment.`},{id:`c`,label:`Spinal imaging before respiratory stabilisation because every submersion establishes a spinal injury.`,correct:!1,feedback:`Assess the mechanism and apply indicated spinal precautions while supporting breathing. Water exposure alone does not establish spinal trauma.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 28. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices de owing and fresh haematemesis support significant bleeding risk. Visible cessation does not establish circulatory safety or remove the risk of recurrent bleeding into the airway.`},{id:`b`,label:`Vomited blood accounts for the entire loss, so no further assessment is needed once vomiting stops.`,correct:!1,feedback:`Children may swallow substantial blood. Vomit volume cannot establish total loss, and ongoing perfusion and airway assessment remain essential.`},{id:`c`,label:`Bleeding at seven days is expected wound drainage and cannot threaten circulation if the child is alert.`,correct:!1,feedback:`Alertness does not exclude serious postoperative haemorrhage. The tachycardia, pallor and bleeding history require urgent assessment.`}]},destination:{id:`destination`,prompt:`Which capability is required even if bleeding appears to stop and the parent asks to stay home?`,options:[{id:`a`,label:`Routine postoperative clinic review once the child tolerates an oral drink.`,correct:!1,feedback:`Keep nil by mouth and transport urgently. A drink does not test safety and could complicate airway risk or definitive treatment.`},{id:`b`,label:`Urgent hospital resuscitation and ENT assessment, with theatre haemostasis if required.`,correct:!0,feedback:`Post-tonsillectomy haemorrhage needs urgent definitive assessment even after apparent cessation. Continue airway/perfusion support and avoid direct out-of-hospital surgical-site manipulation.`},{id:`c`,label:`A general wound service that can inspect and manipulate the tonsillar bed before referral.`,correct:!1,feedback:`Do not improvise direct haemorrhage-control manipulation out of hospital. Definitive ENT care and resuscitation capability are the relevant needs.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 30. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Dest ly, and absent observations remain not supplied. Destination choices describe required capability or referral, not a named-hospital routing rule.`},"station-33":{speaker:`carer`,opening:`Please help; I will share the information I have.`,clues:[{id:`primary`,title:`Primary survey`,text:`Unresponsive with stridor and RR 60. HR 50; mottling and prolonged capillary refill. BP is not supplied.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`2 years old after two days of fever and cough. The cause of the upper-airway obstruction is not established.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`RR 60; HR 50; SpO2 89%. BP is not supplied.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`BGL 4.0.`,tool:`glucose`}],mechanism:{id:`mechanism`,prompt:`Which chain best explains stridor, severe respiratory compromise and bradycardia in this unresponsive two-year-old?`,options:[{id:`a`,label:`Airway narrowing increases work, fatigue impairs gas exchange, and myocardial hypoxia contributes to bradycardia.`,correct:!0,feedback:`The findings support a peri-arrest respiratory problem. Effective airway and ventilation support must begin while the cause of obstruction and age-specific resuscitation needs are assessed.`},{id:`b`,label:`Bradycardia establishes primary conduction disease, so airway narrowing is a secondary finding.`,correct:!1,feedback:`Hypoxia can cause paediatric bradycardia. The stridor, poor oxygenation and unresponsiveness demand immediate respiratory support.`},{id:`c`,label:`A high respiratory rate guarantees adequate ventilation, so the low pulse cannot be hypoxic.`,correct:!1,feedback:`Rate alone does not establish tidal volume or gas exchange. Severe work and fatigue can coexist with inadequate effective ventilation.`}]},destination:{id:`destination`,prompt:`After breathing ceases and no pulse is confidently identified, which specialist capability should be mobilised alongside age-specific resuscitation :`Urgent toxicology and paediatric critical-care support with authorised advanced treatment and airway capability.`,correct:!0,feedback:`Support ventilation, treat seizures through the authorised pathway and expedite appropriate paediatric care. Recognising sodium-channel toxicity does not itself establish independent authority for advanced treatment.`},{id:`c`,label:`Observation until an exact ingested amount or drug level is confirmed.`,correct:!1,feedback:`Serious neurological, cardiovascular and ECG findings already establish danger. History clarification must not delay treatment or referral.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 36. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices describe required capability or referral, not a named-hospital routing rule.`},"station-37":{speaker:`crewmate`,opening:`I am ready to take a specific assessment task.`,clues:[{id:`primary`,title:`Primary survey`,text:`Pulseless and apnoeic, with groin bleeding, chest and pelvic trauma, and poor left air entry.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`Ejected rider. Further preceding history is not supplied.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`Organised rhythm at 44; ETCO2 9 is recorded in the worked case. BP and SpO2 are not supplied.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`No glucose value is supplied in the source brief.`,tool:`glucose`}],mechanism:{id:`mechanism`,prompt:`Why can organised electrical activity at 44/min persist without a pulse after this major traumatic event?`,options:[{id:`a`,label:`An organised rhythm proves circulation, so an absent pulse is explained by a slow rate alone.`,correct:!1,feedback:`The patient is pulseless and apnoeic. Electrical activity does not establish effective ility or referral, not a named-hospital routing rule.`},"station-38":{speaker:`crewmate`,opening:`I will help verify the current findings.`,clues:[{id:`primary`,title:`Primary survey`,text:`Severe distress and reduced left air entry; RR 34. BP 78/54 with neck-vein distension. Consciousness score is not supplied.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`Chest stab. The source gives conflicting heart-rate figures, so the current rate needs measurement.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`BP 78/54; RR 34; SpO2 89%. Written HR 132 conflicts with the teaching ECG label of 112/min; preserve and clarify the discrepancy.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`No glucose value is supplied in the source brief.`,tool:`glucose`}],mechanism:{id:`mechanism`,prompt:`Why can this chest stab produce both obstructive and hypovolaemic shock?`,options:[{id:`a`,label:`Neck-vein distension proves tamponade and excludes important blood loss or pleural injury.`,correct:!1,feedback:`Neck-vein findings do not establish a single diagnosis. Obstructive and haemorrhagic mechanisms can coexist, and major blood loss can also obscure venous distension.`},{id:`b`,label:`Pleural air or pericardial blood can restrict filling, while internal bleeding removes circulating volume.`,correct:!0,feedback:`Tension pneumothorax, haemothorax, tamponade and vascular injury can coexist. Pleural blood may also compress the lung, so asymmetric entry and shock require a broad, urgent chest-trauma assessment.`},{id:`c`,label:`Reduced left entry establishes an isolated lung problem that cannot impair cardiac filling.`,correct:!1,feedback:`Pleural pressure can impair venous return, and penetrating trauma can also cause bleeding or pericardial restriction. Respiratory findings do not isolate the injury to ventilation alone.`}]},destination:{id:`destination`,prompt:`Which definitive-care capability should urgent referral seek for persistent shock after penetrating chest injury?`,options:[{id:`a`,label:`Observation after decompression without blood or surgical support if air entry is better.`,correct:!1,feedback:`Persistent shock is an unresolved threat. Improved entry does not remove the need for definitive assessment and haemorrhage-control capability.`},{id:`b`,label:`An isolated tamponade pathway based solely on neck-vein distension, without assessing pleural bleeding.`,correct:!1,feedback:`Tamponade is possible, but no single supplied sign establishes it. Multiple chest injuries and haemorrhage may coexist.`},{id:`c`,label:`Trauma resuscitation with chest drainage, blood products and surgical assessment as indicated.`,correct:!0,feedback:`Definitive evaluation may need imaging or ultrasound and treatment of pleural or pericardial injury and haemorrhage. Continue support and reassessment while expediting trauma care.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 38. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices describe required capability or referral, not a named-hospital routing rule.`},"station-39":{speaker:`crewmate`,opening:`I will help check the details and keep them accurate.`,clues:[{id:`primary`,title:`Primary survey`,text:`Confused with ongoing bleeding despite an improvised tourniquet. HR 138, BP 84/52 and CRT 5 seconds. Breathing findings are not supplied.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`The stated 1040 tourniquet time precedes the 1045 event. Clarify whether 1045 means dispatch or assessment time, or is an error; do not rewrite it.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`HR 138; BP 84/52; SpO2 98%; CRT 5 seconds. RR is not supplied.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`No glucose value is supplied in the source brief.`,tool:`glucose`}],mechanism:{id:`mechanism`,prompt:`Why is preventing heat loss important while this amputee continues to bleed despite an improvised tourniquet?`,options:[{id:`a`,label:`Hypothermia can worsen coagulopathy and bleeding, compounding the loss of preload and oxygen delivery.`,correct:!0,feedback:`Warmth supports resuscitation but cannot replace effective haemorrhage control. Acidosis and coagulopathy can worsen the bleeding cycle, even while saturation remains high.`},{id:`b`,label:`Cooling reliably seals injured vessels through vasoconstriction and therefore improves definitive haemostasis.`,correct:!1,feedback:`Cold may produce vasoconstriction but also worsens coagulopathy and physiological stress. Prevent heat loss while making mechanical control effective.`},{id:`c`,label:`Normal saturation means bleeding no longer affects oxygen delivery, leaving temperature as the sole threat.`,correct:!1,feedback:`SpO2 does not measure haemoglobin quantity or output. Ongoing bleeding, poor filling and hypothermia are concurrent threats.`}]},destination:{id:`destination`,prompt:`Which capability takes priority when planning definitive care for the shocked amputee and the recovered limb part?`,options:[{id:`a`,label:`A replantation guarantee before transport, even if obtaining the part delays treatment of shock.`,correct:!1,feedback:`Replantation cannot be promised from the case. Patient resuscitation takes priority over unsafe retrieval or delays.`},{id:`b`,label:`Resuscitation and surgical haemostasis, with specialist assessment of any replantation option after patient priorities.`,correct:!0,feedback:`Effective control, accurate tourniquet documentation and prompt resuscitation/transport come first. Protect the part from contamination and direct freezing; replantation suitability is a specialist decision.`},{id:`c`,label:`Limb-part preservation alone once a tourniquet is present, without checking whether bleeding has stopped.`,correct:!1,feedback:`The improvised device has not achieved haemostasis. Reassess and correct control immediately; packaging the part does not treat shock.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 39. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices describe required capability or referral, not a named-hospital routing rule.`},"station-40":{speaker:`crewmate`,opening:`I can help collect the history and ECG details.`,clues:[{id:`primary`,title:`Primary survey`,text:`Sudden dyspnoea, sweating, crackles, vomiting and near-syncope. RR 28; BP 94/62 and HR 112. GCS is not supplied.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`73 years old with diabetes; no chest pain reported in this presentation.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`BP 94/62; HR 112; RR 28; SpO2 93%. ECG: V1–V3 horizontal depression and tall R waves.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`BGL 10.8.`,tool:`glucose`}],mechanism:{id:`mechanism`,prompt:`Why do V1–V3 horizontal depression and tall R waves prompt posterior leads in this unwell patient without chest pain?`,options:[{id:`a`,label:`The pattern establishes a primary pulmonary disorder, so posterior leads mainly exclude hypoxaemia.`,correct:!1,feedback:`The described distribution can be reciprocal evidence of posterior coronary injury. Respiratory alternatives remain relevant but do not replace posterior assessment.`},{id:`b`,label:`Absent pain makes the ECG changes chronic until biomarkers prove an infarction.`,correct:!1,feedback:`Myocardial infarction can present without pain, especially in this context. Dyspnoea, near-syncope, low BP and crackles require urgent evaluation.`},{id:`c`,label:`Anterior leads can show the reciprocal electrical view of posterior myocardial injury.`,correct:!0,feedback:`Posterior injury can appear as anterior ST depression and tall R waves; V7–V9 provide a more direct view. Interpret the pattern with the clinical state and serial ECGs, since depression alone is not specific.`}]},destination:{id:`destination`,prompt:`V7–V9 elevation appears and crackles worsen. Which referral capability is needed?`,options:[{id:`a`,label:`Urgent reperfusion assessment with cardiac and respiratory support for possible pump failure.`,correct:!0,feedback:`Transmit and repeat ECGs and pursue the current reperfusion referral, with full contraindication screening and confirmed advice. Low BP and crackles require careful haemodynamic and respiratory management.`},{id:`b`,label:`Routine biomarker review before contacting reperfusion services because chest pain is absent.`,correct:!1,feedback:`The posterior findings and compromised physiology require prompt referral; waiting for pain or biomarkers can delay time-critical care.`},{id:`c`,label:`Respiratory treatment alone because crackles establish a non-coronary explanation for the dyspnoea.`,correct:!1,feedback:`Crackles can accompany acute ventricular dysfunction due to infarction. They do not remove the need for urgent reperfusion assessment.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 40. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices describe required capability or referral, not a named-hospital routing rule.`},"station-41":{speaker:`patient`,opening:`Please help me understand the assessment.`,clues:[{id:`primary`,title:`Primary survey`,text:`Sudden left-arm numbness is reported. Consciousness, breathing and perfusion observations are not supplied in the initial brief.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`Elderly patient with sudden left-arm numbness. This is an invented training variant of an incomplete original dispatch.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`No numerical observations or ECG are supplied in the initial brief.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`No glucose value is supplied in the source brief.`,tool:`glucose`}],mechanism:{id:`mechanism`,prompt:`Why assess glucose as well as onset and neurological pattern in this sudden arm-numbness presentation?`,options:[{id:`a`,label:`Sudden focal symptoms exclude a metabolic cause, so glucose testing would not change the assessment.`,correct:!1,feedback:`Hypoglycaemia can produce focal as well as global dysfunction. Glucose assessment is part of evaluating a possible stroke presentation.`},{id:`b`,label:`Glucose deprivation can impair neuronal function and mimic stroke, while focal blood-flow interruption remains possible.`,correct:!0,feedback:`Both hypoglycaemia and stroke can cause neurological dysfunction, and they can coexist. Measure glucose, establish last-known-well and examine the pattern; no glucose result or stroke type is supplied in the initial brief.`},{id:`c`,label:`Arm numbness alone reliably distinguishes ischaemic from haemorrhagic stroke.`,correct:!1,feedback:`Clinical deficits cannot reliably separate stroke types. Obtain a full assessment and preserve the timeline for specialist investigation.`}]},destination:{id:`destination`,prompt:`Which pathway is needed when focal weakness persists after safe glucose correction?`,options:[{id:`a`,label:`Hypoglycaemia follow-up alone because a reversible cause was identified.`,correct:!1,feedback:`The remaining focal deficit needs time-critical stroke assessment even though hypoglycaemia also required treatment.`},{id:`b`,label:`Routine aspirin treatment at home because persistent unilateral weakness confirms an ischaemic cause.`,correct:!1,feedback:`Field examination cannot establish an ischaemic rather than haemorrhagic stroke. Do not give empirical aspirin; arrange urgent assessment through the relevant pathway.`},{id:`c`,label:`Urgent stroke referral and imaging capability, preserving last-known-well and following the current stroke/LVO pathway.`,correct:!0,feedback:`Imaging and specialist assessment determine stroke type and treatment eligibility. Document the original timeline, baseline function and anticoagulant history; correction does not reset onset.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 41. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices describe required capability or referral, not a named-hospital routing rule.`},"station-42":{speaker:`crewmate`,opening:`I am here to help you assess what has happened.`,clues:[{id:`primary`,title:`Primary survey`,text:`Unconscious but breathing after a fall. Breathing adequacy and perfusion observations are not supplied.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`20 years old after a fall. The witnessed sequence and exact mechanism are not supplied; this is an invented training dispatch variant.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`No numerical observations, GCS components or ECG are supplied in the initial brief.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`No glucose value is supplied in the source brief.`,tool:`glucose`}],mechanism:{id:`mechanism`,prompt:`Why assess effective ventilation and perfusion when this unconscious patient is still breathing after a fall?`,options:[{id:`a`,label:`Breathing alone does not establish oxygen delivery; impaired gas exchange or perfusion can worsen secondary brain injury.`,correct:!0,feedback:`Protect the airway and assess ventilation, oxygenation and circulation while investigating both trauma and a possible medical collapse. The supplied brief does not establish why the patient fell.`},{id:`b`,label:`Spontaneous breathing establishes adequate brain oxygen delivery, so airway and perfusion checks can wait.`,correct:!1,feedback:`The presence of breaths does not establish adequate tidal volume, airway protection or cerebral perfusion. Unconsciousness requires immediate assessment and support.`},{id:`c`,label:`The fall establishes primary brain trauma, making a medical cause of unconsciousness irrelevant.`,correct:!1,feedback:`Medical collapse can cause secondary trauma. The event sequence and physiological assessment are needed before assigning a cause.`}]},destination:{id:`destination`,prompt:`Which capability is needed when this patient remains unconscious after a seizure preceding the fall?`,options:[{id:`a`,label:`Routine epilepsy follow-up after waiting for a fixed postictal recovery period.`,correct:!1,feedback:`Persistent coma and an uncertain injury mechanism require urgent assessment. Do not delay care by assuming a benign recovery period.`},{id:`b`,label:`Urgent hospital airway and neurological assessment, with imaging and seizure/toxicology or trauma input as indicated.`,correct:!0,feedback:`Continue immediate support and serial assessment. Definitive investigation may need brain imaging, seizure evaluation and assessment of poisoning or associated trauma; the cause is not established by the witness label.`},{id:`c`,label:`Isolated fracture assessment because the fall is the only event requiring hospital investigation.`,correct:!1,feedback:`There is no supplied isolated fracture diagnosis. Unconsciousness after a seizure and fall requires medical and trauma assessment.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 42. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices describe required capability or referral, not a na  and new confusion are established?`,options:[{id:`a`,label:`Urgent medical assessment and monitoring, with infection/toxicology investigation and appropriate mental-health input.`,correct:!0,feedback:`Treat physiological threats and obtain relevant consultation using the least restrictive effective approach. If sedation becomes indicated, it needs authorised scope and appropriate monitoring.`},{id:`b`,label:`Mental-health assessment alone before any medical observations are interpreted.`,correct:!1,feedback:`New physiological red flags require medical assessment and treatment. A mental-health request cannot replace evaluation for delirium, poisoning or other illness.`},{id:`c`,label:`Police-directed restraint and transport without further capacity or respiratory assessment.`,correct:!1,feedback:`Police involvement does not itself authorise a restrictive intervention. Capacity, medical threats and any sedation-related respiratory risk require clinical assessment.`}]},sourceNote:`Adapted from the supplied Study Bible and practice bank, station 43. Opening dialogue is fictional. Investigation labels and reasoning checks simplify source wording; clues contain initial-brief findings only, and absent observations remain not supplied. Destination choices describe required capability or referral, not a named-hospital routing rule.`},"station-44":{speaker:`patient`,opening:`Please talk me through what happens next.`,clues:[{id:`primary`,title:`Primary survey`,text:`Nausea and a reported colour change; the colour is not defined. Consciousness, breathing and perfusion observations are not supplied.`,tool:`assessment`},{id:`history`,title:`Focused history`,text:`55 years old; nausea at 03:00 with a reported colour change. This is an invented training dispatch variant.`,tool:`interview`},{id:`monitor`,title:`Monitor and observations`,text:`No numerical observations or ECG are supplied in the initial brief.`,tool:`monitor`},{id:`glucose`,title:`Glucose and metabolism`,text:`No g
