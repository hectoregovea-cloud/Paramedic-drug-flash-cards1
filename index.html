In DKA insufficient insulin and increased counter-regulatory hormones promote fat breakdown and ketone production. Ketones contribute to metabolic acidosis. Hyperglycaemia causes osmotic diuresis, losing water and electrolytes; vomiting worsens depletion. Deep rapid breathing helps lower CO2 as compensation for metabolic acidosis. It is not automatically asthma or anxiety.

Potassium deserves a clear explanation: substantial total-body depletion may exist despite a normal or elevated measured serum potassium, because distribution between cells and blood changes. Insulin and correction of acidosis can move potassium into cells and reveal dangerous depletion. This is one reason definitive management requires serial biochemical monitoring rather than a simplistic “high glucose, give insulin” response.

HHS typically features marked hyperglycaemia, hyperosmolality and dehydration with less prominent ketogenesis/acidosis; overlap occurs. Do not diagnose either from glucose alone. Assess glucose, ketones if available, hydration/perfusion, mental state, ECG and triggers such as infection or missed insulin. Support ABCs and provide reassessed fluids within scope, recognising paediatric and comorbidity considerations. Do not assume independent ACP2 insulin authority. Hospital care includes controlled fluids, insulin, potassium/electrolyte management and treatment of the precipitant. QAS hyperglycaemia.
Source links: QAS hyperglycaemia: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219046/CPG_Diabetic-emergency_hyperglycaemia.pdf

Apply: deep breaths, thirst, vomiting and high glucose, with clear air entry. Answer: consider metabolic acidosis and dehydration. Explain why suppressing the respiratory compensation or treating the rate as bronchospasm would be inappropriate without additional evidence.`},{id:`pe-seizures-toxicology`,title:`Pulmonary embolism, seizures, opioids, GHB and cannabis`,source:`Study Bible`,text:`A pulmonary embolus obstructs pulmonary blood flow. Ventilated but underperfused lung increases wasted ventilation, while other gas-exchange abnormalities can produce hypoxaemia. Large or physiologically significant obstruction increases RV afterload; the RV can dilate/fail, reducing LV filling and causing obstructive shock. Severity is determined by clinical impact, not pain intensity.

Risk clues include prior venous thrombosis, recent immobility/surgery, cancer and relevant hormonal or pregnancy history. Symptoms can include sudden dyspnoea, pleuritic pain, syncope or haemoptysis, but no single symptom is required. Normal saturation, a normal-looking ECG or absence of leg symptoms does not exclude PE. Consider ACS, pneumothorax, pneumonia and aortic pathology.

Prehospital care supports oxygenation/ventilation and perfusion, limits exertion and expedites appropriate assessment. Large indiscriminate fluid loads can worsen a failing right ventricle; follow the QAS approach and seek support for shock. Definitive care may include imaging, anticoagulation and selected reperfusion procedures. Do not assume a suspected PE authorises a field thrombolytic regimen. QAS PE.
Source links: QAS PE: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0016/219103/cpg_pulmonary-embolus.pdf

Apply: collapse, hypotension and dyspnoea after recent surgery. Answer: PE becomes a high-risk possibility, but assess other shock causes concurrently. State what evidence supports it and what cannot be confirmed prehospital.

Seizures and status epilepticus

A seizure reflects abnormal synchronous neuronal activity. Causes include epilepsy, hypoglycaemia, hypoxia, toxins, infection, stroke and intracranial injury. Sustained convulsions increase metabolic demand, threaten oxygenation and can worsen acidosis/hyperthermia. Time the event and establish whether consciousness returned between episodes; the QAS seizure CPG describes status as prolonged seizure activity beyond five minutes or repeated seizures without full recovery.

Protect the patient from injury, assess airway/breathing and glucose, and use authorised anticonvulsant treatment when indicated. Do not restrain convulsing limbs or put objects in the mouth. Midazolam enhances inhibitory GABA-A activity, but also increases respiratory-depression risk, particularly with other depressants. Count doses already given by carers or clinicians and choose the authorised route rather than delaying treatment for a difficult IV.

After convulsions stop, reassess ventilation, glucose, injuries and recovery. Persistent reduced consciousness may be postictal, but continuing non-convulsive seizure, toxicity, hypoxia or intracranial pathology remain possible. Hospital care investigates the cause and may involve further antiseizure medicines, imaging, EEG or airway support. QAS seizures.
Source links: QAS seizures: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219059/cpg_seizure.pdf

Apply: the jerking stops after medication but RR becomes six and shallow. Answer: immediately support ventilation and reassess airway/perfusion; seizure cessation is only one component of successful care.

Opioid GHB and cannabis presentations

Opioids: mu-receptor effects can depress ventilatory drive and consciousness. Pinpoint pupils support but do not prove the toxidrome. Identify slow/shallow breathing, not merely sleepiness. Provide effective airway/ventilation support and indicated naloxone, monitor recurrence and ask about co-ingestants. The opioid may outlast reversal. Sudden awakening does not establish safe discharge. QAS opioids.
Source links: QAS opioids: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219127/cpg_opioids.pdf

GHB: can produce profound fluctuating unconsciousness, respiratory depression and bradycardia; myoclonic movements need not be epileptic seizures. Support breathing, prevent aspiration, assess trauma and co-ingestion and monitor the changing state. Naloxone does not reverse GHB itself, although suspected concomitant opioid effects are a separate consideration. Do not rely on the possibility of rapid spontaneous awakening to justify inadequate support. QAS GHB.
Source links: QAS GHB: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219125/cpg_gamma-hydroxybutyrate.pdf

Cannabis-related illness: altered perception, anxiety, tachycardia and impaired coordination can occur, but the label must not explain away collapse, chest pain, severe confusion or a child's exposure. Ask about edible products, time/dose, other substances and possible synthetic cannabinoids; uncertainty about contents changes risk. Use a calm setting and supportive assessment, investigate other causes and follow the poisoning framework. A dedicated QAS cannabis CPG was not identified in the reviewed index. QAS poisoned-patient approach.
Source links: QAS poisoned-patient approach: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219114/cpg_approach-to-the-poisoned-patient.pdf

Apply: a friend says “just marijuana” while the patient is apnoeic. Answer: treat the breathing emergency and investigate co-ingestion/other causes. A witness's label does not override physiology.`},{id:`injury-bleeding-fluids`,title:`Fractures, pneumothorax, bleeding and fluid decisions`,source:`Study Bible`,text:`A fracture causes pain and tissue injury; large bones and associated vessels can contribute significant blood loss. Open injury introduces contamination. A pulse, sensation and movement assessment before and after immobilisation helps detect pre-existing injury or a complication of treatment. Pain out of proportion, passive-stretch pain, tense swelling or progressive neurological change raises concern for compartment syndrome; a palpable pulse does not exclude it.

Assess the whole patient and mechanism before focusing exclusively on the limb. Control bleeding, cover an open wound appropriately, provide analgesia and immobilise using authorised procedures. Do not assume every femoral injury is suitable for traction; consider pelvic injury and device contraindications. Reassess after movement and escalate a threatened limb. Antibiotics follow the specific open-long-bone indication, not every closed fracture. Definitive care may require imaging, reduction/fixation, debridement, vascular repair or fasciotomy. QAS extremity injury.
Source links: QAS extremity injury: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/308752/CPG_Extremity-injury.pdf

Apply: sensation worsens after splinting. Answer: immediately reassess fit, alignment and circulation and correct an iatrogenic problem within the procedure. Record the change and expedite appropriate care.

Simple and tension pneumothorax

Pleural air disrupts the pressure relationship that normally keeps the lung expanded. A pneumothorax can impair ventilation without tension physiology. When intrapleural pressure progressively compromises venous return and cardiac output, the problem becomes obstructive shock as well as a respiratory emergency. Positive-pressure ventilation may accelerate deterioration.

Assess mechanism, pain, asymmetric entry, respiratory distress and circulation; do not wait for every textbook sign. Tracheal deviation is not a prerequisite. A stable patient with possible pneumothorax does not automatically require decompression, whereas a severely compromised patient with tension physiology requires urgent authorised treatment. Traumatic arrest has its separate decompression considerations. Reassess after intervention; ineffective treatment and other injuries are both possible. Definitive care can include imaging and chest drainage. QAS chest injuries.
Source links: QAS chest injuries: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219134/cpg_chest-injuries.pdf

Apply: unilateral reduced entry with stable perfusion becomes hypotension during assisted ventilation. Answer: reassess urgently for tension and other causes of deterioration, and act within the applicable procedure/scope; do not continue unchanged because the first examination was stable.

Post tonsillectomy and gastrointestinal haemorrhage

Post-tonsillectomy bleeding: visible blood may underestimate loss because it is swallowed. Frequent swallowing, vomiting blood, pallor, tachycardia or changed behaviour can be clues. A small or ceased bleed can precede a larger event. Prioritise airway/perfusion, minimise distress, keep nil by mouth and arrange urgent transport even if bleeding stops. Use positioning appropriate to airway/circulation, suction as needed and eligible TXA; do not improvise direct manipulation of the surgical site. Definitive care may require ENT theatre management and resuscitation. QAS post-tonsillectomy haemorrhage.
Source links: QAS post-tonsillectomy haemorrhage: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0028/308755/CPG_Post-tonsillectomy-haemorrhage.pdf

Upper GI bleeding: ulceration and varices have different underlying mechanisms but can both threaten airway and circulation. Portal hypertension contributes to varices; rupture can cause substantial haemorrhage. Ask about liver disease, alcohol, NSAIDs, anticoagulants, previous bleeds and stool/vomit appearance. Colour alone does not quantify rate or severity. Support airway/perfusion and expedite hospital haemostasis; endoscopy and blood products may be needed. Check the exact ceftriaxone indication; do not generalise it to all GI bleeds or give routine TXA merely because bleeding exists. QAS upper GI bleeding.
Source links: QAS upper GI bleeding: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0023/308741/CPG_Upper-gastrointestinal-bleeding.pdf

Apply: a child is pale after postoperative bleeding that has stopped. Answer: stopped visible bleeding does not prove safety; assess occult loss and airway risk and transport urgently.

Fluid decisions across conditions

Ask five questions: Is perfusion inadequate? What mechanism explains it? Will fluid plausibly improve it? What harm is possible? What will I reassess before more? Always distinguish adult/child authority and any approval requirement.

In non-haemorrhagic volume loss, replacing circulating volume can improve preload. In sepsis, fluid may help a depleted circulation but may not correct vasodilation or myocardial dysfunction. In cardiogenic failure, extra volume can worsen congestion; RV infarction still needs careful reassessment rather than an automatic large load. In PE/tension/tamponade, definitive relief of obstruction matters. In haemorrhage, controlling loss and appropriate blood/volume strategy matter; crystalloid cannot replace oxygen-carrying capacity or clotting factors. Traumatic arrest is not managed by simply borrowing a non-arrest permissive-hypotension strategy. In combined TBI/bleeding, cerebral perfusion changes the decision.

Apply: BP rises slightly after fluid but breathing worsens and new crackles appear. Answer: stop and reassess further fluid, diagnostic assumptions and respiratory support needs. An isolated BP improvement does not justify continuing a harmful intervention. Use the condition-specific CPG and sodium chloride DTP.
Source links: sodium chloride DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219374/dtp_sodium-chloride-09.pdf`},{id:`cardiac-station-reference`,title:`Cardiac station reference: stations 1–7`,source:`Study Bible`,text:`Hide titles and answer material during testing. These are invented training scenarios unless identified as uploaded case facts.

Cardiac stations

1 STEMI with right ventricular involvement

Brief: A 59-year-old has 45 minutes of central pressure radiating to the jaw, nausea and diaphoresis. HR 44, BP 82/54, RR 24, SpO2 96% room air, GCS 15. Lungs are clear. ECG has inferior ST elevation, reciprocal changes and V4R elevation.

Viva: Explain coronary occlusion and reduced RV output. Why can bradycardia worsen perfusion? What makes GTN unsuitable here? How do antiplatelets differ from anticoagulants and fibrinolytics?

Change: BP falls to 70/42 and consciousness declines. How do escalation and transport priorities change?

Checkpoints: Recognise unstable infarction; obtain/transmit ECGs, request appropriate support and activate the reperfusion pathway. Withhold GTN for the actual BP and HR contraindications. Consider cautious fluid only after evaluating congestion; monitor for dysrhythmia. Explain PCI as definitive reperfusion and follow the accepted pathway for adjunct drugs.

Sources: ACS CPG, reperfusion CPP.
Source links: ACS CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219019/CPG_Acute-coronary-syndrome.pdf; reperfusion CPP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/308765/CPP_Pre-hospital-cardiac-reperfusion.pdf

2 ACS without diagnostic ST elevation

Brief: A 67-year-old with diabetes has chest pressure, breathlessness and vomiting. HR 104, BP 146/88, RR 22, SpO2 95%, BGL 11.2, GCS 15. Initial ECG shows lateral ST depression.

Viva: What distinguishes ACS, NSTEMI and unstable angina? What cannot be established without troponin testing? Compare dissection and PE. Why repeat ECGs when pain changes?

Change: Pain eases but hypotension develops. Is the patient necessarily improving?

Checkpoints: Treat suspected ACS and assess medication suitability; do not diagnose NSTEMI solely from ST depression. Monitor for dynamic changes and consider posterior leads when the pattern warrants them. Relief of pain does not establish reperfusion. Reassess perfusion, rhythm and alternative diagnoses.

Source: ACS CPG linked above.

3 Ventricular fibrillation arrest

Brief: A 56-year-old collapses, is unresponsive, has agonal breaths and no confidently palpable central pulse. VF is identified on the defibrillator.

Viva: Why does VF produce no effective output? Why do compression quality and prompt defibrillation matter? Explain the roles of amiodarone and adrenaline.

Change: VF persists through three shocks; later an organised rhythm appears.

Checkpoints: High-quality CPR, early defibrillation, airway/ventilation, rhythm cycles and reversible causes. Follow current QAS sequencing after the third shock, with amiodarone prioritised. Determine whether organised activity represents ROSC or PEA; transition to post-ROSC care when circulation returns.

Source for stations 3–6: Adult non-traumatic resuscitation CPG.
Source links: Adult non-traumatic resuscitation CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf

4 Pulseless ventricular tachycardia

Brief: A 62-year-old collapses. The monitor shows regular broad-complex tachycardia at 220/min; no pulse is confidently felt.

Viva: How does pulse status change the pathway? Explain unsynchronised defibrillation versus synchronised cardioversion.

Change: Following treatment, a pulse returns but BP is 72/40 and broad-complex tachycardia persists.

Checkpoints: Treat initial pulseless VT as a shockable arrest. Reclassify after ROSC; a perfusing but unstable tachyarrhythmia requires a different approach and urgent appropriate support. Do not continue arrest treatment purely because the rhythm still looks similar.

5 Pulseless electrical activity

Brief: A 45-year-old with preceding dyspnoea collapses. Organised narrow complexes at 60/min are present, but there is no pulse. Recent surgery is disclosed.

Viva: Why is PEA a clinical diagnosis? Explain possible hypoxia, hypovolaemia and pulmonary obstruction. Why is this rhythm not shocked?

Change: A later rhythm check shows VF.

Checkpoints: CPR, ventilation, early adrenaline in the non-shockable pathway and reversible-cause work. Consider PE from the history without treating it as confirmed. Switch pathways if the rhythm becomes shockable. A monitor tracing alone cannot establish circulation.

6 Asystole

Brief: An adult is found unresponsive with no normal breathing or pulse. The monitor appears flat; an electrode is partly detached.

Viva: How do you check that this is true asystole? What makes treatment futile, and who/what governs discontinuation?

Change: A witness reports cold-water exposure before collapse.

Checkpoints: Correct equipment problems promptly while avoiding CPR delays. Confirm the rhythm appropriately and use the non-shockable pathway. Address reversible causes. Do not shock confirmed asystole or make a termination decision from the rhythm or elapsed time alone; apply current criteria and consultation requirements.

7 SVT with deterioration

Brief: A 28-year-old reports abrupt palpitations. HR 190 regular, narrow QRS, BP 118/76, RR 20, SpO2 98%, GCS 15; no chest pain.

Viva: Explain re-entry and how vagal stimulation may interrupt an AV-node-dependent circuit. Compare sinus tachycardia, flutter and AF. What contraindicates modified Valsalva?

Change: BP falls to 78/46 with confusion and chest pain.

Checkpoints: Obtain ECG and determine stability. Modified Valsalva is appropriate only while eligible and stable. On deterioration, stop repeated vagal attempts and seek urgent synchronised-cardioversion capability through the applicable scope/escalation pathway. Do not import an adenosine regimen from another service.

Sources: Cardiac arrhythmias via QAS index, modified Valsalva CPP.
Source links: Cardiac arrhythmias via QAS index: https://www.ambulance.qld.gov.au/clinical/cpm; modified Valsalva CPP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0016/219220/cpp_modified-valsalva-manoeuvre.pdf`},{id:`neuro-respiratory-station-reference`,title:`Neurological and respiratory station reference: stations 8–14`,source:`Study Bible`,text:`8 Stroke

Brief: A 74-year-old has new aphasia and right-sided weakness. Last known well was 50 minutes ago. BP 188/102, HR 92 irregular, RR 18, SpO2 96%, BGL 6.4. They usually live independently and take apixaban.

Viva: Explain ischaemic versus haemorrhagic stroke, penumbra and common mimics. Why are last-known-well, premorbid function and anticoagulants important?

Change: Family reveals symptoms were actually present on waking; last known well was the previous evening.

Checkpoints: Primary survey, glucose, focused neurological examination, NIHSS-8 and premorbid mRS; appropriate referral/destination and prenotification. Do not exclude treatment solely because onset is uncertain; specialist imaging selection matters. Imaging is needed to distinguish stroke types. Manage swallowing risk; do not give empirical aspirin or lower BP simply to normalise the number.

Source: Stroke and TIA CPG.
Source links: Stroke and TIA CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219060/CPG_Stroke-and-Transient-ischaemic-attack.pdf

9 COPD exacerbation

Brief: A 71-year-old with COPD has increased dyspnoea and sputum. HR 112, BP 138/78, RR 30, SpO2 84% room air, GCS 15. Wheeze and prolonged expiration are present.

Viva: Explain airflow limitation, air trapping and V/Q mismatch. Why is controlled oxygen appropriate? Compare pneumonia, PE and cardiac failure.

Change: SpO2 reaches 90%, but the patient becomes drowsy with shallow breathing.

Checkpoints: Target oxygen appropriately, give indicated bronchodilators/steroid and minimise exertion. The saturation alone does not establish adequate ventilation. Escalate ventilatory support for failure; do not dismiss drowsiness because the target saturation has been reached.

Source: COPD CPG.
Source links: COPD CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0028/219097/cpg_chronic-obstructive-pulmonary-disease.pdf

10 Croup

Brief: A 3-year-old, 15 kg, has barking cough, hoarseness and stridor at rest after two days of coryza. HR 160, RR 42, SpO2 91%, temperature 38.0 C. Handling worsens distress.

Viva: Explain subglottic swelling. Contrast epiglottitis, foreign body and anaphylaxis. Explain nebulised adrenaline versus corticosteroid effects.

Change: Stridor becomes quieter, but air entry and consciousness worsen.

Checkpoints: Preserve comfort with caregiver, minimise distress, assess Westley score and treat severity. Reduced sound may reflect reduced airflow. Prepare support for obstruction/failure, request help and transport. Avoid forcing a throat examination or assuming quieter breathing means recovery.

Source: Croup CPG.
Source links: Croup CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/219098/CPG_Croup.pdf

11 Acute cardiogenic pulmonary oedema

Brief: A 76-year-old with heart failure develops abrupt orthopnoea and pink frothy sputum. BP 204/112, HR 122, RR 36, SpO2 80%; widespread crackles, GCS 15.

Viva: Explain raised pulmonary hydrostatic pressure, reduced compliance and impaired gas exchange. What do GTN and CPAP change physiologically?

Change: During treatment BP falls to 86/54 and the patient becomes drowsy.

Checkpoints: Position, oxygen/ventilatory support and haemodynamically appropriate therapies; investigate ACS/arrhythmia triggers. Reassess suitability of nitrates and non-invasive support when perfusion/consciousness changes. Recognise possible cardiogenic shock and obtain advanced support.

Source for stations 11–12: APO CPG.
Source links: APO CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219095/cpg_acute-pulmonary-oedema.pdf

12 Acute pulmonary oedema of noncardiogenic origin

Brief: A 30-year-old develops hypoxia and bilateral crackles after submersion. HR 118, BP 104/66, RR 32, SpO2 85%, GCS 14; no heart-failure history.

Viva: Contrast permeability/lung injury with hydrostatic oedema. Why does frothy sputum not prove LV failure?

Change: RR falls to 8 with reduced responsiveness.

Checkpoints: Respiratory support and underlying-cause management. Inadequate breathing needs effective ventilation. Do not automatically reproduce the hypertensive cardiogenic-oedema medication plan. APO describes the syndrome; ACPO identifies a cardiogenic cause.

13 Asthma progressing to respiratory failure

Brief: An 8-year-old, 27 kg, with asthma has persistent distress despite reliever use. HR 150, RR 38, BP 104/66, SpO2 88%, short words and widespread wheeze.

Viva: Explain smooth-muscle constriction, mucosal inflammation and mucus. Why do inhaled drugs become difficult to deliver in severe obstruction?

Change: RR becomes 12 and shallow, wheeze disappears, air entry is minimal and consciousness falls.

Checkpoints: Recognise life-threatening deterioration. Bronchodilator and indicated IM adrenaline treatment, oxygen, ventilatory assistance when inadequate, early support and transport. Avoid excessive ventilation and allow expiration. Corticosteroids are adjuncts, not immediate rescue; magnesium for asthma requires CCP capability under the published regimen.

Source: Asthma CPG.
Source links: Asthma CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/219096/CPG_Asthma.pdf

14 Anaphylaxis

Brief: An 8-year-old, 25 kg, develops lip swelling, hoarseness, wheeze, hives and vomiting after food. HR 150, BP 78/42, RR 36, SpO2 90%.

Viva: Explain mediator-driven vascular leak, vasodilation and bronchoconstriction. Link adrenaline receptor effects to the patient's problems. Why is antihistamine insufficient?

Change: Airway symptoms and shock persist after initial IM treatment.

Checkpoints: Prompt IM adrenaline, oxygen/airway support, safe positioning without walking, repeated assessment and indicated repeats. Escalate refractory disease. Arrange approval for ACP2 paediatric fluids. The current QAS age band gives 300 micrograms IM for this child; verify preparation and repeats in the DTP.

Source: Anaphylaxis CPG.
Source links: Anaphylaxis CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/308718/CPG_Anaphylaxis.pdf`},{id:`medical-toxicology-station-reference`,title:`Medical and toxicology station reference: stations 15–22`,source:`Study Bible`,text:`15 Sepsis with shock

Brief: A 68-year-old has dysuria, flank pain, fever, confusion and oliguria. HR 128, BP 84/48, RR 30, SpO2 93%, temperature 39.2 C, BGL 14.6, GCS 14.

Viva: Explain infection with organ dysfunction, vascular leak and vasodilation. Is a raised BGL sufficient to diagnose DKA? What supports a urinary source?

Change: Perfusion remains poor after an initial assessed fluid intervention.

Checkpoints: Treat immediate threats, monitor, titrate fluid to response, escalate persistent shock and pre-notify urgently. Appropriate antibiotics/source control are required in the care continuum. Do not routinely give ceftriaxone for urinary sepsis under the meningococcal indication.

Source: Sepsis CPG.
Source links: Sepsis CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219052/cpg_sepsis.pdf

16 Hypoglycaemia

Brief: A 46-year-old taking insulin is sweaty, confused and unable to swallow safely after missing lunch. BGL 2.1, HR 116, BP 132/78, RR 20, SpO2 97%, GCS 11.

Viva: Explain neuroglycopenia and sympathetic symptoms. Compare glucose replacement with glucagon. When could glucagon be less effective?

Change: Glucose and consciousness improve, but the patient reports a similar episode yesterday.

Checkpoints: Protect airway, use a safe glucose route, recheck response and investigate cause. IV glucose is first-line when oral administration is unsafe and access is feasible; use the appropriate alternative when needed. Recovery alone does not establish suitability for non-transport; assess recurrence and mandatory transport criteria.

Source: Hypoglycaemia CPG.
Source links: Hypoglycaemia CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0024/219048/CPG_Diabetic-emergency-Hypoglycaemia.pdf

17 Suspected DKA

Brief: A 19-year-old with type 1 diabetes and a failed insulin pump has vomiting, abdominal pain and marked thirst. HR 128, BP 94/60, RR 32 deep, SpO2 98%, BGL 28, blood ketones 5.5 mmol/L, GCS 14.

Viva: Explain insulin deficiency, ketogenesis, osmotic diuresis and compensatory breathing. Compare HHS. Why can total-body potassium depletion coexist with a high serum potassium?

Change: Consciousness declines and respiratory effort becomes inadequate.

Checkpoints: Suspect DKA; acid-base confirmation is needed. Assess dehydration, ketones, ECG and precipitant; provide appropriate supportive care and fluid reassessment. Do not initiate an assumed ACP2 insulin regimen. Hospital care requires coordinated fluids, insulin, electrolyte monitoring and cause treatment. Loss of compensatory ventilation is dangerous.

Source: Hyperglycaemia CPG.
Source links: Hyperglycaemia CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219046/CPG_Diabetic-emergency_hyperglycaemia.pdf

18 Pulmonary embolism

Brief: A 38-year-old ten days after surgery develops sudden pleuritic pain and dyspnoea. HR 126, BP 108/70, RR 30, SpO2 89%; one calf is swollen, lungs largely clear.

Viva: Explain vascular obstruction, dead-space physiology and RV strain. Compare ACS, pneumothorax and pneumonia. Can ECG or saturation exclude PE?

Change: Syncope occurs and BP falls to 76/44.

Checkpoints: Support oxygenation, monitor and transport urgently with escalation. Suspect obstructive shock. Use fluids judiciously because RV overload can worsen output. No automatic ACS anticoagulant/lysis regimen for undifferentiated suspected PE; specialist-directed definitive treatment is separate.

Source: PE CPG.
Source links: PE CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0016/219103/cpg_pulmonary-embolus.pdf

19 Seizure and status epilepticus

Brief: A 35-year-old has continuous generalised convulsions for six minutes. HR 140, SpO2 86%, BGL 5.8. Family reports missed antiseizure medication.

Viva: Explain abnormal neuronal excitation and why prolonged seizure is harmful. Compare hypoglycaemia, toxins, intracranial disease and pregnancy-related causes where applicable. Explain midazolam's GABA effect.

Change: Convulsions stop but RR is 6 with poor chest rise.

Checkpoints: Protect from injury, support airway/oxygenation, give indicated anticonvulsant without delaying for new IV access and check reversible causes. Count prior benzodiazepines. Reassess ventilation after seizure cessation; treat respiratory depression and escalate refractory seizures.

Sources: Seizure CPG, midazolam DTP.
Source links: Seizure CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219059/cpg_seizure.pdf; midazolam DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0021/219360/dtp_midazolam.pdf

20 Opioid poisoning

Brief: A 31-year-old is barely responsive with pinpoint pupils after suspected opioid use. RR 4 shallow, SpO2 74%, HR 56, BP 94/58, BGL 5.2.

Viva: Explain opioid-induced respiratory depression and naloxone's competitive antagonism. Why can toxicity recur? How do co-ingestants change interpretation?

Change: Breathing improves after treatment, but the patient later becomes drowsy again.

Checkpoints: Airway, adequate oxygenation and ventilation precede naloxone. Monitor recurrence and aspiration; transport. Current QAS adult naloxone is 1.6 mg IM once, not an imported titrated-IV regimen. Persistent coma requires reassessment rather than assuming another opioid dose is the only answer.

Sources: Opioid CPG, naloxone DTP.
Source links: Opioid CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219127/cpg_opioids.pdf; naloxone DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0024/219363/DTP_Naloxone.pdf

21 GHB poisoning

Brief: A 24-year-old at a party is deeply drowsy after an unknown liquid and alcohol. RR 7, SpO2 85%, HR 52, BP 92/56, BGL 5.4. Brief jerks occur, and stimulation produces transient arousal.

Viva: What supports GHB exposure? Why is myoclonus not automatically a seizure? What alternative causes of coma must remain on the list?

Change: The patient wakes abruptly, becomes distressed and then vomits.

Checkpoints: Support airway and ventilation, protect against aspiration, monitor and obtain collateral history. There is no specific reversal drug in the QAS GHB pathway. Do not wait for spontaneous recovery when breathing is inadequate; reassess trauma and co-ingestion.

Source: GHB CPG.
Source links: GHB CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219125/cpg_gamma-hydroxybutyrate.pdf

22 Cannabisassociated illness

Brief: A 21-year-old reports severe anxiety, palpitations and altered perception after an edible of unknown strength. HR 122, BP 138/82, RR 24, SpO2 98%, BGL 5.6, GCS 15.

Viva: How does THC alter perception? What distinguishes a tolerable intoxication from dangerous illness? Why ask about synthetic cannabinoids, co-ingestants, chest pain and self-harm intent?

Change: The patient becomes unusually drowsy with RR 8.

Checkpoints: Calm surroundings, primary survey, glucose, appropriate ECG and exposure history. Reopen the differential for unexpected respiratory depression; support ventilation rather than attributing everything to cannabis. No dedicated cannabis CPG was identified in the public QAS index; use the poisoned-patient and relevant symptom pathways.

Sources: QAS poisoned-patient CPG, Queensland Health Adis cannabis information.
Source links: QAS poisoned-patient CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219114/cpg_approach-to-the-poisoned-patient.pdf; Queensland Health Adis cannabis information: https://adis.health.qld.gov.au/drug-profile/cannabis`},{id:`trauma-bleeding-station-reference`,title:`Trauma and bleeding station reference: stations 23–32`,source:`Study Bible`,text:`23 Longbone fracture

Brief: A 40-year-old falls from a ladder and has a deformed thigh. HR 112, BP 108/70, RR 22, SpO2 97%, pain 9/10. A distal pulse is present; sensation is reduced.

Viva: Explain bleeding, pain and neurovascular risk. What associated injuries would make a particular traction device unsuitable? What changes if the fracture is open?

Change: After splinting, the foot becomes cooler and the pulse harder to detect.

Checkpoints: Whole-patient trauma assessment, analgesia, documented neurovascular checks before and after intervention and reassessment of the splint. Use device-specific CPP criteria. Open long-bone injury introduces wound care and cefazolin eligibility; profound shock should prompt a search beyond the obvious fracture.

Source: Extremity injury CPG.
Source links: Extremity injury CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/308752/CPG_Extremity-injury.pdf

24 Pelvic injury

Brief: A 68-year-old pedestrian is struck by a vehicle. Pelvic pain, pallor and confusion are present. HR 130, BP 84/50, RR 28, SpO2 96%.

Viva: Explain concealed pelvic bleeding and binder purpose. Why is pelvic springing inappropriate? What other injuries commonly coexist?

Change: BP remains low after a correctly applied binder.

Checkpoints: Suspect major internal bleeding; apply indicated binder correctly under its CPP, minimise unnecessary movement, reassess and expedite trauma care. Persistent shock requires consideration of ongoing pelvic bleeding and other sources, not repeated pelvic manipulation.

Source: Pelvic injury CPG.
Source links: Pelvic injury CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219142/cpg_pelvic-injury.pdf

25 Major external haemorrhage

Brief: A worker has a deep thigh wound with ongoing heavy bleeding. HR 138, BP 78/46, RR 30, SpO2 98%, temperature 35.2 C, GCS 14.

Viva: Explain reduced preload and oxygen delivery. Why does normal SpO2 not reassure? Explain TXA and why it cannot replace mechanical haemorrhage control.

Change: Bleeding continues despite the first intervention.

Checkpoints: Immediate effective control, reassessment and escalation using appropriate pressure, packing or tourniquet technique. Prevent heat loss, assess COAST/time-based TXA eligibility, consider resuscitation resources and transport. Record interventions and times. Concurrent TBI changes perfusion goals.

Sources: Traumatic haemorrhagic shock CPG, TXA DTP.
Source links: Traumatic haemorrhagic shock CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/308753/CPG_Traumatic-haemorrhagic-shock.pdf; TXA DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0031/219379/DTP_Tranexamic-acid.pdf

26 Tension pneumothorax

Brief: A 27-year-old after chest trauma has severe distress and markedly reduced left air entry. HR 140, BP 74/48, RR 36, SpO2 82%, GCS 13.

Viva: Explain rising pleural pressure and impaired venous return. Compare haemothorax and tamponade. Why should you not wait for tracheal deviation?

Change: The patient deteriorates further during necessary assisted ventilation.

Checkpoints: Recognise a clinical emergency, provide respiratory support and urgent indicated decompression within authorised procedure/scope. Obtain advanced support and transport. Reassess response and alternative causes of shock rather than assuming one intervention fixes all injuries.

Source for stations 26–27: Chest injuries CPG; pair with the current decompression CPP from the QAS index.
Source links: Chest injuries CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219134/cpg_chest-injuries.pdf

27 Traumatic pneumothorax without tension initially

Brief: A cyclist strikes the right chest. Pleuritic pain and reduced right air entry are present. HR 102, BP 128/78, RR 24, SpO2 93%, GCS 15.

Viva: Distinguish simple pneumothorax from tension physiology. How could ventilation or an open wound change management?

Change: BP falls, dyspnoea increases and air entry worsens.

Checkpoints: Oxygen as indicated, analgesia, repeated respiratory/perfusion assessment and transport. Do not decompress solely because a pneumothorax is possible; recognise when deterioration changes the indication. For an open wound, use the chest-seal CPP and reassess after application.

28 Drowning

Brief: A 17-year-old is extracted after approximately six minutes submerged. RR 6 irregular, HR 38, BP 72/40, SpO2 76%, temperature 32.4 C, GCS 7; frothy secretions.

Viva: Explain hypoxaemia, aspiration-related lung injury and hypothermia. Could seizure, arrhythmia or trauma have preceded the drowning?

Change: No pulse can be confidently found.

Checkpoints: Safe rescue environment, airway clearance as needed and effective oxygenation/ventilation immediately. Rewarm and monitor; transition to the applicable resuscitation pathway when indicated. Do not delay ventilation to empty the lungs or for routine immobilisation without a relevant mechanism.

Source: Post-submersion CPG.
Source links: Post-submersion CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219143/cpg_post-submersion.pdf

29 Burns with possible inhalation injury

Brief: A 6-year-old falls into a campfire. Blistering affects the anterior torso and forearms; singed facial hair and new hoarseness are present. HR 150, RR 40, SpO2 95%, GCS 14.

Viva: Explain thermal injury, evolving airway oedema and delayed fluid losses. How will you estimate burn area in a child? What does pulse oximetry miss in CO exposure?

Change: Stridor develops and the voice becomes weaker.

Checkpoints: Recognise threatened airway; request appropriate airway expertise urgently. Stop burning, provide appropriate cooling while maintaining body temperature, analgesia and coverage. Do not let burn-area calculations delay airway care. Obtain consultation for paediatric burn fluids; investigate other causes of early shock.

Source: Burns CPG.
Source links: Burns CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219133/CPG_Burns.pdf

30 Posttonsillectomy haemorrhage

Brief: A 9-year-old, 30 kg, seven days after tonsillectomy is repeatedly swallowing and has vomited fresh blood. HR 138, BP 92/58, RR 26, SpO2 96%, pale but alert.

Viva: Explain secondary bleeding and why visible blood loss may underestimate severity. How do airway and circulatory priorities interact? Explain TXA's mechanism.

Change: Bleeding appears to stop and the parent asks to remain home.

Checkpoints: Position to protect the airway as clinical status permits, prepare suction/support, monitor perfusion and transport even if bleeding stops. Keep nil by mouth and avoid direct out-of-hospital haemorrhage-control manipulation. Consider TXA for active haemorrhage without delaying definitive ENT care. For 30 kg, 15 mg/kg is 450 mg IV over 10 minutes, single dose; check the DTP before rehearsal.

Source: Post-tonsillectomy haemorrhage CPG, TXA DTP above.
Source links: Post-tonsillectomy haemorrhage CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0028/308755/CPG_Post-tonsillectomy-haemorrhage.pdf

31 Gastrointestinal bleeding

Brief: A 58-year-old with cirrhosis has haematemesis and black stools. HR 124, BP 88/54, RR 26, SpO2 96%, GCS 14.

Viva: Compare varices, ulcers and Mallory-Weiss tear. Explain portal hypertension and haemorrhagic shock. Why might antibiotics be indicated in this patient?

Change: Vomiting recurs and consciousness declines.

Checkpoints: Protect airway, support perfusion, keep nil by mouth and transport/pre-notify. Assess liver disease, anticoagulants and NSAIDs. Check ceftriaxone's specific UGIB indication. Do not give TXA merely because bleeding is present: GI bleeding is not a listed routine indication in the reviewed QAS DTP. Hospital treatment may include endoscopy and blood products.

Variant: Replace haematemesis with bright rectal bleeding; consider lower GI causes and brisk upper bleeding rather than assuming location from colour alone.

Source: Upper GI bleeding CPG.
Source links: Upper GI bleeding CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0023/308741/CPG_Upper-gastrointestinal-bleeding.pdf

32 Hypovolaemia from nonhaemorrhagic losses

Brief: A 70-year-old has vomiting and diarrhoea for two days with minimal intake. HR 118, BP 88/54, RR 24, SpO2 96%, temperature 37.4 C, BGL 6.8, dry mouth and reduced urine output.

Viva: Explain reduced preload and compensatory responses. Compare dehydration, sepsis, haemorrhage and cardiogenic shock. What does heart or kidney failure change?

Change: The patient develops crackles and greater dyspnoea during fluid treatment.

Checkpoints: Treat poor perfusion while assessing cause. Reassess fluid need and respiratory findings; stop and reconsider an intervention causing deterioration. Do not use a universal large-volume strategy. Evaluate electrolytes/renal function and the underlying illness through hospital care.

Source: Sodium chloride DTP.
Source links: Sodium chloride DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219374/dtp_sodium-chloride-09.pdf`},{id:`drug-procedure-rehearsal`,title:`Drug and procedure rehearsal: compare mechanisms`,source:`Study Bible`,text:`For every station, make one patient-specific medication card. Write the actual dose and volume after checking the original DTP. Do not leave the exercise at “give appropriate medication”.

Group: ACS
Medicines to rehearse: Aspirin, GTN, fentanyl; pathway-specific antiplatelet, anticoagulant and fibrinolytic
Procedure rehearsal: 12-lead, V4R/V7–V9, transmission, referral, contraindication checklist

Group: Arrest
Medicines to rehearse: Adrenaline, amiodarone
Procedure rehearsal: Rhythm recognition, pads/defibrillation, BVM, authorised airway, team roles

Group: Respiratory
Medicines to rehearse: Oxygen, salbutamol, ipratropium, dexamethasone/hydrocortisone, indicated adrenaline
Procedure rehearsal: Severity assessment, MDI/spacer or nebuliser, BVM, CPAP suitability

Group: Neurological/metabolic
Medicines to rehearse: Glucose gel, glucose 10%, glucagon, midazolam
Procedure rehearsal: BGL/ketones, GCS, NIHSS-8, seizure timing, ventilation reassessment

Group: Poisoning
Medicines to rehearse: Naloxone where indicated; symptom-directed drugs
Procedure rehearsal: Toxidrome assessment, exposure history, BVM, capnography when available

Group: Trauma/bleeding
Medicines to rehearse: Analgesia, sodium chloride, eligible TXA, eligible cefazolin/ceftriaxone
Procedure rehearsal: Haemorrhage control, splint/neurovascular checks, binder, chest assessment

Key distinctions to be able to explain:

Antiplatelet versus anticoagulant versus fibrinolytic versus antifibrinolytic.

Oxygenation versus ventilation; saturation versus oxygen delivery.

Cardiogenic versus distributive versus hypovolaemic versus obstructive shock.

Respiratory distress versus respiratory failure.

Treatment of a pathological arrhythmia versus treatment of compensatory sinus tachycardia.

Medication effect versus untreated pathology when observations change.`},{id:`uploaded-file-station-reference`,title:`Uploaded-file station reference: stations 33–44`,source:`Study Bible`,text:`Use the worked cases above as the examiner's answer guide. Details introduced in the change are invented training variations. Hide the title and answer guide before attempting each station.

33 Paediatric upperairway collapse CBL 5

Brief: 2-year-old after two days of fever/cough; unresponsive, stridor, RR 60, HR 50, SpO2 89%, BGL 4.0. Task: demonstrate the first minute and explain your transition to resuscitation. Change: breathing ceases and a pulse cannot confidently be identified within 10 seconds. Viva: why does paediatric hypoxia cause bradycardia; what QAS age-specific pathway applies? Critical checkpoints: effective ventilation, early assistance, reassessment, appropriate arrest care; no delay for a full history.

34 Adult asthma and interrupted medicine access CBL 6

Brief: 20-year-old, short phrases, tripod, HR 116, RR 22, BP 140/88, preventer unavailable and reliever empty. Task: obtain missing severity information and select delivery/treatment. Change: speech shortens and entry falls. Viva: preventer versus reliever mechanisms; delivery limitations; safe discharge/ongoing-care considerations. Checkpoints: do not use RR alone; recognise worsening; address medicine access without judgement.

35 Elderly collapse long lie and arm injury CBL 7

Brief: 88-year-old found after hours on floor; HR 120, BP 95/50, SpO2 89%, temperature 35°C, painful arm with distal sensory change. Task: give a two-problem formulation and prioritised assessment. Change: increasing arm pain and ECG widening. Viva: crush physiology, occult medical collapse, compartment syndrome. Checkpoints: ABC/perfusion support, ECG/electrolyte concern and escalation, neurovascular checks; don't assume the fracture explains everything.

36 Child mixed TCA and benzodiazepine poisoning CBL 8

Brief: 4-year-old, possible 600 mg Endep and 100 mg Valium missing, GCS 8, HR 140, BP 70/40, SpO2 99%. Task: interpret risk and request appropriate help. Change: broadening QRS and a generalised seizure. Viva: sodium-channel blockade, GABA effects, bicarbonate rationale and scope, flumazenil risk. Checkpoints: airway/ventilation, serial ECG, authorised seizure treatment, urgent escalation/transport.

37 Traumatic PEA CBL 17

Brief: ejected rider; pulseless, apnoeic, organised rhythm 44, groin bleeding, chest/pelvic trauma, poor left entry. Task: allocate concurrent reversible-cause treatment. Change: oxygenation improves but still no pulse. Viva: why electrical activity is insufficient; medical versus traumatic arrest. Checkpoints: bleeding/volume, hypoxia, chest obstruction/tamponade; no fixation on the monitor or routine drug sequence.

38 Penetrating chest injury with persistent shock CBL 18

Brief: chest stab, BP 78/54, severe distress, reduced left entry, neck-vein distension. Task: rank threats and act. Change: entry improves after an indicated intervention, but BP remains low. Viva: tension versus haemothorax versus tamponade. Checkpoints: reconsider mixed causes, urgent definitive care, intervention-effectiveness review.

39 Complete lowerlimb amputation CBL 19

Brief: ongoing bleeding despite improvised tourniquet, HR 138, BP 84/52, confusion, SpO2 98%. Task: achieve effective haemorrhage control and organise transport. Change: coworker wants to remove the tourniquet because it hurts. Viva: oxygen delivery, coagulopathy, TXA/antibiotic eligibility, part preservation. Checkpoints: no routine loosening, pain care, accurate time, reassessment after movement.

40 Posterior MI without chest pain CBL 14

Brief: 73-year-old with diabetes, sudden dyspnoea/vomiting/near-syncope, BP 94/62; V1–V3 horizontal depression/tall R waves. Task: identify extra leads and urgent pathway. Change: V7–V9 elevation appears; crackles worsen. Viva: reciprocal view and implications of low BP. Checkpoints: no reassurance from absent pain; prompt referral and patient-specific treatment.

41 Altered sensation Week 2 dispatch variant

Brief: elderly patient reports sudden left-arm numbness. No observations provided until requested. Task: establish onset, neurological pattern and glucose while assessing ABCs. Change: examiner supplies BGL 2.5, then residual weakness after glucose correction. Viva: why a mimic and stroke can coexist. Checkpoints: treat low glucose, repeat examination, preserve last-known-well and escalate persistent focal deficit.

42 Unconscious after a fall Week 2 dispatch variant

Brief: 20-year-old, unconscious but breathing after fall. Task: protect airway and investigate cause/mechanism. Change: witness says a seizure preceded the fall; patient is still not recovering. Viva: postictal state versus continuing seizure, TBI, hypoglycaemia and poisoning. Checkpoints: repeated GCS/glucose/ventilation assessment; no premature “just postictal” conclusion.

43 Behavioural disturbance with a medical cause Week 2 dispatch variant

Brief: 40-year-old yelling; QPS requests mental-health assessment. Task: safe, least-restrictive engagement and medical screen. Change: temperature 39°C, RR 30 and new confusion are established. Viva: delirium versus psychiatric illness; sedation risks in physiological compromise. Checkpoints: revise diagnosis, treat medical threats, obtain relevant consultation and monitor appropriately.

44 Nausea with colour change Week 2 dispatch variant

Brief: 55-year-old nauseated at 03:00, reported to be changing colour. Task: clarify colour, respiratory/perfusion signs and cardiac symptoms. Change: pale/clammy, BP 86/54, dyspnoeic; first ECG is nondiagnostic. Viva: why antiemetic-only care is unsafe and why serial ECGs matter. Checkpoints: identify shock, investigate ACS and other causes, reassess and transport urgently.`},{id:`mock-a`,title:`Mock A: dyspnoea, vomiting and near-syncope`,source:`Study Bible`,text:`These are original rehearsal question sets based on your uploaded cases, not predicted examination questions. Give the candidate only the case and questions. Allow five minutes of preparation and fifteen minutes of responses. The observer keeps the guide hidden, asks the supplied questions and records evidence against the five viva criteria. Use the clinical chapters for full treatment details and current DTP checks.

Mock A Dyspnoea vomiting and near syncope

Case from CBL 14: A 73-year-old with diabetes has acute dyspnoea, vomiting and near-syncope without chest pain. HR 112, BP 94/62, RR 28, SpO2 93%, BGL 10.8. The teaching ECG describes V1–V3 ST depression with tall R waves and upright T waves.

Candidate questions: Interpret the history, observations and ECG. Give your provisional diagnosis and two dangerous alternatives. Explain the myocardial process and the reason for these ECG changes. Describe immediate management, additional investigations and pharmacological decisions, including what the blood pressure changes. Explain the appropriate healthcare pathway and definitive care.

Observer guide: Suspected posterior coronary occlusion is the important working diagnosis; obtain posterior leads and urgent reperfusion assessment. The lack of chest pain does not exclude ACS. Explain an anterior reciprocal view of posterior injury and avoid using a nondiagnostic standard tracing as reassurance. Link reduced contractility and cardiac output to hypotension and poor perfusion; dyspnoea may reflect pulmonary congestion but needs examination. PE and other causes of shock remain alternatives. Describe serial assessment, ECG transmission, indicated ACS therapy with contraindication checks, oxygen according to need and prompt destination decisions. Hypotension makes routine GTN unsafe; fluids require assessment of congestion and response. Explain coronary angiography/PCI and pathway-dependent reperfusion options rather than declaring every patient eligible for prehospital fibrinolysis.

Change: BP falls to 78/50 with new crackles. The answer should recognise worsening shock, reassess breathing and perfusion, obtain urgent support and change therapies that may worsen haemodynamics. “Give more of the original treatment” is not sufficient reasoning.`},{id:`mock-b`,title:`Mock B: a quiet child after severe wheeze`,source:`Study Bible`,text:`Case from CBL 16: An 8-year-old, 27 kg, has asthma. They are now drowsy with a silent chest and shallow breathing at 12/min, HR 156, BP 86/50 and SpO2 82%. The sheet lists GCS 12 and E3 V4 M5, but its description of speech also needs clarification.

Candidate questions: Interpret severity and explain why a lower respiratory rate is concerning. Compare asthma with anaphylaxis and upper-airway obstruction. Explain the pathology producing the observations. Describe urgent support and the role and limitations of each relevant medicine. Explain escalation and definitive care.

Observer guide: This is respiratory failure, not improvement. Bronchoconstriction, mucosal inflammation and mucus cause expiratory obstruction, air trapping and ventilation/perfusion mismatch. Exhaustion causes inadequate ventilation, worsening hypoxaemia and possible hypercapnia; altered consciousness increases airway risk. Reduced entry can mean critically low airflow, so absence of wheeze is not reassuring. Prioritise effective ventilation/oxygenation, help and transport while providing indicated asthma treatment. Explain beta-2 bronchodilation, antimuscarinic effect and delayed anti-inflammatory steroid effect; neither a steroid nor a nebuliser replaces ventilation in a failing child. Check weight, preparation, authority and dosing from the DTP. Ask about allergen exposure and skin/GI/circulatory features; absence of skin signs alone cannot exclude anaphylaxis. Hospital care may require advanced respiratory support and intensive monitoring.

Change: A caregiver reports peanut exposure immediately before symptoms and repeated vomiting. Reconsider anaphylaxis and its adrenaline pathway rather than anchoring on asthma history.`},{id:`mock-c`,title:`Mock C: fever, confusion and low blood pressure`,source:`Study Bible`,text:`Case from the uploaded fever viva: A 68-year-old has urinary symptoms, flank pain, fever, new confusion and oliguria. HR 128, BP 84/48, RR 30, temperature 39.2°C, SpO2 93%, BGL 14.6 and GCS 14.

Candidate questions: Identify the critical findings and formulate a provisional diagnosis. Explain the causes of hypotension, altered mentation, reduced urine and tachypnoea. Describe safe, justified management and pharmacology. What would change if there were heart failure? Explain definitive treatment and the paramedic's contribution.

Observer guide: Suspected urinary-source sepsis with shock physiology and organ dysfunction is the clinical formulation. Do not claim that all formal hospital septic-shock criteria are proven without the necessary data. Infection-associated dysregulated inflammation causes vasodilation, permeability changes and impaired tissue perfusion; myocardial dysfunction may contribute. Discuss alternative infection sources, hypovolaemia, cardiogenic causes and metabolic problems. Use ABC support, serial perfusion/respiratory assessment, indicated fluids titrated to response, appropriate monitoring, early referral and urgent transport. Explain why a single BP is inadequate and why fluid can worsen pulmonary congestion. The uploaded ceftriaxone flashcard does not authorise routine ceftriaxone for every septic patient. Definitive care includes investigations, timely appropriate antimicrobials, haemodynamic support when needed and source control; urinary obstruction may require procedural treatment.

Change: New crackles and greater breathlessness develop during fluid treatment. Stop and reassess the fluid decision, oxygenation, cardiac function and need for escalation; do not pursue a fixed volume despite harm.`},{id:`mock-d`,title:`Mock D: chest trauma and persistent shock`,source:`Study Bible`,text:`Case from CBL 18: A patient with a chest stab has HR 132, BP 78/54, RR 34, SpO2 89%, reduced left air entry and neck-vein distension. The teaching ECG's rate differs from the written observations.

Candidate questions: Rank the immediately dangerous diagnoses. Explain the physiological mechanism of obstructive shock and compare it with haemorrhagic shock. Describe immediate priorities and scope-dependent interventions. Explain reassessment, destination and definitive treatment.

Observer guide: Tension pneumothorax is a major concern; haemothorax, tamponade and other bleeding can coexist. Explain raised intrathoracic pressure impairing venous return and cardiac output, and impaired ventilation. A tension diagnosis is clinical in an unstable patient and must not wait for elective imaging. Apply the current QAS chest-trauma pathway and authorised procedure with appropriate assistance; do not treat every simple pneumothorax as tension. Address external bleeding and other threats, avoid scene delay and notify trauma capability. Clarify conflicting ECG/vital timing. Definitive care may include pleural drainage, blood products and surgery according to injury.

Change: After an indicated intervention, air entry improves but BP remains 78/50. Check intervention effectiveness and re-evaluate haemorrhage/tamponade and mixed shock. Do not regard one treated diagnosis as proof that every threat has resolved.`},{id:`mock-e`,title:`Mock E: a drowsy child and missing tablets`,source:`Study Bible`,text:`Case from CBL 8: A 4-year-old may have ingested 600 mg Endep and 100 mg Valium. GCS 8, HR 140, RR 40, BP 70/40 and SpO2 99%. The exact amount and timing are unconfirmed.

Candidate questions: Interpret the risk and explain why saturation does not establish safety. Compare the pharmacology of the two drugs. What ECG changes and complications concern you? Describe priorities, consultation and treatment scope. Explain why an apparent antidote may be harmful and identify definitive care.

Observer guide: Mixed TCA/benzodiazepine poisoning risks airway compromise, seizures, hypotension and dysrhythmia. Amitriptyline causes sodium-channel blockade and other receptor effects; diazepam enhances GABA-mediated inhibition. QRS widening and a terminal R in aVR support concern for TCA cardiotoxicity. Obtain serial ECGs and assess actual ventilation. Prioritise airway/ventilation and circulation, early advanced assistance and urgent transport. Explain bicarbonate's sodium/alkalinisation rationale with its QAS scope restriction; do not present a CCP intervention as independent ACP2 authority. Flumazenil is hazardous in this mixed ingestion because reversal can precipitate seizures and expose proconvulsant toxicity. Hospital care may require intensive monitoring, advanced airway support and specialist toxicology management.

Change: A seizure starts and QRS widens. Treat the immediate threats using authorised care, reassess ventilation and expedite appropriate specialist treatment. Do not delay to establish a perfect ingestion history.`},{id:`mock-f`,title:`Mock F: a child after a campfire injury`,source:`Study Bible`,text:`Case from the uploaded burns viva: A 6-year-old has burns over the anterior neck and torso, forearms and hands. There are blisters, singed hair and difficulty speaking. RR 40, HR 150, SpO2 95%, GCS 14 without components supplied.

Candidate questions: Identify the immediate threats and missing information. Explain burn injury, fluid shifts and inhalation concerns. Describe assessment, treatment, analgesia and consequences of management. Explain transport destination and definitive care.

Observer guide: Difficulty speaking and the exposure history raise airway concern; singed hair alone does not prove a threatened airway. Assess progression, voice, stridor, work of breathing, ventilation and exposure circumstances. A conventional saturation reading cannot exclude carbon-monoxide exposure. Stop the burning process, provide indicated cooling while preventing whole-body hypothermia, remove constricting items when safe, cover appropriately and provide analgesia with reassessment. Estimate depth and area using an age-appropriate method; do not invent a percentage from incomplete anatomical detail or assume early hypotension is solely burn-fluid loss. Escalate airway concerns early and arrange appropriate paediatric/burns capability. Explain specialist wound assessment, fluid management when indicated and surgical/rehabilitation care.

Change: Increasing hoarseness and drowsiness develop. Reprioritise airway/ventilation and advanced help rather than completing wound measurements first.`},{id:`retrieval-answer-checks`,title:`Thirty retrieval questions with explained answer checks`,source:`Study Bible`,text:`Cover the answer column. Explain the answer aloud and add a patient example. A one-word answer does not demonstrate the pathology criterion.

Question: Why can SpO2 be normal during severe haemorrhage?
Answer check: It measures the proportion of haemoglobin saturated, not haemoglobin quantity or cardiac output; oxygen delivery can be critically low

Question: Why is a silent chest dangerous?
Answer check: Airflow may be too low to generate wheeze; assess entry, effort, mentation and ventilation rather than assuming resolution

Question: Why can a falling respiratory rate be deterioration?
Answer check: Exhaustion or CNS depression can reduce ventilation despite worsening disease

Question: Why does PEA require patient assessment?
Answer check: Organised electrical activity does not guarantee effective contraction or a palpable pulse

Question: Why does traumatic PEA change priorities?
Answer check: Reversible traumatic causes such as haemorrhage, hypoxia and chest obstruction need immediate targeted correction

Question: How do you distinguish compensatory sinus tachycardia from SVT?
Answer check: Examine onset, rhythm/P waves, rate pattern and physiological triggers; treating the cause of compensation differs from treating an arrhythmia

Question: Why can RV infarction make GTN hazardous?
Answer check: Reduced preload can worsen right ventricular output and systemic pressure, particularly in the already hypotensive patient

Question: Why obtain posterior leads?
Answer check: A posterior injury may appear as reciprocal anterior depression on a standard ECG

Question: Why does glucose correction not end every stroke assessment?
Answer check: Persistent focal deficits may represent coexisting stroke; reassess and retain onset information

Question: Why can DKA cause deep rapid breathing?
Answer check: Respiratory compensation lowers CO2 in response to metabolic acidosis; exhaustion threatens this compensation

Question: Why can DKA have high serum potassium with depleted total stores?
Answer check: Shifts out of cells coexist with urinary losses; treatment can rapidly alter the circulating concentration

Question: Why titrate oxygen in COPD?
Answer check: Treat hypoxaemia while limiting excessive oxygen-associated hypercapnia; V/Q changes and the Haldane effect matter

Question: Why does adrenaline help anaphylaxis beyond wheeze?
Answer check: Alpha effects oppose vasodilation and oedema; beta effects support cardiac function and bronchodilation

Question: Why is salbutamol insufficient for anaphylactic shock?
Answer check: Bronchodilation does not adequately correct systemic vasodilation and capillary leak

Question: Why do steroids not replace urgent airway support?
Answer check: Their anti-inflammatory effect is delayed and they do not immediately restore failing ventilation

Question: Why can a normal BP conceal early shock?
Answer check: Compensation can preserve pressure despite poor perfusion; interpret mentation, skin, pulse, urine and trends

Question: Why reassess after fluids?
Answer check: Benefit depends on the cause of shock and response; excess fluid can worsen congestion and gas exchange

Question: Why is naloxone not the first and only action?
Answer check: Airway support and effective ventilation address immediate hypoxia; recurrent toxicity and mixed causes remain possible

Question: Why avoid flumazenil in the mixed CBL ingestion?
Answer check: Reversal can provoke seizures, especially with a proconvulsant TCA exposure

Question: Why is QRS widening concerning in TCA poisoning?
Answer check: Fast sodium-channel blockade slows ventricular conduction and signals cardiotoxic risk

Question: Why can a child bleed substantially after tonsillectomy without visible loss?
Answer check: Blood may be swallowed; swallowing, haematemesis and perfusion changes matter

Question: Why does hypotension not automatically mean give GTN for pulmonary oedema?
Answer check: GTN reduces preload/afterload and can worsen low pressure; reassess the haemodynamic context and contraindications

Question: Why compare distal limb findings before and after splinting?
Answer check: It establishes baseline compromise and identifies deterioration from injury or intervention

Question: Why reassess a tourniquet after movement?
Answer check: Effective control can be lost; visible cessation of bleeding must be confirmed repeatedly

Question: Why is definitive care more than transport?
Answer check: The destination must supply the intervention the patient needs, with timely notification and continuity of information

Question: What turns a differential list into clinical reasoning?
Answer check: Ranking alternatives and naming evidence that supports, weakens or would change the diagnosis

Question: What turns a medicine list into pharmacology knowledge?
Answer check: Explaining mechanism, indication in this patient, dose safety, desired effect, adverse effects and monitoring

Question: What should you do with inconsistent source observations?
Answer check: State the inconsistency, verify the patient and timing, and avoid silently changing facts to fit a diagnosis

Question: What demonstrates team management?
Answer check: Specific allocation, workload awareness, checking completion and adjusting actions to the reported result

Question: What is the final readiness test?
Answer check: An unfamiliar timed case with independent safe reasoning and observed practical performance, followed by successful delayed retesting`},{id:`completion-error-record`,title:`Completion record, medicine verification and delayed retesting`,source:`Study Bible`,text:`Use a separate line for each of stations 1–44. Write the station number, date, pathology explanation, differential justification, management and drug check, definitive care, oral clarity, practical performance where relevant, and delayed retest result. Mark a station complete only when the relevant criteria are demonstrated independently. Reading or recognising the answer does not count as recall.

For each medication create a separate checked record: source and version, authority, indication in this case, mechanism, contraindications, dose, preparation, volume, route, repeat/maximum where applicable, adverse effects and reassessment. Explain it aloud, then change the weight, concentration or contraindication. The worked examples support this exercise; they are not a substitute for a verified complete formulary.

Before the final mock, select one respiratory, one cardiac, one medical/toxicology and one trauma case without reading their titles. Ask your observer to change one important finding. Your task is to recognise the change, explain its significance and adapt care, not preserve your first diagnosis.`},{id:`source-version-limitations`,title:`Source/version notes, clinical scope and unresolved limitations`,source:`Study Bible`,text:`Source and version notes

The supplied documents report the following source checks; they were not independently rechecked for this app. Public QAS documents were checked through the live Clinical Practice Manual on 17 October 2026, including linked CPGs, selected CPPs and relevant DTPs. A past review date does not by itself establish that a document has been withdrawn; use the live index and actual PDF. Some index version labels differ from PDF dates. The reperfusion CPP is October 2026; ACS, hypoglycaemia and UGIB are June 2026; asthma, burns and adult non-traumatic resuscitation are March 2026. Other current indexed documents are older.
Source links: live Clinical Practice Manual: https://www.ambulance.qld.gov.au/clinical/cpm

The public reperfusion material contains discrepancies between narrative and checklist thresholds. Do not resolve ambiguous eligibility from a study summary; use consultation and assessment instructions. For SVT, do not assume adenosine from an external algorithm. No dedicated cannabis guideline was identified in the public index; the general poisoning framework and Queensland Health information support that station.

Corrections to the uploaded flashcards remain important: ceftriaxone is not routine treatment for all suspected sepsis; ipratropium has severity/response-specific indications and accompanies nebulised salbutamol; check original dose-band tables and scope badges. This bank does not certify every flashcard as accurate.

Consult the DTP index for all preparations, authority badges, contraindications and dosing details. These original case exercises summarise clinical reasoning; they do not reproduce or modify the QAS algorithms.
Source links: DTP index: https://www.ambulance.qld.gov.au/clinical/cpm/drug-therapy-protocols

Additional source notes for this expanded edition

Reviewed 17 October 2026. The supplied documents establish the case facts; explanatory responses are an independent educational synthesis. The QAS documents linked throughout establish the relevant clinical framework. Important additional sources are the June 2026 paediatric non-traumatic resuscitation CPG, traumatic resuscitation CPG, TCA poisoning CPG, sodium-bicarbonate DTP, crush-injury CPG, and acute behavioural disturbance CPG. RCH sources supplement physiology and toxicology education and do not confer QAS scope.
Source links: acute behavioural disturbance CPG: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219015/CPG_acute-behavioural-disturbance.pdf

For flumazenil and mixed ingestion, see RCH benzodiazepine poisoning. For current medication eligibility and preparation, return to the QAS DTP index, especially adrenaline, dexamethasone, ceftriaxone, ipratropium, glucose 10%, fentanyl and TXA when using the calculation exercises.
Source links: RCH benzodiazepine poisoning: https://www.rch.org.au/clinicalguide/guideline_index/Benzodiazepine_Poisoning/; QAS DTP index: https://www.ambulance.qld.gov.au/clinical/cpm/drug-therapy-protocols

Direct checks for the worked calculations and indication corrections: dexamethasone DTP, glucose 10% DTP, ipratropium DTP, ceftriaxone DTP.
Source links: dexamethasone DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/219328/DTP_Dexamethazone.pdf; glucose 10% DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/219337/DTP_Glucose-10.pdf; ipratropium DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/219348/dtp_ipratropium-bromide.pdf; ceftriaxone DTP: https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0023/219326/DTP_Ceftriaxone.pdf

Remaining limitations are explicit: the supplied viva and practical rubrics guide this edition; VIRCA/ROLE expansions are unresolved; synthetic ECG precision is limited; the full 38-drug deck has been explained but not certified as a complete current formulary. These limitations do not prevent working through the clinical learning objectives, but they identify which source checks must accompany rehearsal.`},{id:`bank-practice-method`,title:`Practice Bank: hidden briefs, nine questions and an optional circuit`,source:`Practice Bank`,text:`First read only the patient brief. In a paired session, the examiner supplies observations when requested, reveals the change after your initial plan and uses the checkpoints afterwards. Do not memorise the title as the diagnosis: conceal titles when testing yourself.

Optional training circuit only (no official OSCE station duration was supplied): 1 minute immediate priorities, 4 minutes focused assessment and initial treatment, 2 minutes response to change, 1 minute handover, followed by 5 minutes of viva. This timing is for practice; adapt to your actual exam format.

For every case answer these questions:

1. What can kill the patient first, and what must happen immediately?
2. What is the provisional diagnosis? Give three supporting findings.
3. What dangerous alternatives remain? What evidence would change your ranking?
4. Explain the pathology as a causal chain, linking it to the observations.
5. Explain the order of treatment and each treatment's physiological target.
6. For each drug, state indication, exclusions, mechanism, preparation, dose, route, repeats, maximum and monitoring.
7. What is within your scope, what requires approval, and what requires additional resources?
8. What improvement do you expect, and what would make you stop or change treatment?
9. Where does the patient need to go, how urgently, and what definitive treatment may be needed?

A useful answer structure: “My provisional diagnosis is ... supported by ... . The immediate threat is ... . I will ... because ... . I am also considering ... . If ... changes, I will ... .”`},{id:`bank-progression`,title:`Practice Bank: safety remediation and three levels of independence`,source:`Practice Bank`,text:`Use the separate five-domain viva and practical rubrics from the Study Bible for assessment practice. The older bank also offers an optional learning checklist: immediate priorities, assessment, differential reasoning, pathology, treatment sequence, drug safety/calculation, reassessment/escalation, and communication/destination. This checklist is supplementary learning feedback, not an official pass rule.

Examples requiring immediate remediation: missed ventilation failure, delayed haemorrhage control, shocking confirmed asystole, wrong drug concentration/route, unsafe oral administration, contraindicated GTN, or missed escalation in a deteriorating patient. Rehearse the correction immediately, then retest without prompts the next day.

| Date | Station | Error or uncertainty | Correct reasoning | Retest date/result |
|---|---|---|---|---|
| | | | | |
| | | | | |
| | | | | |

Use three levels: guided case with open notes; closed-note case with prompts; unfamiliar case with no diagnostic title and a deterioration. Readiness means transferring reasoning to the unfamiliar version, not reciting a memorised narrative.`},{id:`bank-expanded-revision`,title:`Practice Bank: a 100-minute session and four passes per topic`,source:`Practice Bank`,text:`Use the original schedule as a backbone, with these uploaded-file additions. You do not need to read this entire document in one sitting.

| Session focus | Read first | Practise without notes | Explain back in 60 seconds |
|---|---|---|---|
| Physiology/sepsis/glucose | Observations workshop; sepsis viva; long lie | 15–17, 32, 35 | Why saturation, BP and perfusion are different |
| Respiratory/paediatrics | CBL 5, 6, 15, 16; anaphylaxis | 9–14, 33–34 | Distress versus failure; adrenaline versus salbutamol |
| ACS/ECG | CBL 13–14; ECG and reperfusion workshop | 1–2, 7, 18, 40 | RV preload and posterior reciprocal changes |
| Resuscitation | Medical-arrest stations; CBL 5 and 17 | 3–6, 33, 37 | Why medical and traumatic PEA priorities differ |
| Neuro/toxicology | Week 2 dispatches; CBL 8 | 8, 19–22, 36, 41–44 | Why normal SpO2 does not guarantee a safe airway |
| Trauma/bleeding | Week 5 worked cases; pelvic extension | 23–27, 38–39 | Mixed shock and reassessment after intervention |
| Burns/drowning/other bleeding | Three relevant worked sections | 28–31 | Cooling a burn while keeping the child warm |

**A 100-minute study session:** 10 minutes retrieval of yesterday's errors; 25 minutes one worked case; 15 minutes medication mechanisms/calculations; 20 minutes a timed OSCE plus feedback; 15 minutes a contrasting case; 15 minutes a closed-note viva. Shorten proportionally if needed; retain retrieval and practice rather than spending the whole session rereading.

**Four passes per topic:** (1) explain it with the guide open; (2) repeat closed-note later that day; (3) retest next day with one altered feature; (4) test again in a mixed session two or three days later. Spend the final evening correcting recurring errors and protecting sleep, not trying to memorise a new textbook.

**For each case produce five things:** a one-sentence formulation; a three-link pathology chain; a ranked differential with discriminating evidence; a sequenced management plan with medication safety; and a reassessment/escalation plan. If any is missing, that identifies what to study next.
