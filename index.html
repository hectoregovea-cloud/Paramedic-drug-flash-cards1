/*$vite$:1*/</style></head><body><div id="app"></div><noscript>Enable JavaScript to play Night Shift.</noscript><script>(function(){var e=[{id:`station-01`,number:1,title:`STEMI with right ventricular involvement`,dispatch:`Chest pressure with low blood pressure`,cluster:`cardiac`,brief:`A 59-year-old has 45 minutes of central pressure radiating to the jaw, nausea and diaphoresis. HR 44, BP 82/54, RR 24, SpO2 96% room air, GCS 15. Lungs are clear. ECG has inferior ST elevation, reciprocal changes and V4R elevation.`,viva:`Explain coronary occlusion and reduced RV output. Why can bradycardia worsen perfusion? What makes GTN unsuitable here? How do antiplatelets differ from anticoagulants and fibrinolytics?`,change:`BP falls to 70/42 and consciousness declines. How do escalation and transport priorities change?`,checkpoints:`Recognise unstable infarction; obtain/transmit ECGs, request appropriate support and activate the reperfusion pathway. Withhold GTN for the actual BP and HR contraindications. Consider cautious fluid only after evaluating congestion; monitor for dysrhythmia. Explain PCI as definitive reperfusion and follow the accepted pathway for adjunct drugs.`,sources:[{title:`ACS CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219019/CPG_Acute-coronary-syndrome.pdf`},{title:`reperfusion CPP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/308765/CPP_Pre-hospital-cardiac-reperfusion.pdf`}],sourceNote:`Sources: [ACS CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219019/CPG_Acute-coronary-syndrome.pdf), [reperfusion CPP](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/308765/CPP_Pre-hospital-cardiac-reperfusion.pdf).`,decisions:[{id:`priority`,prompt:`With inferior ST elevation, V4R elevation, HR 44 and BP 82/54, which initial plan best protects perfusion?`,options:[{id:`a`,label:`Give GTN to reduce myocardial workload, then reassess the blood pressure.`,correct:!1,feedback:`The actual hypotension and bradycardia contraindicate GTN. Further preload reduction can worsen output in this presentation.`},{id:`b`,label:`Transmit ECGs, activate reperfusion and request support; assess congestion before considering cautious fluid.`,correct:!0,feedback:`An occluded coronary artery needs urgent reperfusion. Reduced RV output and bradycardia threaten perfusion; any fluid decision must account for congestion.`},{id:`c`,label:`Prioritise a large fluid intervention and wait for the blood pressure to normalise before activating reperfusion.`,correct:!1,feedback:`Fluid requires cautious assessment and monitoring. Definitive reperfusion and escalation must not wait for a normal blood pressure.`}]},{id:`change`,prompt:`BP is now 70/42 and consciousness is declining. What should drive the next action?`,options:[{id:`a`,label:`Give GTN once pain has been reassessed because inferior elevation identifies an infarct.`,correct:!1,feedback:`An infarct does not remove the BP and HR contraindications. Vasodilation can further compromise this patient’s perfusion.`},{id:`b`,label:`Observe for spontaneous improvement because the lungs remain clear.`,correct:!1,feedback:`Clear lungs do not exclude critical low cardiac output. Falling BP and consciousness indicate worsening perfusion.`},{id:`c`,label:`Escalate immediately, expedite the reperfusion pathway and transport, and reassess perfusion and rhythm.`,correct:!0,feedback:`Declining consciousness with profound hypotension signals unstable perfusion. Urgent support and definitive reperfusion remain time critical.`}]}]},{id:`station-02`,number:2,title:`ACS without diagnostic ST elevation`,dispatch:`Chest pressure and vomiting`,cluster:`cardiac`,brief:`A 67-year-old with diabetes has chest pressure, breathlessness and vomiting. HR 104, BP 146/88, RR 22, SpO2 95%, BGL 11.2, GCS 15. Initial ECG shows lateral ST depression.`,viva:`What distinguishes ACS, NSTEMI and unstable angina? What cannot be established without troponin testing? Compare dissection and PE. Why repeat ECGs when pain changes?`,change:`Pain eases but hypotension develops. Is the patient necessarily improving?`,checkpoints:`Treat suspected ACS and assess medication suitability; do not diagnose NSTEMI solely from ST depression. Monitor for dynamic changes and consider posterior leads when the pattern warrants them. Relief of pain does not establish reperfusion. Reassess perfusion, rhythm and alternative diagnoses.`,sources:[{title:`ACS CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219019/CPG_Acute-coronary-syndrome.pdf`}],sourceNote:`Source: ACS CPG linked above.`,decisions:[{id:`priority`,prompt:`How should the initial lateral ST depression guide your assessment and treatment?`,options:[{id:`a`,label:`Treat suspected ACS, assess medication suitability and obtain serial ECGs as symptoms change.`,correct:!0,feedback:`ST depression supports suspected ACS but does not establish NSTEMI without further testing. Ischaemic changes may evolve on repeat ECGs.`},{id:`b`,label:`Diagnose NSTEMI from the ECG and defer reassessment until troponin is available.`,correct:!1,feedback:`ST depression alone cannot distinguish NSTEMI from unstable angina. Reassessment is needed for dynamic ischaemia and alternative diagnoses.`},{id:`c`,label:`Wait for diagnostic ST elevation before considering an ACS pathway.`,correct:!1,feedback:`ACS can occur without ST elevation. The clinical presentation and ST depression warrant assessment and treatment for suspected ACS.`}]},{id:`change`,prompt:`Pain eases, but hypotension develops. Which interpretation is safest?`,options:[{id:`a`,label:`Pain relief establishes reperfusion, so reduce the intensity of monitoring.`,correct:!1,feedback:`Pain relief does not establish reperfusion. Hypotension can signal deteriorating cardiac output or another dangerous cause.`},{id:`b`,label:`Reassess perfusion, rhythm and alternative diagnoses despite the reduced pain.`,correct:!0,feedback:`The new haemodynamic change takes priority. Symptoms can improve while perfusion deteriorates, and the initial diagnosis must remain open to review.`},{id:`c`,label:`Repeat only the pain score before deciding whether hypotension needs attention.`,correct:!1,feedback:`The pain score cannot establish adequate circulation. New hypotension requires prompt haemodynamic and rhythm reassessment.`}]}]},{id:`station-03`,number:3,title:`Ventricular fibrillation arrest`,dispatch:`Collapse with abnormal breathing`,cluster:`cardiac`,brief:`A 56-year-old collapses, is unresponsive, has agonal breaths and no confidently palpable central pulse. VF is identified on the defibrillator.`,viva:`Why does VF produce no effective output? Why do compression quality and prompt defibrillation matter? Explain the roles of amiodarone and adrenaline.`,change:`VF persists through three shocks; later an organised rhythm appears.`,checkpoints:`High-quality CPR, early defibrillation, airway/ventilation, rhythm cycles and reversible causes. Follow current QAS sequencing after the third shock, with amiodarone prioritised. Determine whether organised activity represents ROSC or PEA; transition to post-ROSC care when circulation returns.`,sources:[{title:`Adult non-traumatic resuscitation CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf`}],sourceNote:`Source for stations 3–6: [Adult non-traumatic resuscitation CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf).`,decisions:[{id:`priority`,prompt:`VF is displayed in an unresponsive patient with agonal breaths and no confidently palpable central pulse. What is the immediate priority?`,options:[{id:`a`,label:`Obtain a 12-lead ECG before committing to the arrest pathway.`,correct:!1,feedback:`VF has no effective cardiac output. Delaying CPR and defibrillation prolongs absent perfusion.`},{id:`b`,label:`Give antiarrhythmic medication before the first shock to improve conversion.`,correct:!1,feedback:`Medication does not replace prompt defibrillation and high-quality CPR; use current QAS sequencing.`},{id:`c`,label:`Begin high-quality CPR and prompt defibrillation with airway and ventilation support.`,correct:!0,feedback:`Disorganised ventricular activity produces no effective output. Compressions support perfusion while defibrillation aims to terminate VF.`}]},{id:`change`,prompt:`VF has persisted through three shocks and an organised rhythm later appears. Which plan best handles both stages?`,options:[{id:`a`,label:`Follow the current third-shock sequence, prioritising amiodarone; assess circulation when the organised rhythm appears.`,correct:!0,feedback:`Use the supplied QAS sequence after the third shock. Organised electrical activity may be ROSC or PEA, so circulation determines the next pathway.`},{id:`b`,label:`Repeat shocks immediately whenever an organised rhythm appears after persistent VF.`,correct:!1,feedback:`The new rhythm must be classified. Organised activity without a pulse is PEA; a perfusing rhythm requires post-ROSC care.`},{id:`c`,label:`Stop CPR and begin post-ROSC care as soon as organised complexes appear.`,correct:!1,feedback:`An organised tracing does not prove effective output. Confirm circulation before making the post-ROSC transition.`}]}]},{id:`station-04`,number:4,title:`Pulseless ventricular tachycardia`,dispatch:`Collapse with fast monitor rhythm`,cluster:`cardiac`,brief:`A 62-year-old collapses. The monitor shows regular broad-complex tachycardia at 220/min; no pulse is confidently felt.`,viva:`How does pulse status change the pathway? Explain unsynchronised defibrillation versus synchronised cardioversion.`,change:`Following treatment, a pulse returns but BP is 72/40 and broad-complex tachycardia persists.`,checkpoints:`Treat initial pulseless VT as a shockable arrest. Reclassify after ROSC; a perfusing but unstable tachyarrhythmia requires a different approach and urgent appropriate support. Do not continue arrest treatment purely because the rhythm still looks similar.`,sources:[{title:`Adult non-traumatic resuscitation CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf`}],sourceNote:`Source for stations 3–6: [Adult non-traumatic resuscitation CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf).`,decisions:[{id:`priority`,prompt:`The patient has a regular broad-complex rhythm at 220/min and no confidently felt pulse. Which pathway is indicated?`,options:[{id:`a`,label:`Synchronised cardioversion after a complete history because the rhythm is regular.`,correct:!1,feedback:`The absent pulse defines a shockable arrest. Synchronised treatment is a different pathway for a perfusing tachyarrhythmia.`},{id:`b`,label:`High-quality CPR and unsynchronised defibrillation for pulseless VT.`,correct:!0,feedback:`Pulseless VT provides no effective circulation. CPR and the shockable-arrest pathway address the immediate loss of output.`},{id:`c`,label:`A stable tachycardia assessment because regular electrical activity indicates output.`,correct:!1,feedback:`Electrical regularity does not establish circulation. Pulse status changes the pathway to cardiac arrest treatment.`}]},{id:`change`,prompt:`A pulse returns, but broad-complex tachycardia persists with BP 72/40. What changes?`,options:[{id:`a`,label:`Continue the arrest sequence because the broad-complex appearance has not changed.`,correct:!1,feedback:`Return of circulation changes the pathway. Similar electrical appearance does not justify continuing arrest treatment automatically.`},{id:`b`,label:`Treat as stable because the presence of any pulse establishes adequate perfusion.`,correct:!1,feedback:`BP 72/40 indicates haemodynamic instability despite a pulse. Urgent appropriate support is still required.`},{id:`c`,label:`Reclassify as an unstable perfusing tachyarrhythmia and seek urgent appropriate support.`,correct:!0,feedback:`ROSC establishes circulation, but profound hypotension indicates unstable output. The patient now needs the applicable perfusing-arrhythmia pathway and support.`}]}]},{id:`station-05`,number:5,title:`Pulseless electrical activity`,dispatch:`Collapse after recent surgery`,cluster:`cardiac`,brief:`A 45-year-old with preceding dyspnoea collapses. Organised narrow complexes at 60/min are present, but there is no pulse. Recent surgery is disclosed.`,viva:`Why is PEA a clinical diagnosis? Explain possible hypoxia, hypovolaemia and pulmonary obstruction. Why is this rhythm not shocked?`,change:`A later rhythm check shows VF.`,checkpoints:`CPR, ventilation, early adrenaline in the non-shockable pathway and reversible-cause work. Consider PE from the history without treating it as confirmed. Switch pathways if the rhythm becomes shockable. A monitor tracing alone cannot establish circulation.`,sources:[{title:`Adult non-traumatic resuscitation CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf`}],sourceNote:`Source for stations 3–6: [Adult non-traumatic resuscitation CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf).`,decisions:[{id:`priority`,prompt:`Organised narrow complexes are present at 60/min, but there is no pulse. What is the best initial approach?`,options:[{id:`a`,label:`Use the non-shockable pathway with CPR, ventilation, early adrenaline and reversible-cause assessment.`,correct:!0,feedback:`PEA is organised electrical activity without effective circulation. CPR and reversible-cause work are essential; the organised rhythm is not a shock indication.`},{id:`b`,label:`Shock the organised rhythm because the recent surgery makes pulmonary embolism likely.`,correct:!1,feedback:`The history raises concern for PE but does not make it confirmed or convert PEA into a shockable rhythm.`},{id:`c`,label:`Observe the monitor briefly because narrow complexes imply adequate cardiac output.`,correct:!1,feedback:`PEA is a clinical diagnosis: an organised tracing can coexist with absent output. The patient requires immediate resuscitation.`}]},{id:`change`,prompt:`A later rhythm check shows VF. What is the next pathway decision?`,options:[{id:`a`,label:`Continue the non-shockable sequence unchanged because the arrest began as PEA.`,correct:!1,feedback:`The current rhythm determines the pathway. VF is shockable even when the initial rhythm was PEA.`},{id:`b`,label:`Switch to the shockable-arrest pathway and deliver indicated defibrillation with CPR.`,correct:!0,feedback:`VF has no effective output and requires prompt defibrillation. Reassess the rhythm throughout resuscitation.`},{id:`c`,label:`Delay the next intervention until PE is confirmed as the cause.`,correct:!1,feedback:`A suspected cause must not delay treatment of the current shockable rhythm and ongoing perfusion support.`}]}]},{id:`station-06`,number:6,title:`Asystole`,dispatch:`Unresponsive adult with flat trace`,cluster:`cardiac`,brief:`An adult is found unresponsive with no normal breathing or pulse. The monitor appears flat; an electrode is partly detached.`,viva:`How do you check that this is true asystole? What makes treatment futile, and who/what governs discontinuation?`,change:`A witness reports cold-water exposure before collapse.`,checkpoints:`Correct equipment problems promptly while avoiding CPR delays. Confirm the rhythm appropriately and use the non-shockable pathway. Address reversible causes. Do not shock confirmed asystole or make a termination decision from the rhythm or elapsed time alone; apply current criteria and consultation requirements.`,sources:[{title:`Adult non-traumatic resuscitation CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf`}],sourceNote:`Source for stations 3–6: [Adult non-traumatic resuscitation CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219106/CPG_Resuscitation_Adult-Non-traumatic.pdf).`,decisions:[{id:`priority`,prompt:`The patient has no pulse or normal breathing; the monitor is flat and an electrode is partly detached. What is the priority?`,options:[{id:`a`,label:`Shock immediately in case the flat trace is fine VF without checking the connection.`,correct:!1,feedback:`A detached electrode can misrepresent the rhythm. Correct equipment problems promptly and confirm the rhythm while minimising CPR interruption.`},{id:`b`,label:`Pause compressions until every monitoring fault has been excluded.`,correct:!1,feedback:`Troubleshooting must not cause avoidable CPR delay. The clinical arrest still requires perfusion support.`},{id:`c`,label:`Provide CPR, correct the electrode problem promptly and confirm the rhythm for the appropriate pathway.`,correct:!0,feedback:`Clinical arrest needs immediate CPR. An equipment problem must be corrected so true asystole is not confused with an unreliable trace.`}]},{id:`change`,prompt:`A witness now reports cold-water exposure before collapse. How should this influence the plan?`,options:[{id:`a`,label:`Continue resuscitation, address the newly identified reversible cause and apply current consultation and cessation criteria.`,correct:!0,feedback:`Cold-water exposure changes reversible-cause assessment. Neither a flat rhythm nor elapsed time alone establishes a decision to stop.`},{id:`b`,label:`Discontinue because the initial apparent asystole outweighs the new history.`,correct:!1,feedback:`The rhythm alone cannot govern discontinuation. The new exposure history matters to reversible causes and current criteria.`},{id:`c`,label:`Deliver a shock for hypothermia even if asystole is confirmed.`,correct:!1,feedback:`Confirmed asystole remains non-shockable. The exposure history changes cause management, not the electrical indication for defibrillation.`}]}]},{id:`station-07`,number:7,title:`SVT with deterioration`,dispatch:`Sudden sustained racing heartbeat`,cluster:`cardiac`,brief:`A 28-year-old reports abrupt palpitations. HR 190 regular, narrow QRS, BP 118/76, RR 20, SpO2 98%, GCS 15; no chest pain.`,viva:`Explain re-entry and how vagal stimulation may interrupt an AV-node-dependent circuit. Compare sinus tachycardia, flutter and AF. What contraindicates modified Valsalva?`,change:`BP falls to 78/46 with confusion and chest pain.`,checkpoints:`Obtain ECG and determine stability. Modified Valsalva is appropriate only while eligible and stable. On deterioration, stop repeated vagal attempts and seek urgent synchronised-cardioversion capability through the applicable scope/escalation pathway. Do not import an adenosine regimen from another service.`,sources:[{title:`Cardiac arrhythmias via QAS index`,url:`https://www.ambulance.qld.gov.au/clinical/cpm`},{title:`modified Valsalva CPP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0016/219220/cpp_modified-valsalva-manoeuvre.pdf`}],sourceNote:`Sources: [Cardiac arrhythmias via QAS index](https://www.ambulance.qld.gov.au/clinical/cpm), [modified Valsalva CPP](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0016/219220/cpp_modified-valsalva-manoeuvre.pdf).`,decisions:[{id:`priority`,prompt:`At HR 190 with a regular narrow QRS, BP 118/76 and no chest pain, what is the best initial plan?`,options:[{id:`a`,label:`Treat any rate near 190 as an arrest rhythm and deliver unsynchronised defibrillation.`,correct:!1,feedback:`This patient has circulation and is initially stable. ECG assessment and stability guide the tachyarrhythmia pathway.`},{id:`b`,label:`Obtain an ECG, assess eligibility and use modified Valsalva while the patient remains stable.`,correct:!0,feedback:`An AV-node-dependent re-entry circuit may be interrupted by vagal stimulation. Eligibility and stability must be established first.`},{id:`c`,label:`Use an adenosine regimen recalled from another ambulance service before checking local scope.`,correct:!1,feedback:`The study source specifically requires the applicable QAS pathway. A regimen from another service cannot substitute for local scope and instructions.`}]},{id:`change`,prompt:`BP falls to 78/46 with confusion and chest pain. What is the appropriate response?`,options:[{id:`a`,label:`Continue repeated modified Valsalva attempts until the rhythm terminates.`,correct:!1,feedback:`Confusion, chest pain and hypotension indicate instability. Repeated vagal attempts must not delay urgent escalation.`},{id:`b`,label:`Wait for a further ECG change before escalating because the QRS remains narrow.`,correct:!1,feedback:`Haemodynamic deterioration establishes urgency even if the rhythm appearance is unchanged.`},{id:`c`,label:`Stop repeated vagal attempts and urgently seek synchronised-cardioversion capability through the applicable pathway.`,correct:!0,feedback:`The rhythm is now associated with compromised perfusion. Urgent appropriate support and the unstable-tachyarrhythmia pathway take priority.`}]}]},{id:`station-08`,number:8,title:`Stroke`,dispatch:`New speech difficulty and weakness`,cluster:`neuro-medical`,brief:`A 74-year-old has new aphasia and right-sided weakness. Last known well was 50 minutes ago. BP 188/102, HR 92 irregular, RR 18, SpO2 96%, BGL 6.4. They usually live independently and take apixaban.`,viva:`Explain ischaemic versus haemorrhagic stroke, penumbra and common mimics. Why are last-known-well, premorbid function and anticoagulants important?`,change:`Family reveals symptoms were actually present on waking; last known well was the previous evening.`,checkpoints:`Primary survey, glucose, focused neurological examination, NIHSS-8 and premorbid mRS; appropriate referral/destination and prenotification. Do not exclude treatment solely because onset is uncertain; specialist imaging selection matters. Imaging is needed to distinguish stroke types. Manage swallowing risk; do not give empirical aspirin or lower BP simply to normalise the number.`,sources:[{title:`Stroke and TIA CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219060/CPG_Stroke-and-Transient-ischaemic-attack.pdf`}],sourceNote:`Source: [Stroke and TIA CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219060/CPG_Stroke-and-Transient-ischaemic-attack.pdf).`,decisions:[{id:`priority`,prompt:`With aphasia, right-sided weakness, BGL 6.4 and reported onset 50 minutes ago, which initial plan best supports treatment selection?`,options:[{id:`a`,label:`Perform focused neurological assessment, NIHSS-8 and premorbid mRS; establish last known well and anticoagulant history and pre-notify.`,correct:!0,feedback:`The examination, timing, usual function and apixaban history inform specialist treatment and destination decisions. Imaging is needed to determine stroke type.`},{id:`b`,label:`Give empirical aspirin because the focal deficit makes ischaemia certain.`,correct:!1,feedback:`Clinical findings cannot reliably distinguish ischaemic from haemorrhagic stroke. Imaging is required before assuming the stroke type.`},{id:`c`,label:`First lower BP to a normal range, then arrange referral if the deficits persist.`,correct:!1,feedback:`The source advises against lowering BP simply to normalise the number. Assessment and time-critical referral must proceed.`}]},{id:`change`,prompt:`The symptoms were present on waking and last known well was the previous evening. What changes?`,options:[{id:`a`,label:`Cancel the specialist referral because an uncertain onset excludes all acute treatment.`,correct:!1,feedback:`Uncertain onset alone does not exclude treatment. Specialist imaging selection may still identify treatment options.`},{id:`b`,label:`Correct the timing history, continue the stroke pathway and let specialist imaging guide treatment eligibility.`,correct:!0,feedback:`Last known well changes the referral information. The specialist team needs accurate timing and imaging rather than automatic exclusion.`},{id:`c`,label:`Retain the original 50-minute onset because the patient was first noticed symptomatic then.`,correct:!1,feedback:`First noticed symptoms and last known well are different. Accurate timing is essential to treatment selection.`}]}]},{id:`station-09`,number:9,title:`COPD exacerbation`,dispatch:`Worsening breathlessness and sputum`,cluster:`respiratory`,brief:`A 71-year-old with COPD has increased dyspnoea and sputum. HR 112, BP 138/78, RR 30, SpO2 84% room air, GCS 15. Wheeze and prolonged expiration are present.`,viva:`Explain airflow limitation, air trapping and V/Q mismatch. Why is controlled oxygen appropriate? Compare pneumonia, PE and cardiac failure.`,change:`SpO2 reaches 90%, but the patient becomes drowsy with shallow breathing.`,checkpoints:`Target oxygen appropriately, give indicated bronchodilators/steroid and minimise exertion. The saturation alone does not establish adequate ventilation. Escalate ventilatory support for failure; do not dismiss drowsiness because the target saturation has been reached.`,sources:[{title:`COPD CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0028/219097/cpg_chronic-obstructive-pulmonary-disease.pdf`}],sourceNote:`Source: [COPD CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0028/219097/cpg_chronic-obstructive-pulmonary-disease.pdf).`,decisions:[{id:`priority`,prompt:`A patient with COPD has SpO2 84%, RR 30 and prolonged expiration. Which initial approach best addresses the physiology?`,options:[{id:`a`,label:`Withhold oxygen because COPD makes hypoxaemia an acceptable baseline.`,correct:!1,feedback:`The source supports appropriately targeted oxygen. Airflow limitation and V/Q mismatch can produce dangerous hypoxaemia.`},{id:`b`,label:`Focus on oxygen saturation alone and defer bronchodilator assessment.`,correct:!1,feedback:`Oxygen addresses hypoxaemia but does not reverse airflow obstruction. Treatment and reassessment must include ventilation and indicated bronchodilators.`},{id:`c`,label:`Use controlled oxygen, indicated bronchodilators and steroid, minimise exertion and reassess breathing.`,correct:!0,feedback:`Airflow limitation and air trapping impair gas exchange. Targeted oxygen and indicated obstructive-airway treatment address different parts of the problem.`}]},{id:`change`,prompt:`SpO2 reaches 90%, but the patient becomes drowsy with shallow breathing. What is the key response?`,options:[{id:`a`,label:`Assess ventilation urgently and escalate ventilatory support for respiratory failure.`,correct:!0,feedback:`A target saturation does not establish adequate ventilation. Drowsiness with shallow breaths signals possible ventilatory failure.`},{id:`b`,label:`Continue observation without changing the plan because the oxygen target has been reached.`,correct:!1,feedback:`The saturation can look acceptable while ventilation fails. The change in consciousness and breathing requires immediate reassessment.`},{id:`c`,label:`Reduce respiratory monitoring and focus on sputum because gas exchange has improved.`,correct:!1,feedback:`Oxygenation is only one part of respiratory assessment. Declining consciousness and shallow breathing are critical changes.`}]}]},{id:`station-10`,number:10,title:`Croup`,dispatch:`Child with noisy distressed breathing`,cluster:`respiratory`,brief:`A 3-year-old, 15 kg, has barking cough, hoarseness and stridor at rest after two days of coryza. HR 160, RR 42, SpO2 91%, temperature 38.0 C. Handling worsens distress.`,viva:`Explain subglottic swelling. Contrast epiglottitis, foreign body and anaphylaxis. Explain nebulised adrenaline versus corticosteroid effects.`,change:`Stridor becomes quieter, but air entry and consciousness worsen.`,checkpoints:`Preserve comfort with caregiver, minimise distress, assess Westley score and treat severity. Reduced sound may reflect reduced airflow. Prepare support for obstruction/failure, request help and transport. Avoid forcing a throat examination or assuming quieter breathing means recovery.`,sources:[{title:`Croup CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/219098/CPG_Croup.pdf`}],sourceNote:`Source: [Croup CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0029/219098/CPG_Croup.pdf).`,decisions:[{id:`priority`,prompt:`A 3-year-old has stridor at rest, SpO2 91% and distress worsened by handling. What should guide your initial care?`,options:[{id:`a`,label:`Inspect the throat forcefully to confirm the anatomical obstruction before treating.`,correct:!1,feedback:`Agitation worsens distress and can compromise this child. Avoid forcing a throat examination.`},{id:`b`,label:`Keep the caregiver close, minimise distress, assess severity and provide indicated treatment and support.`,correct:!0,feedback:`Subglottic swelling narrows the airway. Comfort and minimal handling help preserve breathing while severity guides treatment.`},{id:`c`,label:`Wait for stridor to disappear before deciding whether airway support is necessary.`,correct:!1,feedback:`Stridor at rest and hypoxaemia already warrant severity assessment and treatment. Quieter noise can also accompany reduced airflow.`}]},{id:`change`,prompt:`Stridor becomes quieter while air entry and consciousness worsen. What does this mean for your response?`,options:[{id:`a`,label:`The quieter sound confirms reduced swelling, so reduce intervention.`,correct:!1,feedback:`Sound requires airflow. A quieter airway with poor air entry and consciousness can indicate worsening obstruction or failure.`},{id:`b`,label:`Reassure the caregiver and repeat only a noise assessment before escalating.`,correct:!1,feedback:`Noise alone cannot establish ventilation. Poor air entry and declining consciousness demand urgent support.`},{id:`c`,label:`Recognise impending obstruction or failure, request help, prepare respiratory support and expedite transport.`,correct:!0,feedback:`The combined fall in air entry and consciousness indicates deterioration despite less audible stridor. Support and escalation must be urgent.`}]}]},{id:`station-11`,number:11,title:`Acute cardiogenic pulmonary oedema`,dispatch:`Sudden severe breathlessness when lying`,cluster:`respiratory`,brief:`A 76-year-old with heart failure develops abrupt orthopnoea and pink frothy sputum. BP 204/112, HR 122, RR 36, SpO2 80%; widespread crackles, GCS 15.`,viva:`Explain raised pulmonary hydrostatic pressure, reduced compliance and impaired gas exchange. What do GTN and CPAP change physiologically?`,change:`During treatment BP falls to 86/54 and the patient becomes drowsy.`,checkpoints:`Position, oxygen/ventilatory support and haemodynamically appropriate therapies; investigate ACS/arrhythmia triggers. Reassess suitability of nitrates and non-invasive support when perfusion/consciousness changes. Recognise possible cardiogenic shock and obtain advanced support.`,sources:[{title:`APO CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219095/cpg_acute-pulmonary-oedema.pdf`}],sourceNote:`Source for stations 11–12: [APO CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219095/cpg_acute-pulmonary-oedema.pdf).`,decisions:[{id:`priority`,prompt:`With orthopnoea, pink frothy sputum, crackles, SpO2 80% and BP 204/112, which initial plan fits best?`,options:[{id:`a`,label:`Position for breathing, support oxygenation and ventilation, assess haemodynamically appropriate therapies and look for a trigger.`,correct:!0,feedback:`Raised pulmonary hydrostatic pressure impairs gas exchange and compliance. Respiratory support and therapies suited to the actual circulation address these threats.`},{id:`b`,label:`Give fluid first to improve oxygen delivery because the saturation is low.`,correct:!1,feedback:`Low saturation does not establish volume depletion. In this presentation raised pulmonary hydrostatic pressure is central to the problem.`},{id:`c`,label:`Delay respiratory support until an ACS or arrhythmia trigger is confirmed.`,correct:!1,feedback:`Severe hypoxaemia needs immediate support. Trigger assessment should proceed alongside stabilisation.`}]},{id:`change`,prompt:`During treatment BP falls to 86/54 and the patient becomes drowsy. Which reassessment is most important?`,options:[{id:`a`,label:`Continue the initial nitrate and non-invasive support plan unchanged because the starting BP was high.`,correct:!1,feedback:`Current perfusion and consciousness determine suitability. The original hypertension no longer describes the patient’s haemodynamics.`},{id:`b`,label:`Reassess nitrate and non-invasive support suitability, recognise possible cardiogenic shock and seek advanced support.`,correct:!0,feedback:`Hypotension and drowsiness indicate compromised perfusion and may alter the safety of ongoing therapies. Advanced support is required.`},{id:`c`,label:`Treat the drowsiness as a sign of reduced distress because the initial respiratory rate was high.`,correct:!1,feedback:`Reduced consciousness with hypotension is deterioration. Comfort cannot be inferred from a quieter or less responsive patient.`}]}]},{id:`station-12`,number:12,title:`Acute pulmonary oedema of non-cardiogenic origin`,dispatch:`Breathlessness after water incident`,cluster:`respiratory`,brief:`A 30-year-old develops hypoxia and bilateral crackles after submersion. HR 118, BP 104/66, RR 32, SpO2 85%, GCS 14; no heart-failure history.`,viva:`Contrast permeability/lung injury with hydrostatic oedema. Why does frothy sputum not prove LV failure?`,change:`RR falls to 8 with reduced responsiveness.`,checkpoints:`Respiratory support and underlying-cause management. Inadequate breathing needs effective ventilation. Do not automatically reproduce the hypertensive cardiogenic-oedema medication plan. APO describes the syndrome; ACPO identifies a cardiogenic cause.`,sources:[{title:`APO CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219095/cpg_acute-pulmonary-oedema.pdf`}],sourceNote:`Source for stations 11–12: [APO CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219095/cpg_acute-pulmonary-oedema.pdf).`,decisions:[{id:`priority`,prompt:`After submersion, the patient has hypoxaemia and bilateral crackles without a heart-failure history. What is the best initial approach?`,options:[{id:`a`,label:`Assume frothy sputum confirms LV failure and reproduce the hypertensive cardiogenic medication plan.`,correct:!1,feedback:`Frothy sputum and crackles describe pulmonary oedema but do not establish a cardiogenic cause. Lung injury can impair the alveolar barrier.`},{id:`b`,label:`Wait for cardiac history confirmation before providing respiratory support.`,correct:!1,feedback:`Hypoxaemia requires prompt respiratory support regardless of the final cause of the oedema.`},{id:`c`,label:`Support respiration and manage the submersion-related cause while distinguishing lung injury from hydrostatic oedema.`,correct:!0,feedback:`Permeability-related lung injury can cause oedema after submersion. Care should target respiratory impairment and the underlying cause.`}]},{id:`change`,prompt:`RR falls to 8 and responsiveness decreases. What now takes priority?`,options:[{id:`a`,label:`Provide effective ventilation and escalate respiratory support.`,correct:!0,feedback:`Falling respiratory rate with reduced responsiveness indicates inadequate breathing. Oxygen alone cannot substitute for effective ventilation.`},{id:`b`,label:`Interpret the lower RR as recovery because the work of breathing is reduced.`,correct:!1,feedback:`Reduced respiratory effort with declining responsiveness can reflect failure rather than improvement.`},{id:`c`,label:`Prioritise a cardiogenic medication plan before assisting breathing.`,correct:!1,feedback:`The immediate threat is inadequate ventilation. The source cautions against automatically reproducing a cardiogenic-oedema plan.`}]}]},{id:`station-13`,number:13,title:`Asthma progressing to respiratory failure`,dispatch:`Child struggling to breathe`,cluster:`respiratory`,brief:`An 8-year-old, 27 kg, with asthma has persistent distress despite reliever use. HR 150, RR 38, BP 104/66, SpO2 88%, short words and widespread wheeze.`,viva:`Explain smooth-muscle constriction, mucosal inflammation and mucus. Why do inhaled drugs become difficult to deliver in severe obstruction?`,change:`RR becomes 12 and shallow, wheeze disappears, air entry is minimal and consciousness falls.`,checkpoints:`Recognise life-threatening deterioration. Bronchodilator and indicated IM adrenaline treatment, oxygen, ventilatory assistance when inadequate, early support and transport. Avoid excessive ventilation and allow expiration. Corticosteroids are adjuncts, not immediate rescue; magnesium for asthma requires CCP capability under the published regimen.`,sources:[{title:`Asthma CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/219096/CPG_Asthma.pdf`}],sourceNote:`Source: [Asthma CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/219096/CPG_Asthma.pdf).`,decisions:[{id:`priority`,prompt:`The child has SpO2 88%, short words and persistent respiratory distress despite reliever use. Which initial plan is strongest?`,options:[{id:`a`,label:`Rely on a corticosteroid alone and wait for its effect before escalating.`,correct:!1,feedback:`Corticosteroids are adjuncts with no immediate rescue role. Severe obstruction and hypoxaemia require prompt respiratory treatment and support.`},{id:`b`,label:`Provide oxygen and indicated bronchodilator treatment, assess need for IM adrenaline and request early support and transport.`,correct:!0,feedback:`Smooth-muscle constriction, inflammation and mucus impair airflow. Severe obstruction can limit inhaled drug delivery, so deterioration and support needs require early attention.`},{id:`c`,label:`Begin an independent magnesium regimen because severe asthma automatically expands ACP2 scope.`,correct:!1,feedback:`The supplied source places the published magnesium regimen within CCP capability. Severity requires escalation rather than assumed scope expansion.`}]},{id:`change`,prompt:`RR becomes 12 and shallow, wheeze disappears, air entry is minimal and consciousness falls. What is the priority?`,options:[{id:`a`,label:`Observe for recovery because loss of wheeze indicates bronchodilation.`,correct:!1,feedback:`A silent chest with minimal air entry and reduced consciousness indicates life-threatening airflow failure.`},{id:`b`,label:`Use rapid repetitive ventilation without allowing time for expiration.`,correct:!1,feedback:`Obstruction causes air trapping. The source requires avoiding excessive ventilation and allowing expiration.`},{id:`c`,label:`Assist inadequate ventilation, allow expiration and urgently escalate with indicated rescue treatment.`,correct:!0,feedback:`The child is failing to ventilate. Respiratory assistance and urgent support are needed, with care to avoid worsening air trapping.`}]}]},{id:`station-14`,number:14,title:`Anaphylaxis`,dispatch:`Child deteriorating after food`,cluster:`respiratory`,brief:`An 8-year-old, 25 kg, develops lip swelling, hoarseness, wheeze, hives and vomiting after food. HR 150, BP 78/42, RR 36, SpO2 90%.`,viva:`Explain mediator-driven vascular leak, vasodilation and bronchoconstriction. Link adrenaline receptor effects to the patient's problems. Why is antihistamine insufficient?`,change:`Airway symptoms and shock persist after initial IM treatment.`,checkpoints:`Prompt IM adrenaline, oxygen/airway support, safe positioning without walking, repeated assessment and indicated repeats. Escalate refractory disease. Arrange approval for ACP2 paediatric fluids. The current QAS age band gives 300 micrograms IM for this child; verify preparation and repeats in the DTP.`,sources:[{title:`Anaphylaxis CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/308718/CPG_Anaphylaxis.pdf`}],sourceNote:`Source: [Anaphylaxis CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0027/308718/CPG_Anaphylaxis.pdf).`,decisions:[{id:`priority`,prompt:`After food exposure, the child has hoarseness, wheeze, hives, vomiting and BP 78/42. What is the first treatment priority?`,options:[{id:`a`,label:`Prompt IM adrenaline with airway and oxygen support and safe positioning without walking.`,correct:!0,feedback:`Mediator-driven vasodilation, leak and bronchoconstriction threaten circulation and breathing. Adrenaline targets these mechanisms; airway support and safe positioning accompany it.`},{id:`b`,label:`Use an antihistamine first and reassess before deciding about adrenaline.`,correct:!1,feedback:`Antihistamine is insufficient for the airway and shock features. Delaying adrenaline leaves the life-threatening mechanisms untreated.`},{id:`c`,label:`Have the child walk to the stretcher while preparing treatment to minimise scene time.`,correct:!1,feedback:`The source requires safe positioning without walking. Shock and airway compromise need immediate treatment and supported movement.`}]},{id:`change`,prompt:`Airway symptoms and shock persist after initial IM treatment. Which response is appropriate?`,options:[{id:`a`,label:`Wait for skin findings to resolve before repeating treatment or escalating.`,correct:!1,feedback:`Airway compromise and shock determine urgency. Skin findings cannot be used as the endpoint for resuscitation.`},{id:`b`,label:`Reassess, give indicated repeats, escalate refractory disease and arrange approval for ACP2 paediatric fluids.`,correct:!0,feedback:`Persistent mediator effects can continue to impair airway and perfusion. The source calls for indicated repeats, escalation and the stated paediatric-fluid approval pathway.`},{id:`c`,label:`Move directly to a fluid intervention without further airway assessment or checking the approval pathway.`,correct:!1,feedback:`Persistent airway symptoms need ongoing assessment and support. The supplied ACP2 paediatric-fluid pathway requires approval.`}]}]},{id:`station-15`,number:15,title:`Sepsis with shock`,dispatch:`Fever confusion and poor perfusion`,cluster:`neuro-medical`,brief:`A 68-year-old has dysuria, flank pain, fever, confusion and oliguria. HR 128, BP 84/48, RR 30, SpO2 93%, temperature 39.2 C, BGL 14.6, GCS 14.`,viva:`Explain infection with organ dysfunction, vascular leak and vasodilation. Is a raised BGL sufficient to diagnose DKA? What supports a urinary source?`,change:`Perfusion remains poor after an initial assessed fluid intervention.`,checkpoints:`Treat immediate threats, monitor, titrate fluid to response, escalate persistent shock and pre-notify urgently. Appropriate antibiotics/source control are required in the care continuum. Do not routinely give ceftriaxone for urinary sepsis under the meningococcal indication.`,sources:[{title:`Sepsis CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219052/cpg_sepsis.pdf`}],sourceNote:`Source: [Sepsis CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219052/cpg_sepsis.pdf).`,decisions:[{id:`priority`,prompt:`Fever, urinary symptoms, confusion, oliguria and BP 84/48 are present. What is the best initial clinical priority?`,options:[{id:`a`,label:`Treat BGL 14.6 as sufficient proof of DKA and centre the plan on insulin.`,correct:!1,feedback:`Raised glucose alone does not diagnose DKA. Infection with organ dysfunction and shock needs immediate assessment and support.`},{id:`b`,label:`Give ceftriaxone under its meningococcal indication solely because urinary sepsis is suspected.`,correct:!1,feedback:`The supplied source specifically excludes routine ceftriaxone use for urinary sepsis under that indication.`},{id:`c`,label:`Treat immediate threats, monitor perfusion, titrate appropriate fluid to response and urgently pre-notify and transport.`,correct:!0,feedback:`Infection-related vasodilation and vascular leak can compromise organ perfusion. Support, response-guided fluid and urgent escalation are required.`}]},{id:`change`,prompt:`Perfusion remains poor after an initial assessed fluid intervention. What next?`,options:[{id:`a`,label:`Reassess response and escalate persistent shock while expediting definitive care.`,correct:!0,feedback:`Persistent poor perfusion requires reassessment and escalation. Antibiotics and source control are needed in the care continuum.`},{id:`b`,label:`Continue fluid without reassessing because hypotension always indicates remaining volume depletion.`,correct:!1,feedback:`The source requires titration to response. Persistent shock needs reassessment and escalation, not an unassessed fixed approach.`},{id:`c`,label:`Delay transport until the urinary source is confirmed on scene.`,correct:!1,feedback:`Ongoing organ hypoperfusion is urgent. Source confirmation must not postpone escalation and definitive care.`}]}]},{id:`station-16`,number:16,title:`Hypoglycaemia`,dispatch:`Confusion after missed meal`,cluster:`neuro-medical`,brief:`A 46-year-old taking insulin is sweaty, confused and unable to swallow safely after missing lunch. BGL 2.1, HR 116, BP 132/78, RR 20, SpO2 97%, GCS 11.`,viva:`Explain neuroglycopenia and sympathetic symptoms. Compare glucose replacement with glucagon. When could glucagon be less effective?`,change:`Glucose and consciousness improve, but the patient reports a similar episode yesterday.`,checkpoints:`Protect airway, use a safe glucose route, recheck response and investigate cause. IV glucose is first-line when oral administration is unsafe and access is feasible; use the appropriate alternative when needed. Recovery alone does not establish suitability for non-transport; assess recurrence and mandatory transport criteria.`,sources:[{title:`Hypoglycaemia CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0024/219048/CPG_Diabetic-emergency-Hypoglycaemia.pdf`}],sourceNote:`Source: [Hypoglycaemia CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0024/219048/CPG_Diabetic-emergency-Hypoglycaemia.pdf).`,decisions:[{id:`priority`,prompt:`BGL is 2.1 and the patient cannot swallow safely. Which initial plan is appropriate?`,options:[{id:`a`,label:`Give oral glucose despite reduced consciousness because it avoids vascular access.`,correct:!1,feedback:`Unsafe swallowing creates airway risk. Glucose must be delivered by a safe route.`},{id:`b`,label:`Protect the airway and use IV glucose when feasible, with the appropriate alternative if needed; recheck response.`,correct:!0,feedback:`Neuroglycopenia requires glucose replacement. The source prioritises IV glucose when oral treatment is unsafe and access is feasible.`},{id:`c`,label:`Wait for spontaneous recovery before treating because the missed meal explains the low BGL.`,correct:!1,feedback:`An identified cause does not remove the immediate danger of neuroglycopenia. Airway protection and safe correction are required.`}]},{id:`change`,prompt:`Glucose and consciousness improve, but a similar episode occurred yesterday. What should guide disposition?`,options:[{id:`a`,label:`The improved BGL alone establishes suitability to remain at home.`,correct:!1,feedback:`A corrected glucose does not resolve recurrence risk. The source requires cause assessment and mandatory transport criteria.`},{id:`b`,label:`A second episode rules out insulin-related hypoglycaemia and ends the glucose assessment.`,correct:!1,feedback:`Repeated episodes require investigation rather than exclusion by assumption. Continue reassessment and review the cause.`},{id:`c`,label:`Investigate recurrence, reassess stability and apply the mandatory transport criteria before deciding disposition.`,correct:!0,feedback:`Recovery treats the immediate neuroglycopenia but does not establish a safe ongoing glucose balance. Recurrence changes risk and disposition.`}]}]},{id:`station-17`,number:17,title:`Suspected DKA`,dispatch:`Vomiting thirst and deep breathing`,cluster:`neuro-medical`,brief:`A 19-year-old with type 1 diabetes and a failed insulin pump has vomiting, abdominal pain and marked thirst. HR 128, BP 94/60, RR 32 deep, SpO2 98%, BGL 28, blood ketones 5.5 mmol/L, GCS 14.`,viva:`Explain insulin deficiency, ketogenesis, osmotic diuresis and compensatory breathing. Compare HHS. Why can total-body potassium depletion coexist with a high serum potassium?`,change:`Consciousness declines and respiratory effort becomes inadequate.`,checkpoints:`Suspect DKA; acid-base confirmation is needed. Assess dehydration, ketones, ECG and precipitant; provide appropriate supportive care and fluid reassessment. Do not initiate an assumed ACP2 insulin regimen. Hospital care requires coordinated fluids, insulin, electrolyte monitoring and cause treatment. Loss of compensatory ventilation is dangerous.`,sources:[{title:`Hyperglycaemia CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219046/CPG_Diabetic-emergency_hyperglycaemia.pdf`}],sourceNote:`Source: [Hyperglycaemia CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219046/CPG_Diabetic-emergency_hyperglycaemia.pdf).`,decisions:[{id:`priority`,prompt:`With failed insulin delivery, BGL 28 and ketones 5.5, which initial plan is best?`,options:[{id:`a`,label:`Suspect DKA, assess dehydration, ECG and precipitant, and provide supportive care with reassessed fluids and urgent transport.`,correct:!0,feedback:`Insulin deficiency promotes ketogenesis and osmotic diuresis. DKA still needs acid-base confirmation, and hospital care coordinates fluids, insulin and electrolytes.`},{id:`b`,label:`Start an assumed ACP2 insulin regimen immediately to stop ketone production.`,correct:!1,feedback:`The source expressly warns against assuming an ACP2 insulin regimen. Definitive correction needs coordinated monitoring and electrolyte care.`},{id:`c`,label:`Treat the deep respiratory pattern as a primary lung problem because SpO2 is normal.`,correct:!1,feedback:`Deep breathing may compensate for metabolic acidosis. A normal saturation does not exclude a metabolic emergency.`}]},{id:`change`,prompt:`Consciousness falls and respiratory effort becomes inadequate. What is the key priority?`,options:[{id:`a`,label:`Wait for respiratory rate to rise again because slower breathing proves reduced acidosis.`,correct:!1,feedback:`Reduced effort with declining consciousness can be loss of compensation. It is a dangerous deterioration.`},{id:`b`,label:`Support inadequate ventilation and escalate urgently, recognising loss of compensatory breathing.`,correct:!0,feedback:`Compensatory ventilation helps offset the metabolic disturbance. Its loss threatens rapid deterioration and needs respiratory support.`},{id:`c`,label:`Focus only on the glucose value because ventilation cannot affect this metabolic problem.`,correct:!1,feedback:`Ventilation is central to compensation for acidosis. Inadequate breathing requires immediate attention alongside the metabolic emergency.`}]}]},{id:`station-18`,number:18,title:`Pulmonary embolism`,dispatch:`Sudden breathlessness after recent surgery`,cluster:`neuro-medical`,brief:`A 38-year-old ten days after surgery develops sudden pleuritic pain and dyspnoea. HR 126, BP 108/70, RR 30, SpO2 89%; one calf is swollen, lungs largely clear.`,viva:`Explain vascular obstruction, dead-space physiology and RV strain. Compare ACS, pneumothorax and pneumonia. Can ECG or saturation exclude PE?`,change:`Syncope occurs and BP falls to 76/44.`,checkpoints:`Support oxygenation, monitor and transport urgently with escalation. Suspect obstructive shock. Use fluids judiciously because RV overload can worsen output. No automatic ACS anticoagulant/lysis regimen for undifferentiated suspected PE; specialist-directed definitive treatment is separate.`,sources:[{title:`PE CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0016/219103/cpg_pulmonary-embolus.pdf`}],sourceNote:`Source: [PE CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0016/219103/cpg_pulmonary-embolus.pdf).`,decisions:[{id:`priority`,prompt:`Recent surgery, sudden pleuritic pain, hypoxaemia, a swollen calf and largely clear lungs are present. Which initial plan is strongest?`,options:[{id:`a`,label:`Exclude a major pulmonary process because auscultation is largely clear.`,correct:!1,feedback:`Pulmonary vascular obstruction can impair gas exchange without marked lung sounds. Clear lungs do not exclude PE.`},{id:`b`,label:`Automatically use the ACS anticoagulant and lysis regimen because the symptoms could be thrombotic.`,correct:!1,feedback:`The source rejects an automatic ACS regimen for undifferentiated suspected PE. Specialist-directed definitive treatment is separate.`},{id:`c`,label:`Suspect PE, support oxygenation, monitor and arrange urgent transport and escalation while retaining alternatives.`,correct:!0,feedback:`Pulmonary vascular obstruction creates dead space and RV strain. The clinical pattern warrants urgent support without claiming confirmation.`}]},{id:`change`,prompt:`Syncope occurs and BP falls to 76/44. How should management change?`,options:[{id:`a`,label:`Recognise possible obstructive shock, urgently escalate and expedite transport; use any fluids judiciously.`,correct:!0,feedback:`Worsening pulmonary obstruction can compromise RV output and systemic perfusion. Excessive RV loading may worsen output, so fluid decisions require care.`},{id:`b`,label:`Give unassessed large-volume fluid until BP normalises before transport.`,correct:!1,feedback:`RV overload can worsen output in this setting. Fluids must be judicious and cannot replace urgent escalation and definitive care.`},{id:`c`,label:`Downgrade urgency because syncope can occur in uncomplicated pain.`,correct:!1,feedback:`Syncope with profound hypotension after this presentation indicates possible obstructive shock. The haemodynamic change is time critical.`}]}]},{id:`station-19`,number:19,title:`Seizure and status epilepticus`,dispatch:`Ongoing convulsions with low oxygen`,cluster:`neuro-medical`,brief:`A 35-year-old has continuous generalised convulsions for six minutes. HR 140, SpO2 86%, BGL 5.8. Family reports missed antiseizure medication.`,viva:`Explain abnormal neuronal excitation and why prolonged seizure is harmful. Compare hypoglycaemia, toxins, intracranial disease and pregnancy-related causes where applicable. Explain midazolam's GABA effect.`,change:`Convulsions stop but RR is 6 with poor chest rise.`,checkpoints:`Protect from injury, support airway/oxygenation, give indicated anticonvulsant without delaying for new IV access and check reversible causes. Count prior benzodiazepines. Reassess ventilation after seizure cessation; treat respiratory depression and escalate refractory seizures.`,sources:[{title:`Seizure CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219059/cpg_seizure.pdf`},{title:`midazolam DTP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0021/219360/dtp_midazolam.pdf`}],sourceNote:`Sources: [Seizure CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219059/cpg_seizure.pdf), [midazolam DTP](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0021/219360/dtp_midazolam.pdf).`,decisions:[{id:`priority`,prompt:`Generalised convulsions have lasted six minutes and SpO2 is 86%, with BGL 5.8. What is the best initial priority?`,options:[{id:`a`,label:`Wait for new IV access before giving any indicated anticonvulsant.`,correct:!1,feedback:`Prolonged seizure is harmful. The source says not to delay indicated anticonvulsant treatment for new IV access.`},{id:`b`,label:`Protect from injury, support airway and oxygenation, give indicated anticonvulsant and check reversible causes and prior benzodiazepines.`,correct:!0,feedback:`Ongoing neuronal excitation threatens oxygenation and causes harm. Treatment must address the seizure and respiratory compromise while accounting for previous medication.`},{id:`c`,label:`Focus on the missed medication history and defer airway support until convulsions stop.`,correct:!1,feedback:`Hypoxaemia is an immediate threat. Airway and oxygenation support must accompany treatment and cause assessment.`}]},{id:`change`,prompt:`Convulsions stop, but RR is 6 with poor chest rise. What next?`,options:[{id:`a`,label:`Treat the absence of convulsions as complete recovery and simply observe.`,correct:!1,feedback:`Seizure cessation does not establish adequate breathing. RR 6 with poor chest rise indicates respiratory compromise.`},{id:`b`,label:`Give further anticonvulsant solely because reduced responsiveness persists.`,correct:!1,feedback:`Reduced responsiveness requires reassessment. The supplied change identifies inadequate ventilation, which needs immediate support.`},{id:`c`,label:`Support inadequate ventilation, reassess respiratory depression and escalate as needed.`,correct:!0,feedback:`Effective ventilation is the immediate priority after seizure cessation. Count prior benzodiazepines and reassess the cause of respiratory depression.`}]}]},{id:`station-20`,number:20,title:`Opioid poisoning`,dispatch:`Reduced responsiveness and shallow breathing`,cluster:`neuro-medical`,brief:`A 31-year-old is barely responsive with pinpoint pupils after suspected opioid use. RR 4 shallow, SpO2 74%, HR 56, BP 94/58, BGL 5.2.`,viva:`Explain opioid-induced respiratory depression and naloxone's competitive antagonism. Why can toxicity recur? How do co-ingestants change interpretation?`,change:`Breathing improves after treatment, but the patient later becomes drowsy again.`,checkpoints:`Airway, adequate oxygenation and ventilation precede naloxone. Monitor recurrence and aspiration; transport. Current QAS adult naloxone is 1.6 mg IM once, not an imported titrated-IV regimen. Persistent coma requires reassessment rather than assuming another opioid dose is the only answer.`,sources:[{title:`Opioid CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219127/cpg_opioids.pdf`},{title:`naloxone DTP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0024/219363/DTP_Naloxone.pdf`}],sourceNote:`Sources: [Opioid CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0022/219127/cpg_opioids.pdf), [naloxone DTP](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0024/219363/DTP_Naloxone.pdf).`,decisions:[{id:`priority`,prompt:`The patient has RR 4, shallow breaths, SpO2 74% and pinpoint pupils. What comes first?`,options:[{id:`a`,label:`Open and support the airway and provide adequate oxygenation and ventilation before naloxone.`,correct:!0,feedback:`Opioids depress respiratory drive. Restoring ventilation addresses the immediate hypoxic threat; naloxone follows within the applicable pathway.`},{id:`b`,label:`Give naloxone and wait for it to work before assisting breathing.`,correct:!1,feedback:`The source prioritises airway and adequate ventilation before naloxone. Severe hypoxaemia cannot wait for an antagonist response.`},{id:`c`,label:`Investigate the exact opioid before providing ventilation because co-ingestants may be present.`,correct:!1,feedback:`Co-ingestants matter to interpretation but do not remove the immediate need to support inadequate breathing.`}]},{id:`change`,prompt:`Breathing improved after treatment, but drowsiness returns. Which response is best?`,options:[{id:`a`,label:`Assume the initial response proves permanent reversal and reduce monitoring.`,correct:!1,feedback:`Opioid toxicity can recur after improvement. Recurrence, aspiration risk and respiratory adequacy need ongoing monitoring and transport.`},{id:`b`,label:`Reassess airway and ventilation, support as needed, consider recurrent toxicity and co-ingestants, and continue monitored transport.`,correct:!0,feedback:`A prior response does not end toxicity risk. Reassessment prevents attributing every recurrence to a single cause or assuming another dose is the only answer.`},{id:`c`,label:`Automatically import a titrated-IV naloxone regimen without assessing breathing or local instructions.`,correct:!1,feedback:`The supplied source specifies the current QAS pathway and warns against an imported titrated-IV regimen. Reassess ventilation and the cause of deterioration.`}]}]},{id:`station-21`,number:21,title:`GHB poisoning`,dispatch:`Partygoer with reduced consciousness`,cluster:`neuro-medical`,brief:`A 24-year-old at a party is deeply drowsy after an unknown liquid and alcohol. RR 7, SpO2 85%, HR 52, BP 92/56, BGL 5.4. Brief jerks occur, and stimulation produces transient arousal.`,viva:`What supports GHB exposure? Why is myoclonus not automatically a seizure? What alternative causes of coma must remain on the list?`,change:`The patient wakes abruptly, becomes distressed and then vomits.`,checkpoints:`Support airway and ventilation, protect against aspiration, monitor and obtain collateral history. There is no specific reversal drug in the QAS GHB pathway. Do not wait for spontaneous recovery when breathing is inadequate; reassess trauma and co-ingestion.`,sources:[{title:`GHB CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219125/cpg_gamma-hydroxybutyrate.pdf`}],sourceNote:`Source: [GHB CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219125/cpg_gamma-hydroxybutyrate.pdf).`,decisions:[{id:`priority`,prompt:`After unknown liquid and alcohol, the patient has RR 7, SpO2 85% and transient arousal with stimulation. What is the initial priority?`,options:[{id:`a`,label:`Wait for spontaneous awakening because transient arousal suggests a self-limited exposure.`,correct:!1,feedback:`Transient arousal does not establish adequate ventilation. The source warns against waiting for recovery when breathing is inadequate.`},{id:`b`,label:`Treat brief jerks as proof of status epilepticus before assessing breathing.`,correct:!1,feedback:`Myoclonus is not automatically seizure activity. Airway and ventilation require immediate support while the differential stays open.`},{id:`c`,label:`Support airway and ventilation, protect against aspiration, monitor and obtain collateral history.`,correct:!0,feedback:`The respiratory depression is immediately dangerous. Suspected GHB has no specific reversal drug in the supplied QAS pathway, so supportive care is central.`}]},{id:`change`,prompt:`The patient wakes abruptly, becomes distressed and vomits. What is the best response?`,options:[{id:`a`,label:`Reassess airway and aspiration risk, continue monitoring and consider trauma and co-ingestion.`,correct:!0,feedback:`Abrupt awakening does not eliminate aspiration risk or alternative causes. Vomiting creates a new airway threat that needs reassessment.`},{id:`b`,label:`End monitoring because abrupt awakening confirms a benign isolated exposure.`,correct:!1,feedback:`The exposure remains uncertain. Vomiting, co-ingestion and possible trauma still matter after consciousness changes.`},{id:`c`,label:`Give a specific GHB reversal drug before addressing vomiting.`,correct:!1,feedback:`The supplied pathway has no specific GHB reversal drug. Airway protection and supportive reassessment are the priorities.`}]}]},{id:`station-22`,number:22,title:`Cannabis-associated illness`,dispatch:`Anxiety after an unknown edible`,cluster:`neuro-medical`,brief:`A 21-year-old reports severe anxiety, palpitations and altered perception after an edible of unknown strength. HR 122, BP 138/82, RR 24, SpO2 98%, BGL 5.6, GCS 15.`,viva:`How does THC alter perception? What distinguishes a tolerable intoxication from dangerous illness? Why ask about synthetic cannabinoids, co-ingestants, chest pain and self-harm intent?`,change:`The patient becomes unusually drowsy with RR 8.`,checkpoints:`Calm surroundings, primary survey, glucose, appropriate ECG and exposure history. Reopen the differential for unexpected respiratory depression; support ventilation rather than attributing everything to cannabis. No dedicated cannabis CPG was identified in the public QAS index; use the poisoned-patient and relevant symptom pathways.`,sources:[{title:`QAS poisoned-patient CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219114/cpg_approach-to-the-poisoned-patient.pdf`},{title:`Queensland Health Adis cannabis information`,url:`https://adis.health.qld.gov.au/drug-profile/cannabis`}],sourceNote:`Sources: [QAS poisoned-patient CPG](https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0018/219114/cpg_approach-to-the-poisoned-patient.pdf), [Queensland Health Adis cannabis information](https://adis.health.qld.gov.au/drug-profile/cannabis).`,decisions:[{id:`priority`,prompt:`The patient is anxious and tachycardic after an edible, but is alert with SpO2 98%. Which initial assessment is best?`,options:[{id:`a`,label:`Accept cannabis as the complete diagnosis and avoid asking about other exposures.`,correct:!1,feedback:`Unknown strength, synthetic cannabinoids and co-ingestants can alter the risk. Exposure history and dangerous symptoms remain important.`},{id:`b`,label:`Provide calm surroundings and a primary survey, check glucose, obtain an appropriate ECG and explore exposure and risk history.`,correct:!0,feedback:`Supportive care starts with assessment. Chest pain, co-ingestants, synthetic products and self-harm intent can change the interpretation and urgency.`},{id:`c`,label:`Treat a normal saturation as sufficient to exclude dangerous intoxication.`,correct:!1,feedback:`A normal saturation does not replace assessment of circulation, consciousness, exposure history and other dangerous symptoms.`}]},{id:`change`,prompt:`The patient becomes unusually drowsy with RR 8. What is the key response?`,options:[{id:`a`,label:`Attribute the change to expected edible effects and continue reassurance alone.`,correct:!1,feedback:`Unexpected respiratory depression requires reopening the differential. Attributing everything to cannabis risks missing another dangerous cause.`},{id:`b`,label:`Wait for the exposure history to be complete before assisting breathing.`,correct:!1,feedback:`Inadequate ventilation is an immediate threat. Support must proceed while history and reassessment continue.`},{id:`c`,label:`Support inadequate ventilation and reassess for co-ingestants or another cause of reduced consciousness.`,correct:!0,feedback:`The change is inconsistent with a reassuring course. The poisoned-patient and relevant symptom pathways guide respiratory support and renewed assessment.`}]}]}],t=[{id:`station-23`,number:23,title:`Long-bone fracture`,dispatch:`Fall with painful deformed thigh`,cluster:`trauma`,brief:`A 40-year-old falls from a ladder and has a deformed thigh. HR 112, BP 108/70, RR 22, SpO2 97%, pain 9/10. A distal pulse is present; sensation is reduced.`,viva:`Explain bleeding, pain and neurovascular risk. What associated injuries would make a particular traction device unsuitable? What changes if the fracture is open?`,change:`After splinting, the foot becomes cooler and the pulse harder to detect.`,checkpoints:`Whole-patient trauma assessment, analgesia, documented neurovascular checks before and after intervention and reassessment of the splint. Use device-specific CPP criteria. Open long-bone injury introduces wound care and cefazolin eligibility; profound shock should prompt a search beyond the obvious fracture.`,sources:[{title:`Extremity injury CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0025/308752/CPG_Extremity-injury.pdf`}]},{id:`station-24`,number:24,title:`Pelvic injury`,dispatch:`Pedestrian struck with pelvic pain`,cluster:`trauma`,brief:`A 68-year-old pedestrian is struck by a vehicle. Pelvic pain, pallor and confusion are present. HR 130, BP 84/50, RR 28, SpO2 96%.`,viva:`Explain concealed pelvic bleeding and binder purpose. Why is pelvic springing inappropriate? What other injuries commonly coexist?`,change:`BP remains low after a correctly applied binder.`,checkpoints:`Suspect major internal bleeding; apply indicated binder correctly under its CPP, minimise unnecessary movement, reassess and expedite trauma care. Persistent shock requires consideration of ongoing pelvic bleeding and other sources, not repeated pelvic manipulation.`,sources:[{title:`Pelvic injury CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219142/cpg_pelvic-injury.pdf`}]},{id:`station-25`,number:25,title:`Major external haemorrhage`,dispatch:`Workplace wound with heavy bleeding`,cluster:`trauma`,brief:`A worker has a deep thigh wound with ongoing heavy bleeding. HR 138, BP 78/46, RR 30, SpO2 98%, temperature 35.2 C, GCS 14.`,viva:`Explain reduced preload and oxygen delivery. Why does normal SpO2 not reassure? Explain TXA and why it cannot replace mechanical haemorrhage control.`,change:`Bleeding continues despite the first intervention.`,checkpoints:`Immediate effective control, reassessment and escalation using appropriate pressure, packing or tourniquet technique. Prevent heat loss, assess COAST/time-based TXA eligibility, consider resuscitation resources and transport. Record interventions and times. Concurrent TBI changes perfusion goals.`,sources:[{title:`Traumatic haemorrhagic shock CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/308753/CPG_Traumatic-haemorrhagic-shock.pdf`},{title:`TXA DTP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0031/219379/DTP_Tranexamic-acid.pdf`}]},{id:`station-26`,number:26,title:`Tension pneumothorax`,dispatch:`Chest injury with severe breathlessness`,cluster:`trauma`,brief:`A 27-year-old after chest trauma has severe distress and markedly reduced left air entry. HR 140, BP 74/48, RR 36, SpO2 82%, GCS 13.`,viva:`Explain rising pleural pressure and impaired venous return. Compare haemothorax and tamponade. Why should you not wait for tracheal deviation?`,change:`The patient deteriorates further during necessary assisted ventilation.`,checkpoints:`Recognise a clinical emergency, provide respiratory support and urgent indicated decompression within authorised procedure/scope. Obtain advanced support and transport. Reassess response and alternative causes of shock rather than assuming one intervention fixes all injuries.`,sources:[{title:`Chest injuries CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219134/cpg_chest-injuries.pdf`},{title:`QAS Clinical Practice Manual: current decompression CPP`,url:`https://www.ambulance.qld.gov.au/clinical/cpm`}]},{id:`station-27`,number:27,title:`Traumatic pneumothorax without tension initially`,dispatch:`Cyclist with painful chest injury`,cluster:`trauma`,brief:`A cyclist strikes the right chest. Pleuritic pain and reduced right air entry are present. HR 102, BP 128/78, RR 24, SpO2 93%, GCS 15.`,viva:`Distinguish simple pneumothorax from tension physiology. How could ventilation or an open wound change management?`,change:`BP falls, dyspnoea increases and air entry worsens.`,checkpoints:`Oxygen as indicated, analgesia, repeated respiratory/perfusion assessment and transport. Do not decompress solely because a pneumothorax is possible; recognise when deterioration changes the indication. For an open wound, use the chest-seal CPP and reassess after application.`,sources:[{title:`Chest injuries CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219134/cpg_chest-injuries.pdf`},{title:`QAS Clinical Practice Manual: current decompression and chest-seal CPPs`,url:`https://www.ambulance.qld.gov.au/clinical/cpm`}]},{id:`station-28`,number:28,title:`Drowning`,dispatch:`Teenager recovered from cold water`,cluster:`trauma`,brief:`A 17-year-old is extracted after approximately six minutes submerged. RR 6 irregular, HR 38, BP 72/40, SpO2 76%, temperature 32.4 C, GCS 7; frothy secretions.`,viva:`Explain hypoxaemia, aspiration-related lung injury and hypothermia. Could seizure, arrhythmia or trauma have preceded the drowning?`,change:`No pulse can be confidently found.`,checkpoints:`Safe rescue environment, airway clearance as needed and effective oxygenation/ventilation immediately. Rewarm and monitor; transition to the applicable resuscitation pathway when indicated. Do not delay ventilation to empty the lungs or for routine immobilisation without a relevant mechanism.`,sources:[{title:`Post-submersion CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0020/219143/cpg_post-submersion.pdf`}]},{id:`station-29`,number:29,title:`Burns with possible inhalation injury`,dispatch:`Child injured near a campfire`,cluster:`trauma`,brief:`A 6-year-old falls into a campfire. Blistering affects the anterior torso and forearms; singed facial hair and new hoarseness are present. HR 150, RR 40, SpO2 95%, GCS 14.`,viva:`Explain thermal injury, evolving airway oedema and delayed fluid losses. How will you estimate burn area in a child? What does pulse oximetry miss in CO exposure?`,change:`Stridor develops and the voice becomes weaker.`,checkpoints:`Recognise threatened airway; request appropriate airway expertise urgently. Stop burning, provide appropriate cooling while maintaining body temperature, analgesia and coverage. Do not let burn-area calculations delay airway care. Obtain consultation for paediatric burn fluids; investigate other causes of early shock.`,sources:[{title:`Burns CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0019/219133/CPG_Burns.pdf`}]},{id:`station-30`,number:30,title:`Post-tonsillectomy haemorrhage`,dispatch:`Child vomiting blood after surgery`,cluster:`trauma`,brief:`A 9-year-old, 30 kg, seven days after tonsillectomy is repeatedly swallowing and has vomited fresh blood. HR 138, BP 92/58, RR 26, SpO2 96%, pale but alert.`,viva:`Explain secondary bleeding and why visible blood loss may underestimate severity. How do airway and circulatory priorities interact? Explain TXA's mechanism.`,change:`Bleeding appears to stop and the parent asks to remain home.`,checkpoints:`Position to protect the airway as clinical status permits, prepare suction/support, monitor perfusion and transport even if bleeding stops. Keep nil by mouth and avoid direct out-of-hospital haemorrhage-control manipulation. Consider TXA for active haemorrhage without delaying definitive ENT care. For 30 kg, 15 mg/kg is 450 mg IV over 10 minutes, single dose; check the DTP before rehearsal.`,sources:[{title:`Post-tonsillectomy haemorrhage CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0028/308755/CPG_Post-tonsillectomy-haemorrhage.pdf`},{title:`TXA DTP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0031/219379/DTP_Tranexamic-acid.pdf`}]},{id:`station-31`,number:31,title:`Gastrointestinal bleeding`,dispatch:`Adult vomiting blood with weakness`,cluster:`trauma`,brief:`A 58-year-old with cirrhosis has haematemesis and black stools. HR 124, BP 88/54, RR 26, SpO2 96%, GCS 14.`,viva:`Compare varices, ulcers and Mallory-Weiss tear. Explain portal hypertension and haemorrhagic shock. Why might antibiotics be indicated in this patient?`,change:`Vomiting recurs and consciousness declines.`,checkpoints:`Protect airway, support perfusion, keep nil by mouth and transport/pre-notify. Assess liver disease, anticoagulants and NSAIDs. Check ceftriaxone's specific UGIB indication. Do not give TXA merely because bleeding is present: GI bleeding is not a listed routine indication in the reviewed QAS DTP. Hospital treatment may include endoscopy and blood products.`,sources:[{title:`Upper GI bleeding CPG`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0023/308741/CPG_Upper-gastrointestinal-bleeding.pdf`}]},{id:`station-32`,number:32,title:`Hypovolaemia from non-haemorrhagic losses`,dispatch:`Older adult with prolonged vomiting`,cluster:`neuro-medical`,brief:`A 70-year-old has vomiting and diarrhoea for two days with minimal intake. HR 118, BP 88/54, RR 24, SpO2 96%, temperature 37.4 C, BGL 6.8, dry mouth and reduced urine output.`,viva:`Explain reduced preload and compensatory responses. Compare dehydration, sepsis, haemorrhage and cardiogenic shock. What does heart or kidney failure change?`,change:`The patient develops crackles and greater dyspnoea during fluid treatment.`,checkpoints:`Treat poor perfusion while assessing cause. Reassess fluid need and respiratory findings; stop and reconsider an intervention causing deterioration. Do not use a universal large-volume strategy. Evaluate electrolytes/renal function and the underlying illness through hospital care.`,sources:[{title:`Sodium chloride DTP`,url:`https://www.ambulance.qld.gov.au/__data/assets/pdf_file/0026/219374/dtp_sodium-chloride-09.pdf`}]}];function n(e,t,n,...r){return{id:e,prompt:t,options:r.map(([e,t],r)=>({id:String.fromCharCode(97+r),label:e,correct:r===n,feedback:t}))}}var r={23:[n(`priority`,`What is the safest initial approach to this thigh injury?`,1,[`Apply traction immediately because a distal pulse is present.`,`A pulse does not establish traction eligibility. Check associated injuries and the device-specific CPP first.`],[`Assess for other injuries, provide analgesia and document neurovascular findings before choosing a splint.`,`The deformity can distract from other injuries. Reduced sensation makes baseline and repeated neurovascular checks essential.`],[`Attribute any profound shock to the femur and finish limb treatment before reassessing.`,`A femoral fracture can bleed, but profound shock requires a search for other bleeding and injuries.`]),n(`change`,`The foot becomes cooler after splinting. What should happen next?`,2,[`Accept reduced perfusion as an expected consequence of immobilisation.`,`A cooler foot and weaker pulse suggest possible new neurovascular compromise and require prompt action.`],[`Increase traction until the limb looks straighter without checking eligibility.`,`Blind adjustment can worsen injury. Reassess the limb and device against the appropriate procedure.`],[`Immediately reassess distal circulation, sensation and the splint, address compromise within the CPP and escalate.`,`The change may reflect pressure, alignment or worsening injury. Reassess promptly, document findings and obtain appropriate support.`])],24:[n(`priority`,`Which action best addresses the immediate threat after this pedestrian impact?`,0,[`Suspect internal bleeding, apply an indicated pelvic binder correctly and expedite trauma care.`,`Shock with this mechanism and pelvic pain warrants haemorrhage-focused care, minimal movement and urgent definitive treatment.`],[`Spring the pelvis repeatedly to determine how unstable it is.`,`Repeated pelvic manipulation can disrupt clot and worsen bleeding; it does not safely quantify injury.`],[`Wait for visible bleeding before treating the circulation.`,`Pelvic bleeding is often concealed. Pallor, confusion, tachycardia and hypotension already indicate a major perfusion problem.`]),n(`change`,`BP stays low after correct binder application. What is the best interpretation?`,1,[`The binder must be ineffective, so repeatedly manipulate the pelvis.`,`Persistent shock does not justify repeated pelvic movement. Check the binder without unnecessary manipulation and search for ongoing bleeding.`],[`Ongoing pelvic bleeding or another source remains possible; reassess and expedite definitive care.`,`A binder is an adjunct. Persistent shock requires whole-patient reassessment, escalation and urgent haemorrhage control.`],[`A correctly fitted binder excludes significant pelvic blood loss.`,`Mechanical stabilisation cannot prove that bleeding has stopped or exclude bleeding elsewhere.`])],25:[n(`priority`,`SpO2 is 98% despite shock. What should lead care?`,2,[`Use the normal saturation to defer haemorrhage control until IV access is established.`,`SpO2 measures the fraction of haemoglobin saturated, not circulating volume, haemoglobin mass or oxygen delivery.`],[`Give TXA as the sole bleeding-control intervention.`,`TXA supports clot stability in eligible patients; it cannot mechanically stop major external blood loss.`],[`Immediately achieve effective mechanical haemorrhage control, prevent heat loss and organise resuscitation and transport.`,`Stopping the loss is the immediate priority. Reassess the effect, record times and che
